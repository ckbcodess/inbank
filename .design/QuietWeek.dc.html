<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400&display=swap">
  <style>
    body { margin: 0; font-family: Geist, system-ui, sans-serif; font-weight: 400; background: oklch(1 0 0); }
    * { box-sizing: border-box; font-weight: 400; }
    a { color: oklch(0.55 0.17 255); text-decoration: none; }
    a:hover { color: oklch(0.48 0.16 255); }
    .t { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="padding: 26px; background: oklch(1 0 0); color: oklch(0.145 0 0); font-size: 14px;">

  <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.556 0 0); margin-bottom: 14px;">What&apos;s coming · a week with nothing due</div>

  <div style="width: 608px; border: 1px solid oklch(0.922 0 0); border-radius: 18px; background: oklch(1 0 0); padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 15px;">What&apos;s coming</div>
      <a href="#" style="font-size: 13px;">Full calendar</a>
    </div>
    <div style="font-size: 12.5px; color: oklch(0.556 0 0); margin-top: 4px;">Marked items need you. Everything else runs on its own.</div>

    <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.556 0 0); margin: 20px 0 6px;">Next 7 days</div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.15 150)" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
      <span style="font-size: 13.5px;">Nothing needs you this week</span>
    </div>

    <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.556 0 0); margin: 18px 0 6px;">Later</div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0;">
      <span style="display: flex; flex-direction: column; align-items: center; width: 42px;">
        <span class="t" style="font-size: 15px;">14</span>
        <span style="font-size: 10.5px; color: oklch(0.556 0 0); letter-spacing: 0.04em;">SEP</span>
      </span>
      <span style="flex-grow: 1;">
        <span style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13.5px;">Term deposit matures</span>
          <span style="border-radius: 6px; border: 1px solid oklch(0.55 0.17 255); padding: 1px 7px; font-size: 10.5px; color: oklch(0.55 0.17 255);">Needs you</span>
        </span>
        <span style="display: block; font-size: 12px; color: oklch(0.556 0 0); margin-top: 3px;">Rolls into a new 91-day term unless you say otherwise</span>
      </span>
      <span class="t" style="font-size: 13.5px;">GHS 12,000.00</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
