<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Limits: 6 Livelier Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--page:#ececea;--surf:#fff;--tile:#f4f4f5;--tileh:#ebebed;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--amsoft:#fff6dc;--amtx:#8a5a00;
    --c1:#f59e0b;--c1s:#fef3c7;--c2:#10b981;--c2s:#d1fae5;--c3:#3b82f6;--c3s:#dbeafe;--c4:#8b5cf6;--c4s:#ede9fe;--shadow:0 24px 60px -24px rgba(0,0,0,.3)}
  [data-theme=dark]{--page:#050505;--surf:#141414;--tile:#1c1c1c;--tileh:#262626;--bd:#2a2a2a;--tx:#f5f5f5;--mu:#a3a3a3;--amsoft:#2a2410;--amtx:#f5c542;
    --c1s:#3a2a08;--c2s:#0b2e22;--c3s:#0e2340;--c4s:#251a40;--shadow:0 24px 60px -24px rgba(0,0,0,.9)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  h1,h2,h3,p{margin:0;font-weight:inherit}
  .tab{font-variant-numeric:tabular-nums}
  .bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500}
  .pills,.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
  .seg{background:var(--tile);border-radius:10px;padding:4px}
  .pill,.seg button{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--mu);min-height:36px}
  .pill:hover{background:var(--tile);color:var(--tx)}
  .pill.on,.seg button.on{background:var(--am);color:#111;font-weight:500}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.5;max-width:1000px}
  .note-bar b{color:var(--tx);font-weight:500}
  .stage{padding:32px 16px 80px;display:flex;justify-content:center}
  .modal{width:860px;max-width:100%;min-height:600px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);display:flex;overflow:hidden}
  .side{width:220px;background:color-mix(in srgb,var(--tile) 50%,var(--surf));border-right:1px solid var(--bd);padding:24px 12px;display:flex;flex-direction:column;gap:2px;flex:none}
  .side .g{font-size:12px;color:var(--mu);padding:12px 8px 4px}
  .side span.i{padding:6px 8px;border-radius:8px;font-size:13px;color:var(--mu);font-weight:500}
  .side span.on{background:var(--am);color:#111}
  .main{flex:1;padding:24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
  @media(max-width:700px){.side{display:none}.main{padding:20px 16px}}
  .ph{font-size:16px;font-weight:500;padding-top:28px}
  .mu{color:var(--mu)} .s12{font-size:12px} .s13{font-size:13px} .lr{line-height:1.6}
  .rowi{display:flex;align-items:center;gap:16px;padding:12px;margin:0 -12px;border-radius:10px;cursor:pointer;transition:background .14s}
  .rowi:hover{background:var(--tile)}
  .grow{flex:1;min-width:0}
  .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .ico.r{border-radius:50%}
  .track{height:6px;border-radius:999px;background:var(--tile);overflow:hidden}
  .track i{display:block;height:100%;border-radius:999px;transition:width .4s}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
  .card{border:1px solid var(--bd);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:background .14s}
  .card:hover{background:var(--tile)}
  .big{font-size:20px;letter-spacing:-.01em}
  .chev{color:var(--mu)}
  .pip{width:8px;height:8px;border-radius:50%;flex:none}
  .hero{display:flex;flex-direction:column;gap:4px;padding:8px 0 8px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--surf);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60}
  .scale{position:relative;height:28px}
  .scale .line{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--tile);border-radius:2px}
  .scale .fill{position:absolute;left:0;top:13px;height:2px;border-radius:2px}
  .scale .dot{position:absolute;top:7px;width:14px;height:14px;border-radius:50%;border:3px solid var(--surf);transform:translateX(-50%);box-shadow:0 0 0 1px var(--bd)}
</style>
</head>
<body>
<div class="bar">
  <div class="row">
    <h1>Limits: adding some life</h1>
    <div class="row" style="gap:12px">
      <div class="pills" id="pills"></div>
      <div class="seg" id="use"><button data-u="1" class="on">Spent today</button><button data-u="0">Nothing spent</button></div>
      <div class="seg" id="theme"><button data-t="light" class="on">Light</button><button data-t="dark">Dark</button></div>
    </div>
  </div>
  <p class="note-bar" id="note"></p>
</div>
<div class="stage"><div class="modal">
  <nav class="side">
    <span class="g">You</span><span class="i">Profile</span><span class="i">Preferences</span>
    <span class="g">Safety</span><span class="i">Security</span><span class="i">Linked devices</span><span class="i on">Limits</span><span class="i">Notifications</span>
    <span class="g">More</span><span class="i">Refer a Friend</span>
  </nav>
  <main class="main" id="main"></main>
</div></div>

<script>
const S={v:1,use:true,theme:"light"};
const I={
 bank:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8"/><path d="M3 20h18"/></svg>',
 phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
 bill:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
 globe:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
};
const L=[
 {k:"Bank transfers",c:"GCB and other Ghana banks",lim:20000,max:100000,used:6450,i:"bank",n:1},
 {k:"Mobile money",c:"Wallets, airtime and data",lim:5000,max:20000,used:3820,i:"phone",n:2},
 {k:"Bills",c:"Utilities, TV, school fees",lim:10000,max:50000,used:450,i:"bill",n:3},
 {k:"Outside Ghana",c:"PAPSS and SWIFT",lim:10000,max:100000,used:0,i:"globe",n:4},
];
const used=l=>S.use?l.used:0;
const left=l=>l.lim-used(l);
const pct=l=>Math.round(used(l)/l.lim*100);
const g=n=>"GHS "+n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const g0=n=>"GHS "+n.toLocaleString("en-GB");
const ico=(l,round)=>`<div class="ico${round?" r":""}" style="background:var(--c${l.n}s);color:var(--c${l.n})">${I[l.i]}</div>`;
const near=l=>S.use&&pct(l)>=75;
const NOTES={
 1:"<b>1 · Icons and a spent-today bar.</b> Each kind gets its colour disc and a thin bar of what's gone today. The figure becomes <i>what's left</i>, which is the question people actually have. A bar past 75% turns amber.",
 2:"<b>2 · Tiles.</b> A 2×2 of quiet tiles, each with its icon, the limit large, and the bar. More presence, still no card-in-card.",
 3:"<b>3 · Left today, as the lead.</b> One line up top answers \"how much more can I send?\" across all four, then the rows. The rows stay calm.",
 4:"<b>4 · Where your limit sits.</b> Each row shows a short scale from 0 to the bank's maximum with a dot at your limit, so \"can I raise it?\" is visible without tapping.",
 5:"<b>5 · Icons only.</b> The smallest change: round colour icons, the limit in medium weight, and \"Set by you\" where it applies. No usage, so nothing to back with ledger data.",
 6:"<b>6 · Rings.</b> A small ring per kind shows today's use; the limit sits beside it. Friendlier, more like a fitness app; the most decorative of the six.",
};
const V={
1:()=>`<p class="mu lr" style="max-width:440px">The most you can send in a day. Lowering a limit is instant; raising one needs a code.</p>
<div>${L.map(l=>`<div class="rowi">${ico(l)}<div class="grow" style="display:flex;flex-direction:column;gap:8px">
  <div class="row" style="flex-wrap:nowrap"><span>${l.k}</span><span class="tab">${g(left(l))} <span class="mu s12">left of ${g0(l.lim)}</span></span></div>
  <div class="track"><i style="width:${pct(l)}%;background:${near(l)?"var(--am)":`var(--c${l.n})`}"></i></div>
  </div><span class="chev">›</span></div>`).join("")}</div>`,
2:()=>`<p class="mu lr" style="max-width:440px">The most you can send in a day, for each kind of payment. Tap one to change it.</p>
<div class="grid">${L.map(l=>`<div class="card"><div class="row" style="flex-wrap:nowrap">${ico(l,true)}<span class="chev">›</span></div>
  <div><p class="s13 mu">${l.k}</p><p class="big tab">${g0(l.lim)}</p></div>
  <div class="track"><i style="width:${pct(l)}%;background:${near(l)?"var(--am)":`var(--c${l.n})`}"></i></div>
  <p class="s12 mu tab">${S.use&&used(l)?`${g0(used(l))} spent today`:"Nothing spent today"}</p></div>`).join("")}</div>`,
3:()=>{const tot=L.reduce((a,l)=>a+left(l),0);return `<div class="hero"><p class="s13 mu">You can still send today</p><p class="tab" style="font-size:32px;letter-spacing:-.02em">${g(tot)}</p><p class="s12 mu">Across all four kinds. Resets at midnight.</p></div>
<div>${L.map(l=>`<div class="rowi">${ico(l,true)}<div class="grow"><p>${l.k}</p><p class="s12 mu">${l.c}</p></div>
  <div style="text-align:right"><p class="tab">${g0(l.lim)}</p><p class="s12 tab ${near(l)?"":"mu"}" style="${near(l)?"color:var(--amtx)":""}">${g0(left(l))} left</p></div><span class="chev">›</span></div>`).join("")}</div>`;},
4:()=>`<p class="mu lr" style="max-width:440px">Your daily limit, and how far the bank lets you raise it.</p>
<div>${L.map(l=>{const p=l.lim/l.max*100;return `<div class="rowi" style="align-items:flex-start">${ico(l)}<div class="grow" style="display:flex;flex-direction:column;gap:4px">
  <div class="row" style="flex-wrap:nowrap"><span>${l.k}</span><span class="tab">${g0(l.lim)}</span></div>
  <div class="scale"><div class="line"></div><div class="fill" style="width:${p}%;background:var(--c${l.n})"></div><div class="dot" style="left:${p}%;background:var(--c${l.n})"></div></div>
  <div class="row s12 mu tab" style="flex-wrap:nowrap"><span>0</span><span>Up to ${g0(l.max)}</span></div>
  </div><span class="chev" style="padding-top:10px">›</span></div>`}).join("")}</div>`,
5:()=>`<p class="mu lr" style="max-width:440px">The most you can send in a day. Lowering a limit is instant; raising one needs a code.</p>
<div>${L.map((l,i)=>`<div class="rowi">${ico(l,true)}<div class="grow"><p>${l.k}</p><p class="s12 mu">${l.c}</p></div>
  <div style="text-align:right"><p class="tab" style="font-weight:500">${g(l.lim)}</p>${i===1?'<p class="s12 mu">Set by you</p>':""}</div><span class="chev">›</span></div>`).join("")}</div>`,
6:()=>`<p class="mu lr" style="max-width:440px">What you've sent today against each daily limit.</p>
<div class="grid">${L.map(l=>{const p=pct(l),r=22,c=2*Math.PI*r;return `<div class="card" style="flex-direction:row;align-items:center;gap:16px">
  <svg width="56" height="56" viewBox="0 0 56 56" style="flex:none"><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--tile)" stroke-width="6"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${near(l)?"var(--am)":`var(--c${l.n})`}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 28 28)"/><g transform="translate(19 19)" style="color:var(--c${l.n})">${I[l.i]}</g></svg>
  <div class="grow"><p class="s13 mu">${l.k}</p><p class="tab">${g0(l.lim)}</p><p class="s12 mu tab">${p}% used today</p></div><span class="chev">›</span></div>`}).join("")}</div>`,
};
function render(){
  document.documentElement.dataset.theme=S.theme;
  document.getElementById("pills").innerHTML=[1,2,3,4,5,6].map(k=>`<button class="pill ${S.v===k?"on":""}" data-v="${k}">${k}</button>`).join("");
  document.getElementById("note").innerHTML=NOTES[S.v];
  document.getElementById("main").innerHTML=`<h2 class="ph">Limits</h2>`+V[S.v]();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-v],[data-u],[data-t],.rowi,.card"); if(!t) return;
  if(t.dataset.v) S.v=+t.dataset.v;
  else if(t.dataset.u){S.use=t.dataset.u==="1";seg("use",t);}
  else if(t.dataset.t){S.theme=t.dataset.t;seg("theme",t);}
  else {const el=document.createElement("div");el.className="toast";el.textContent="Opens the change step";document.body.appendChild(el);setTimeout(()=>el.remove(),1400);}
  render();
});
function seg(id,b){document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on",x===b));}
render();
</script>
</body>
</html>
