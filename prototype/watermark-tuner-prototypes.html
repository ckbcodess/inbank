<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Receipt watermark tuner</title>
<style>
  :root { color-scheme: light; font-family: "Open Sans", system-ui, sans-serif; }
  body { margin: 0; background: #f4f4f5; color: #18181b; display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
  aside { padding: 20px; background: #fff; border-right: 1px solid #e4e4e7; display: flex; flex-direction: column; gap: 16px; }
  aside h1 { font-size: 16px; font-weight: 500; margin: 0; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #52525b; }
  label .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  .check { flex-direction: row; align-items: center; gap: 8px; }
  .out { font: 12px ui-monospace, Consolas, monospace; background: #fafafa; border: 1px solid #e4e4e7; border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-all; }
  button { font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; }
  button.primary { background: #ffc423; border-color: #e6a800; color: #18181b; }
  main { display: flex; align-items: flex-start; justify-content: center; padding: 40px 24px; }
  /* Mock of the receipt card: same width as the app's receipt (max-w-xl = 36rem, 14px root) */
  .card { position: relative; width: 504px; min-height: 640px; background: #fafafa; border: 1px solid rgba(0,0,0,0.08); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .content { position: relative; z-index: 1; padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .content .big { font-size: 42px; letter-spacing: -0.01em; margin-top: 16px; }
  .content .muted { font-size: 13px; color: #71717a; }
  .rows { align-self: stretch; margin-top: 32px; display: flex; flex-direction: column; gap: 14px; text-align: left; font-size: 14px; }
  .rows div { display: flex; justify-content: space-between; }
  .rows span:first-child { color: #71717a; }
  #wm { position: absolute; left: 50%; top: 50%; pointer-events: none; user-select: none; }
  #guides { position: absolute; inset: 0; pointer-events: none; display: none; }
  #guides::before, #guides::after { content: ""; position: absolute; background: rgba(255,0,0,0.35); }
  #guides::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  #guides::after { top: 50%; left: 0; right: 0; height: 1px; }
</style>
</head>
<body>
<aside>
  <h1>Receipt watermark tuner</h1>

  <label>Size (% of card width)
    <span class="row"><span></span><span id="v-size"></span></span>
    <input type="range" id="size" min="40" max="200" step="1" value="135" />
  </label>
  <label>Horizontal offset (px)
    <span class="row"><span></span><span id="v-x"></span></span>
    <input type="range" id="x" min="-300" max="300" step="1" value="0" />
  </label>
  <label>Vertical offset (px)
    <span class="row"><span></span><span id="v-y"></span></span>
    <input type="range" id="y" min="-300" max="300" step="1" value="0" />
  </label>
  <label>Opacity (%)
    <span class="row"><span></span><span id="v-op"></span></span>
    <input type="range" id="op" min="2" max="40" step="1" value="8" />
  </label>
  <label>Line weight (px)
    <span class="row"><span></span><span id="v-sw"></span></span>
    <input type="range" id="sw" min="0.25" max="4" step="0.25" value="1" />
  </label>
  <label>Eagle colour
    <input type="color" id="col" value="#71717a" />
  </label>
  <label class="check"><input type="checkbox" id="guide" /> Show centre guides</label>

  <div>
    <div class="out" id="out"></div>
    <p style="margin:8px 0 0"><button class="primary" id="copy">Copy values</button></p>
  </div>
</aside>

<main>
  <div class="card" id="card">
    <svg id="wm" fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="-4.55 -5.46 54 47.5" style="overflow:visible">
      <path id="eagle" fill="none" stroke="#71717a" vector-effect="non-scaling-stroke" fill-rule="evenodd" clip-rule="evenodd" d="M44.9074 6.32962C44.9074 6.32962 40.4102 9.33665 32.6556 12.0057C27.8179 13.673 22.0648 14.4336 22.0688 14.4384C21.1542 15.874 19.7723 16.4979 18.7134 16.7679C19.7946 16.7911 20.5394 16.8694 20.5394 16.8694C22.2522 17.0955 21.8822 17.8073 21.8822 17.8073C22.6014 18.0182 23.1085 18.2771 23.1085 18.2771C24.2113 18.7652 22.8829 20.0298 22.8829 20.0298C22.8956 19.4858 22.4348 19.3635 22.4348 19.3635C22.0544 19.2373 21.5289 19.318 21.5289 19.318C20.5729 19.4283 19.4924 20.0194 19.4924 20.0194C18.1791 20.6897 17.2773 21.3248 17.2773 21.3248C16.3021 21.9192 15.3468 22.6078 15.3468 22.6078C13.9362 19.906 15.3835 17.1554 15.5693 16.8239C10.2763 15.8404 10.2675 10.2945 10.2675 10.2945C10.2619 5.09294 13.7528 0 13.7656 0C12.4276 0.074297 10.5769 0.400245 9.80421 0.690243L8.02843 6.04282L8.0994 1.20872C7.20952 1.50751 6.56045 1.86222 6.17053 2.10188L4.8381 6.94637L4.72567 2.90237C3.94264 3.44322 3.73373 3.66771 3.39325 4.10551L2.48024 8.15589L1.68047 6.75463C-2.30804 13.7641 2.05524 24.0083 2.05524 24.0083L6.41214 24.0019L1.58956 26.945C1.22117 27.8869 0.951658 28.812 0.882286 29.6716L3.07509 29.2482L0.942887 31.267C1.03459 31.8814 1.19725 32.459 1.40776 32.991L3.54076 31.132L1.86307 33.9553C2.72504 35.5763 3.85971 36.5741 3.85971 36.5741C5.63469 28.1857 12.5376 24.8527 12.5376 24.8527L12.5384 28.2001C29.75 26.3722 36.1609 21.9192 39.4445 18.7316L37.0667 17.9847L40.9938 17.0196C41.438 16.5722 41.8853 15.9179 42.1812 15.3819L38.3202 15.0879L42.8478 14.0437C43.1579 13.6115 43.5718 12.5993 43.7368 12.1839L38.7652 12.4851L44.181 10.1747C44.6825 8.44269 44.9074 6.32962 44.9074 6.32962Z" />
    </svg>
    <div class="content">
      <div class="muted">GCB</div>
      <div>To Wallet</div>
      <div class="big">-GHS 150.00</div>
      <div class="muted">12 Aug 2026, 11:09 AM</div>
      <div class="rows">
        <div><span>Status</span><span>Completed</span></div>
        <div><span>Reference</span><span>NIB-2026-950101</span></div>
        <div><span>From Account</span><span>Savings Account (***1100)</span></div>
        <div><span>Recipient</span><span>Ransford Gyasi</span></div>
        <div><span>Total Debited</span><span>GHS 150.00</span></div>
      </div>
    </div>
    <div id="guides"></div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const card = $("card"), wm = $("wm"), eagle = $("eagle"), out = $("out");
  const VB = { x: -4.55, y: -5.46, w: 54, h: 47.5 };

  function update() {
    const size = +$("size").value, x = +$("x").value, y = +$("y").value;
    const op = +$("op").value, sw = +$("sw").value, col = $("col").value;
    $("v-size").textContent = size + "%";
    $("v-x").textContent = x + "px";
    $("v-y").textContent = y + "px";
    $("v-op").textContent = op + "%";
    $("v-sw").textContent = sw + "px";

    // Width is a share of the card, so the eagle scales with the card the way the app's w-[N%] does.
    const cardW = card.clientWidth;
    const w = cardW * size / 100;
    const h = w * VB.h / VB.w;
    wm.setAttribute("width", w);
    wm.setAttribute("height", h);
    wm.style.width = w + "px";
    wm.style.height = h + "px";
    wm.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    wm.style.opacity = op / 100;
    eagle.setAttribute("stroke", col);
    eagle.setAttribute("stroke-width", sw);
    $("guides").style.display = $("guide").checked ? "block" : "none";

    const text = [
      `className="w-[${size}%] text-[${col}]"  (wrapper opacity-[${(op / 100).toFixed(2)}])`,
      `viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}"`,
      `offset: translate(${x}px, ${y}px) from centre`,
      `stroke: ${sw}px non-scaling`,
    ].join("\n");
    out.textContent = text;
  }

  for (const id of ["size", "x", "y", "op", "sw", "col", "guide"]) $(id).addEventListener("input", update);
  $("copy").addEventListener("click", () => navigator.clipboard?.writeText(out.textContent));
  window.addEventListener("resize", update);
  update();
</script>
</body>
</html>
