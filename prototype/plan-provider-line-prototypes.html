<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Provider Line: 5 Ways</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#faf9f8;--card:#ffffff;--tile:#f7f6f5;--bd:#ebebeb;--tx:#0a0a0a;--mu:#737373;--am:#FFC423;--amh:#ffd966;--shadow:0 1px 2px rgba(0,0,0,.04)}
  [data-theme=dark]{--bg:#050505;--card:#111111;--tile:#1a1a1a;--bd:#262626;--tx:#fafafa;--mu:#a1a1a1;--shadow:none}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  h1,h2,p,ul{margin:0;padding:0} ul{list-style:none}
  .tab{font-variant-numeric:tabular-nums}
  .bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500;margin-right:8px}
  .pill{font-size:13px;padding:0 12px;height:36px;border-radius:8px;color:var(--mu)}
  .pill:hover{background:var(--tile);color:var(--tx)}
  .pill.on{background:var(--am);color:#111;font-weight:500}
  .sep{width:1px;height:20px;background:var(--bd);margin:0 4px}
  .note{font-size:12px;color:var(--mu);max-width:820px}
  .stage{display:flex;justify-content:center;padding:32px 16px 64px}
  .screen{width:100%;max-width:1040px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);padding:40px 24px 56px}
  .screen.phone{max-width:390px;padding:20px 12px 40px;border-radius:28px}
  .col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
  .head{display:flex;align-items:center;gap:12px}
  .head svg{color:var(--mu)}
  .title{font-size:22px;font-weight:500;letter-spacing:-.01em}
  .phone .title{font-size:18px}
  .sub{font-size:12px;color:var(--mu);margin-top:2px}
  .photo{position:relative;width:100%;border-radius:10px;background:var(--plan);display:flex;align-items:center;justify-content:center;overflow:hidden;height:clamp(140px,26vh,280px)}
  .photo img{height:100%;width:100%;object-fit:contain}
  .chip{position:absolute;left:12px;bottom:12px;font-size:12px;color:#fff;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px)}
  .desc{font-size:14px;line-height:1.7}
  .meta{font-size:12px;color:var(--mu)}
  .muted{color:var(--mu)}
  .disc{flex:none;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--plan);color:#111;width:32px;height:32px}
  .ben{display:flex;align-items:center;gap:12px;color:var(--mu)}
  .dash{flex:1;height:1px;background:repeating-linear-gradient(to right,var(--bd) 0 6px,transparent 6px 16px)}
  .price{display:flex;align-items:center;gap:16px;color:var(--mu)}
  .price b{font-weight:400;font-size:18px;color:var(--tx)}
  .btn{height:44px;width:100%;border-radius:10px;background:var(--am);color:#111;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center}
  .hint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--mu);text-align:center}
  .mark{display:inline-flex;align-items:center;gap:6px}
  .hl{outline:1px dashed color-mix(in srgb,var(--am) 70%,transparent);outline-offset:4px;border-radius:4px}
</style>
</head>
<body>
<div class="bar">
  <div class="row"><h1>“Powered by StarLife Assurance”</h1><div class="row" id="vars"></div></div>
  <div class="row"><div class="row" id="plans"></div><span class="sep"></span>
    <button class="pill" id="device">Phone</button><button class="pill" id="theme">Light</button><button class="pill" id="mark">Hide outline</button></div>
  <p class="note" id="note"></p>
</div>
<div class="stage"><div class="screen" id="screen"></div></div>
<script>
const PLANS = {
  homecall: { name: "HomeCall Plan", tone: "#ff9b5e", img: "../public/plans/homecall.webp", from: "GHS 8.00", powered: true,
    desc: "Financial support to help your family cover funeral expenses in difficult times.",
    ben: [["payout","Claims paid within 48 to 72 hours of approval"],["family","Cover your spouse, children and parents too"],["accident","Accidental death covered from day one"]] },
  child: { name: "Child Education Plan", tone: "#22a6c9", img: "../public/plans/child-education.webp", from: "GHS 50.00", powered: true,
    desc: "Financial support to help you protect your child’s future and cover unexpected expenses during difficult times.",
    ben: [["payout","Claims paid within 48 to 72 hours of approval"],["school","Your child’s school fees paid if you can’t"]] },
  wealth: { name: "WealthMaster Plan", tone: "#ffd24a", img: "../public/plans/wealthmaster.webp", from: "GHS 50.00", powered: true,
    desc: "Protect your savings and secure your future with a plan that combines savings with financial protection.",
    ben: [["payout","Claims paid within 48 to 72 hours of approval"],["family","Your loved ones are paid if something happens to you"]] },
  ultimate: { name: "Ultimate Protection Plan", tone: "#0fb34c", img: "../public/plans/ultimate-protection.webp", from: "GHS 40.50", powered: false,
    desc: "Protect your earnings and stay financially secure when unexpected events prevent you from working.",
    ben: [["payout","Claims paid within 48 to 72 hours of approval"],["disability","An income if you can never work again"],["illness","Cover if you’re diagnosed with a serious illness"]] },
};
const P = {
  payout:'<path d="M4 10h16M6 6h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Zm2 8h3"/>',
  family:'<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M16 5.5a3 3 0 0 1 0 5.6M18 14.3c1.9.6 3 2.1 3 4.7"/>',
  accident:'<path d="M12 3 5 6v5c0 4.4 3 8.2 7 10 4-1.8 7-5.6 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
  school:'<path d="m2 9 10-5 10 5-10 5L2 9Z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
  disability:'<path d="M12 3 5 6v5c0 4.4 3 8.2 7 10 4-1.8 7-5.6 7-10V6l-7-3Z"/><path d="M12 9v6M9 12h6"/>',
  illness:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/>',
  shield:'<path d="M12 3 5 6v5c0 4.4 3 8.2 7 10 4-1.8 7-5.6 7-10V6l-7-3Z"/>',
  back:'<path d="m14 6-6 6 6 6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
};
const ico = (k, s = 16, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const PW = "Powered by StarLife Assurance";
const hl = () => state.outline ? " hl" : "";

const head = (p, sub = "") => `<div class="head">${ico("back",20)}<div><h2 class="title">${p.name}</h2>${sub}</div></div>`;
const photo = (p, chip = "") => `<div class="photo"><img src="${p.img}" alt="" onerror="this.remove()">${chip}</div>`;
const list = p => `<ul style="display:flex;flex-direction:column;gap:16px">${p.ben.map(([i, t]) => `<li class="ben"><span class="disc">${ico(i,16)}</span><span>${t}</span></li>`).join("")}</ul>`;
const price = p => `<div class="price" style="margin-top:40px"><span class="dash"></span><span class="tab">From <b>${p.from}</b> a month</span><span class="dash"></span></div>`;
const cta = (extra = "") => `<div style="display:flex;flex-direction:column;gap:12px"><button class="btn">Create a Profile</button><p class="hint">${ico("info",14)}You only do it once. We keep your plan for you.</p>${extra}</div>`;

const VARIANTS = [
  { id: "A", label: "A · Muted in the paragraph",
    why: "Same place as now, last sentence of the description, but in the muted colour. The least change: it reads as an aside, not part of the pitch.",
    render: p => `${head(p)}${photo(p)}<p class="desc">${p.desc}${p.powered ? ` <span class="muted${hl()}">${PW}.</span>` : ""}</p>${list(p)}${price(p)}${cta()}` },
  { id: "B", label: "B · Its own meta line",
    why: "The description stops at what the plan does. The provider drops to a 12px muted line right under it, with a small shield. Clear separation, still close to the description.",
    render: p => `${head(p)}${photo(p)}<div style="display:flex;flex-direction:column;gap:8px"><p class="desc">${p.desc}</p>${p.powered ? `<p class="meta mark${hl()}">${ico("shield",12)}${PW}</p>` : ""}</div>${list(p)}${price(p)}${cta()}` },
  { id: "C", label: "C · Caption on the picture",
    why: "A small frosted caption in the picture's bottom corner, like a photo credit. Out of the reading path entirely; the description is only about the customer.",
    render: p => `${head(p)}${photo(p, p.powered ? `<span class="chip${hl()}">${PW}</span>` : "")}<p class="desc">${p.desc}</p>${list(p)}${price(p)}${cta()}` },
  { id: "D", label: "D · Under the title",
    why: "A 12px muted line under the page title, where you'd look for who makes something. Answers 'who provides this?' before the pitch starts, then gets out of the way.",
    render: p => `${head(p, p.powered ? `<p class="sub${hl()}">${PW}</p>` : "")}${photo(p)}<p class="desc">${p.desc}</p>${list(p)}${price(p)}${cta()}` },
  { id: "E", label: "E · Fine print at the end",
    why: "Moves to the very bottom, under the button's hint, as fine print. The quietest: it's there for anyone who checks, and never competes with the pitch.",
    render: p => `${head(p)}${photo(p)}<p class="desc">${p.desc}</p>${list(p)}${price(p)}${cta(p.powered ? `<p class="meta${hl()}" style="text-align:center">${PW}</p>` : "")}` },
];

const state = { v: "A", plan: "homecall", phone: false, dark: true, outline: true };
try { Object.assign(state, JSON.parse(localStorage.getItem("plan-provider-proto") || "{}")); } catch {}
function render() {
  try { localStorage.setItem("plan-provider-proto", JSON.stringify(state)); } catch {}
  document.documentElement.dataset.theme = state.dark ? "dark" : "light";
  const v = VARIANTS.find(x => x.id === state.v), p = PLANS[state.plan];
  document.getElementById("vars").innerHTML = VARIANTS.map(x => `<button class="pill ${x.id === state.v ? "on" : ""}" data-v="${x.id}">${x.label}</button>`).join("");
  document.getElementById("plans").innerHTML = Object.entries(PLANS).map(([k, x]) => `<button class="pill ${k === state.plan ? "on" : ""}" data-p="${k}">${x.name.replace(" Plan", "")}</button>`).join("");
  document.getElementById("device").textContent = state.phone ? "Desktop" : "Phone";
  document.getElementById("theme").textContent = state.dark ? "Light" : "Dark";
  document.getElementById("mark").textContent = state.outline ? "Hide outline" : "Show outline";
  document.getElementById("note").textContent = v.why + (p.powered ? "" : " (Ultimate Protection has no provider line in its copy, so nothing shows.)");
  const s = document.getElementById("screen");
  s.className = "screen" + (state.phone ? " phone" : "");
  s.style.setProperty("--plan", p.tone);
  s.innerHTML = `<div class="col">${v.render(p)}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v) state.v = b.dataset.v;
  else if (b.dataset.p) state.plan = b.dataset.p;
  else if (b.id === "device") state.phone = !state.phone;
  else if (b.id === "theme") state.dark = !state.dark;
  else if (b.id === "mark") state.outline = !state.outline;
  else return;
  render();
});
document.addEventListener("keydown", e => {
  const i = VARIANTS.findIndex(x => x.id === state.v);
  if (e.key === "ArrowRight") { state.v = VARIANTS[(i + 1) % VARIANTS.length].id; render(); }
  if (e.key === "ArrowLeft") { state.v = VARIANTS[(i + VARIANTS.length - 1) % VARIANTS.length].id; render(); }
});
render();
</script>
</body>
</html>
