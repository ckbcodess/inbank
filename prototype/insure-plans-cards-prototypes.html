<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Insure Plans, Card Grid: 8 Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--page:#ececea;--side:#fafafa;--main:#fff;--surf:#fff;--tile:#f4f4f5;--tileh:#ebebed;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--ok:#15803d;--shadow:0 24px 60px -24px rgba(0,0,0,.28);--scrim:rgba(0,0,0,.35)}
  [data-theme=dark]{--page:#050505;--side:#121212;--main:#1a1a1a;--surf:#151515;--tile:#262626;--tileh:#2e2e2e;--bd:#2a2a2a;--tx:#f5f5f5;--mu:#a3a3a3;--ok:#4ade80;--shadow:0 24px 60px -24px rgba(0,0,0,.9);--scrim:rgba(0,0,0,.55)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--page);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
  .tab{font-variant-numeric:tabular-nums}
  .mu{color:var(--mu)} .s12{font-size:12px} .s13{font-size:13px} .s14{font-size:14px}
  .bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .bar h1{font-size:14px;font-weight:500}
  .pills{display:flex;gap:4px;align-items:center;overflow-x:auto;padding:2px 0}
  .pill{flex:none;font-size:13px;padding:8px 12px;border-radius:8px;color:var(--mu);min-height:36px}
  .pill:hover{background:var(--tile);color:var(--tx)} .pill.on{background:var(--am);color:#111;font-weight:500}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.5;max-width:960px}
  .stage{padding:32px 24px 80px;display:flex;flex-direction:column;gap:40px;align-items:center;overflow-x:auto}
  .wrap{width:100%;max-width:1440px;min-width:1100px;scroll-margin-top:130px}
  .cap{font-size:12px;color:var(--mu);margin:0 0 12px 8px}
  .win{position:relative;display:flex;height:880px;border:1px solid var(--bd);border-radius:16px;background:var(--side);box-shadow:var(--shadow);overflow:hidden}
  /* app chrome */
  .side{width:232px;flex:none;padding:16px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
  .logo{padding:2px 12px 20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);margin:0 -12px 24px;padding-left:24px}
  .logo b{color:var(--am);font-size:20px;font-weight:500;letter-spacing:-.04em;font-style:italic}
  .nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:var(--mu);min-height:44px}
  .nav.on{background:var(--am);color:#111;font-weight:500}
  .gap{height:24px}
  .mainwrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--main);border:1px solid var(--bd);border-radius:20px;margin:8px 8px 8px 0;overflow:hidden}
  .top{height:56px;flex:none;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:flex-end;gap:20px;padding:0 24px;color:var(--mu)}
  .top .me{display:flex;align-items:center;gap:12px;margin-left:8px}
  .av{width:32px;height:32px;border-radius:50%;background:#1a73e8;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
  .content{flex:1;overflow-y:auto;padding:48px 32px 64px;scrollbar-width:thin}
  .col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
  .col.wide{max-width:1080px}
  .pt{font-size:22px;font-weight:500;letter-spacing:-.02em}
  .back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--mu);min-height:32px;margin-bottom:4px}
  /* cards */
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:176px;padding:28px;border-radius:20px;background:var(--tile);border:1px solid transparent;width:100%;transition:background .15s,border-color .15s}
  .card:hover{background:var(--tileh)} .card.on{border-color:var(--tx)}
  .card .ct{font-size:22px;font-weight:500;letter-spacing:-.015em}
  .card .cd{font-size:14px;line-height:1.5;color:var(--mu)}
  .disc{position:absolute;top:24px;right:24px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0b0b0c}
  .info{background:var(--tile);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px}
  .info h3{font-size:16px;font-weight:500}
  .hero{border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:20px;position:relative;background:color-mix(in srgb,var(--c) 16%,var(--tile))}
  .btn{height:44px;padding:0 28px;border-radius:16px;background:var(--am);color:#111;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
  .btn:hover{filter:brightness(1.06)} .btn.full{width:100%} .btn.ghost{background:var(--tileh);color:var(--tx)}
  .note{font-size:13px;color:var(--mu)}
  .check{display:flex;flex-direction:column;gap:12px}
  .check li{display:flex;gap:12px;font-size:14px;line-height:1.5}
  .check svg{flex:none;margin-top:3px;color:var(--ok)}
  .facts>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--bd);font-size:13px}
  .facts>div:last-child{border-bottom:1px solid var(--bd)}
  .facts span:first-child{color:var(--mu)} .facts span:last-child{text-align:right}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--bd);font-size:13px;min-height:36px;background:var(--main)}
  .chip.on{border-color:var(--tx)}
  .ctl{display:flex;flex-direction:column;gap:8px}
  .cl{display:flex;justify-content:space-between;font-size:13px}
  input[type=range]{width:100%;accent-color:#d99b00}
  .big{letter-spacing:-.03em;line-height:1.1}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd)}
  .tabs button{padding:12px 16px;font-size:14px;color:var(--mu);border-bottom:2px solid transparent;min-height:44px}
  .tabs button.on{color:var(--tx);border-color:var(--am)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--main);font-size:13px;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.16,1,.3,1);z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .scrim{position:absolute;inset:0;background:var(--scrim)}
  .drawer{position:absolute;top:8px;right:8px;bottom:8px;width:480px;background:var(--main);border:1px solid var(--bd);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
  .cmp{width:100%;border-collapse:collapse;font-size:14px}
  .cmp td,.cmp th{padding:16px 12px;border-top:1px solid var(--bd);text-align:left;vertical-align:top;font-weight:400}
  .cmp th{color:var(--mu);width:160px;font-size:13px}
  .cmp thead th,.cmp thead td{border-top:0}
  .ck{position:absolute;left:20px;bottom:20px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--main);min-height:36px}
  .ck.on{color:#111;background:var(--am);border-color:var(--am)}
  svg text{font-family:'Open Sans',sans-serif}
</style>
</head>
<body>
<header class="bar">
  <h1>Insure plans · desktop card grid · 8 ways to present the plans and open one</h1>
  <nav class="pills" id="pills" aria-label="Variations"></nav>
  <p class="note-bar" id="vnote"></p>
</header>
<main class="stage">
  <section class="wrap"><p class="cap">Plans page · click a plan</p><div class="win" id="listWin"></div></section>
  <section class="wrap" id="detWrap"><p class="cap" id="detCap">Plan page</p><div class="win" id="detWin"></div></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- data (from src/lib/insurance-plans.ts) ---------- */
const PROVIDER='StarLife Assurance';
const plans=[
 {id:'ce',col:'#4da3ff',name:'Child Education Plan',short:'Child Education',line:'Save for school fees with life protection.',
  desc:'Save towards your child’s education, with cover that keeps the plan going if something happens to you.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','School fees are paid even if you can’t','Premiums from GHS 50 a month'],
  from:50,fromTxt:'GHS 50',runs:'10 to 25 years',kind:'save',term:[10,25],pays:'A lump sum, and school fees',
  pitch:'Set school fees aside, and keep them safe',
  facts:[['Policy term','10 to 25 years'],['Premiums from','GHS 50 a month'],['Provider',PROVIDER]],
  cost:'From GHS 50 a month. You choose the premium, or the amount you want at the end, and the other follows.',
  claim:['Your child’s details','Proof of school enrolment, for school fees','A valid ID'],
  who:'Parents who want fees set aside early, with the plan protected if the unexpected happens.'},
 {id:'hc',col:'#ff7a35',name:'HomeCall Plan',short:'HomeCall',line:'Financial support for funeral expenses.',
  desc:'Help your family cover funeral expenses in a difficult time. Cover yourself, and add the people close to you.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','Cover your spouse, children and parents too','Accidental deaths are covered from day one'],
  from:8,fromTxt:'GHS 8',runs:'While you pay',kind:'protect',pays:'GHS 2,500 to GHS 30,000',
  pitch:'Pay for a funeral without borrowing',
  facts:[['Cover','GHS 2,500 to GHS 30,000'],['Premiums from','GHS 8 a month'],['Who it covers','You, and family you add'],['Provider',PROVIDER]],
  cost:'From GHS 8 a month for you. Children cost less, parents more.',
  claim:['The death certificate','The medical certificate of cause of death','A police report, if the death was accidental','A valid ID'],
  who:'Anyone who wants their family spared a funeral bill. Add your spouse, children and parents.'},
 {id:'wm',col:'#ffd466',name:'WealthMaster Plan',short:'WealthMaster',line:'Save regularly with insurance cover.',
  desc:'Save regularly and grow a lump sum, with life cover for the people who depend on you.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','Your loved ones are paid if something happens to you','Premiums from GHS 50 a month'],
  from:50,fromTxt:'GHS 50',runs:'4 to 10 years',kind:'save',term:[4,10],pays:'A lump sum',
  pitch:'Save a lump sum, with cover for the people who depend on you',
  facts:[['Policy term','4 to 10 years'],['Premiums from','GHS 50 a month'],['Provider',PROVIDER]],
  cost:'From GHS 50 a month. You choose the premium, or the amount you want at the end, and the other follows.',
  claim:['Your policy details','Proof of the event, for disability','A valid ID'],
  who:'Regular savers who also want the people who depend on them looked after.'},
 {id:'up',col:'#ff4d4d',name:'Ultimate Protection Plan',short:'Ultimate Protection',line:'Total protection for you and your loved ones.',
  desc:'Keep an income if illness or disability stops you working, and leave your family a lump sum.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','Covers total and permanent disability','Covers critical illness'],
  from:38,fromTxt:'GHS 38',runs:'8 to 20 years',kind:'protect',pays:'GHS 50,000 to GHS 300,000',
  pitch:'Keep an income if you can’t work',
  facts:[['Sum assured','GHS 50,000 to GHS 300,000'],['Policy term','8 to 20 years'],['Disability income','Up to age 70'],['Provider',PROVIDER]],
  cost:'You pick the sum assured and the premium follows. About GHS 38 a month for GHS 50,000 at 30.',
  claim:['A medical report for the illness or disability','A valid ID'],
  who:'People whose income their household relies on.'}
];
const TIERS=[['Basic',2500,8],['Standard',5000,15],['Prestige',10000,22],['Elite',15000,32],['Ultimate',30000,60]];
const SUMS=[50000,100000,200000,300000];
const sumMonthly=s=>s/1000*9/12;
const money=n=>'GHS '+Math.round(n).toLocaleString('en-US');
const qa=p=>[['What does it cover?',p.desc+' '+p.benefits[0]+'.'],['What will it cost me?',p.cost],['When do I get paid?','Within 48 to 72 hours of an approved claim.'],['Can I stop whenever I want?','Yes. You can cancel from the policy page at any time. If a plan pays out when you stop, we show you the exact amount before you confirm.'],['What do I need to make a claim?',p.claim.join(', ')+'.']];

/* ---------- helpers ---------- */
const I={ce:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',hc:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',wm:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',up:'<path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/>'};
const svg=(p,s=18,sw=1.7)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const disc=(p,s=56)=>`<span class="disc" style="background:${p.col};width:${s}px;height:${s}px">${svg(I[p.id],Math.round(s*.43))}</span>`;
const discIn=(p,s=56)=>`<span style="background:${p.col};width:${s}px;height:${s}px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#0b0b0c;flex:none">${svg(I[p.id],Math.round(s*.43))}</span>`;
const tick=svg('<path d="M5 12l4 4 10-10"/>',16,1.8);
const caret=o=>svg(o?'<path d="M6 15l6-6 6 6"/>':'<path d="M6 9l6 6 6-6"/>',16,1.8);
const backBtn=`<span class="back">${svg('<path d="M15 6l-6 6 6 6"/>',16,1.8)}Insure</span>`;
const P=id=>plans.find(p=>p.id===id);
const cur=()=>P(S.sel);
const checks=l=>`<ul class="check">${l.map(b=>`<li>${tick}<span>${b}</span></li>`).join('')}</ul>`;
const facts=rows=>`<div class="facts">${rows.map(r=>`<div><span>${r[0]}</span><span class="tab">${r[1]}</span></div>`).join('')}</div>`;
const info=(t,b)=>`<div class="info"><h3>${t}</h3>${b}</div>`;
const profileNote=`<p class="note">You’ll create your insurance profile first. You only do it once.</p>`;
const startBtn=(c='')=>`<button class="btn ${c}" data-a="start">Get Started</button>`;
const priceBlock=(p,size=40)=>`<div><span class="mu s12">From</span><div class="tab big" style="font-size:${size}px">${p.fromTxt} <span class="mu s14" style="letter-spacing:0">a month</span></div></div>`;
const NAVS=[['Home','<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'],['Accounts','<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/>'],['Cards','<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 11h18"/>'],null,['Send & Pay','<path d="M21 3L3 10l7 3 3 7z"/>'],['Loans','<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/>'],['Invest','<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/>'],['Insure','<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/>'],null,['Transactions','<path d="M4 8h16M16 4l4 4-4 4M20 16H4M8 12l-4 4 4 4"/>'],['Reports','<path d="M5 20V10M12 20V4M19 20v-7"/>']];
const shell=(inner,cls='col')=>`<aside class="side"><div class="logo"><b>GCB</b></div>${NAVS.map(n=>n?`<span class="nav ${n[0]==='Insure'?'on':''}">${svg(n[1],18,1.6)}${n[0]}</span>`:'<div class="gap"></div>').join('')}</aside>
 <div class="mainwrap"><header class="top">${svg('<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/>',18)}${svg('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',18)}<button data-a="theme" aria-label="Toggle theme" style="color:inherit;display:flex">${svg('<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',18)}</button><span class="me"><span class="av">AS</span><span style="display:flex;flex-direction:column;line-height:1.3"><span class="s14" style="color:var(--tx)">Ama Serwaa</span><span class="s12">Retail Customer</span></span></span></header>
 <div class="content">${cls?`<div class="${cls}">${inner}</div>`:inner}</div></div>`;
const SOON='Coming soon: Savings Protection, Vehicle, Travel and Personal Accident.';
const planCard=(p,extra='')=>`<button class="card ${S.sel===p.id?'on':''}" data-a="sel:${p.id}">${disc(p)}<span class="ct">${p.short}</span><span class="cd">${p.line}</span>${extra}</button>`;

/* ---------- state ---------- */
const S={v:1,sel:'hc',prem:100,years:10,tier:1,sum:0,faq:0,tab:'overview',exp:null,drawer:true,cmp:[]};
const clampYears=p=>{if(p.kind==='save')S.years=Math.min(Math.max(S.years,p.term[0]),p.term[1])};
const saveOut=()=>{const paid=S.prem*12*S.years;return{paid,out:paid*1.25}};
function controls(p){
  if(p.kind==='save'){clampYears(p);return `<div class="ctl"><div class="cl"><label for="prem">I can save</label><span class="tab" id="premV"></span></div><input id="prem" data-r="prem" type="range" min="50" max="1000" step="50" value="${S.prem}"></div><div class="ctl"><div class="cl"><label for="yrs">For</label><span class="tab" id="yrsV"></span></div><input id="yrs" data-r="years" type="range" min="${p.term[0]}" max="${p.term[1]}" step="1" value="${S.years}"></div>`}
  if(p.id==='hc')return `<div class="ctl"><span class="s13">Choose a cover level</span><div class="chips">${TIERS.map((x,i)=>`<button class="chip ${S.tier===i?'on':''}" data-a="tier:${i}">${x[0]}</button>`).join('')}</div></div>`;
  return `<div class="ctl"><span class="s13">Choose a sum assured</span><div class="chips">${SUMS.map((x,i)=>`<button class="chip tab ${S.sum===i?'on':''}" data-a="sum:${i}">${money(x)}</button>`).join('')}</div></div>`;
}
function result(p,size=44){
  const f=`font-size:${size}px`;
  if(p.kind==='save')return `<div><span class="mu s12">You get back about</span><div class="big tab" id="outV" style="${f}"></div><p class="mu s12" id="outN" style="margin-top:4px;line-height:1.5"></p></div>`;
  if(p.id==='hc'){const t=TIERS[S.tier];return `<div><span class="mu s12">Your family receives</span><div class="big tab" style="${f}">${money(t[1])}</div><p class="mu s13" style="margin-top:4px;line-height:1.5">for <span class="tab">${money(t[2])}</span> a month, for you. Add family and each person gets their own level.</p></div>`}
  const s=SUMS[S.sum];return `<div><span class="mu s12">It would cost about</span><div class="big tab" style="${f}">${money(sumMonthly(s))} <span class="mu s14" style="letter-spacing:0">a month</span></div><p class="mu s12" style="margin-top:4px;line-height:1.5">${money(s/1000*9)} a year, at age 30. Your price depends on your age and health.</p></div>`;
}
function upd(){
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  const {paid,out}=saveOut();
  set('premV',money(S.prem)+' a month');set('yrsV',S.years+' years');set('outV',money(out));
  set('outN','You pay in '+money(paid)+'. Illustration only: StarLife confirms the final figures.');
}

/* ---------- variations ---------- */
const V={};

/* 1 */
V[1]={name:'1. Grid, Page Opens',note:'Your layout as drawn: four cards, one column of width. The plan opens as a page that speaks the same language, a tinted hero card with the plan’s colour, then four info cards in the same 2 by 2 grid.',
 list:()=>shell(`<h1 class="pt">Insure</h1><div class="grid2" style="margin-top:16px">${plans.map(p=>planCard(p)).join('')}</div><p class="mu s13">${SOON}</p>`),
 detail:()=>{const p=cur();return shell(`<div>${backBtn}<h1 class="pt">${p.name}</h1></div>
  <div class="hero" style="--c:${p.col}">${disc(p,64)}<div style="display:flex;flex-direction:column;gap:8px;max-width:440px"><p style="font-size:16px;line-height:1.65">${p.desc}</p></div><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">${priceBlock(p,44)}<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">${startBtn()}${profileNote}</div></div></div>
  <div class="grid2">${info('What it pays',checks(p.benefits))}${info('What it costs',`<p class="s14" style="line-height:1.65">${p.cost}</p>`)}${info('Who it is for',`<p class="s14" style="line-height:1.65">${p.who}</p>`)}${info('To make a claim',checks(p.claim))}</div>
  <div style="padding:0 4px">${facts(p.facts)}</div>`)}};

/* 2 */
const gridOnly=()=>shell(`<h1 class="pt">Insure</h1><div class="grid2" style="margin-top:16px">${plans.map(p=>planCard(p)).join('')}</div><p class="mu s13">${SOON}</p>`);
V[2]={name:'2. Grid, Drawer Opens',note:'The grid never goes away. Choosing a plan slides a panel in from the right over the grid, so the customer can flip between plans without losing their place. Closing it returns to the grid.',
 list:()=>gridOnly(),
 detail:()=>{const p=cur();if(!S.drawer)return gridOnly();return gridOnly()+`<div class="scrim"></div><aside class="drawer" aria-label="${p.name}"><div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--bd)"><span style="display:flex;align-items:center;gap:12px">${discIn(p,40)}<span style="font-size:16px;font-weight:500">${p.name}</span></span><button data-a="close" aria-label="Close" style="min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;color:var(--mu)">${svg('<path d="M6 6l12 12M18 6L6 18"/>',18,1.8)}</button></div>
  <div style="flex:1;overflow:auto;padding:28px 24px;display:flex;flex-direction:column;gap:28px"><p style="font-size:15px;line-height:1.65">${p.desc}</p>${priceBlock(p,40)}${checks(p.benefits)}${facts(p.facts)}</div>
  <div style="padding:16px 24px 24px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px">${startBtn('full')}<p class="note" style="text-align:center">You’ll create your insurance profile first. You only do it once.</p></div></aside>`}};

/* 3 */
V[3]={name:'3. Price On The Card',note:'Each card carries its price, so the customer compares cost before opening anything. The plan page is a calculator built from cards: your amount on one side, what you get on the other.',
 list:()=>shell(`<h1 class="pt">Insure</h1><div class="grid2" style="margin-top:16px">${plans.map(p=>planCard(p,'').replace('<span class="ct">',`<span class="tab" style="font-size:12px;color:var(--mu);margin-bottom:-2px">From ${p.fromTxt} a month</span><span class="ct">`)).join('')}</div><p class="mu s13">${SOON}</p>`),
 detail:()=>{const p=cur();return shell(`<div>${backBtn}<h1 class="pt">${p.name}</h1><p class="mu s14" style="margin-top:8px;line-height:1.6;max-width:560px">${p.desc}</p></div>
  <div class="grid2"><div class="info" style="gap:28px;justify-content:center"><h3>${p.kind==='save'?'Your amount':'Your cover'}</h3>${controls(p)}</div>
   <div class="hero" style="--c:${p.col};padding:28px;justify-content:space-between;gap:28px">${result(p,48)}<div style="display:flex;flex-direction:column;gap:8px">${startBtn('full')}${profileNote}</div></div></div>
  <div class="grid2">${info('What it pays',checks(p.benefits))}${info('The facts',facts(p.facts))}</div>`)}};

/* 4 */
V[4]={name:'4. Questions As Cards',note:'The same grid, but each card is a sentence the customer would say. The plan page turns the five questions into cards too: tap one and the answer opens in the card. The sixth card holds the price and the button.',
 list:()=>shell(`<h1 class="pt">Insure</h1><p class="mu s14" style="margin-top:-16px">What would you like to take care of?</p><div class="grid2">${plans.map(p=>`<button class="card ${S.sel===p.id?'on':''}" data-a="sel:${p.id}" style="min-height:200px">${disc(p)}<span class="ct" style="font-size:21px;line-height:1.3;max-width:230px;margin-bottom:8px">${p.pitch}</span><span class="cd">${p.short} · from <span class="tab">${p.fromTxt}</span> a month</span></button>`).join('')}</div><p class="mu s13">${SOON}</p>`),
 detail:()=>{const p=cur();return shell(`<div>${backBtn}<h1 class="pt">${p.name}</h1><p class="mu s14" style="margin-top:8px">${p.pitch}.</p></div>
  <div class="grid2">${qa(p).map((x,i)=>`<button class="card ${S.faq===i?'on':''}" data-a="faq:${i}" style="min-height:176px;justify-content:space-between;gap:12px"><span style="font-size:18px;font-weight:500;line-height:1.35">${x[0]}</span>${S.faq===i?`<span class="cd" style="color:var(--tx);font-size:14px;line-height:1.65">${x[1]}</span>`:`<span class="mu" style="display:flex">${caret(false)}</span>`}</button>`).join('')}
   <div class="hero" style="--c:${p.col};padding:28px;justify-content:space-between;min-height:176px">${priceBlock(p,36)}<div style="display:flex;flex-direction:column;gap:8px">${startBtn('full')}${profileNote}</div></div></div>`)}};

/* 5 */
V[5]={name:'5. Cards Open In Place',note:'A card can unfold where it sits: it grows to full width and shows the short version with a button. The full plan page is a bento of mixed-size cards, the big one carrying the price and button.',
 list:()=>shell(`<h1 class="pt">Insure</h1><div class="grid2" style="margin-top:16px">${plans.map(p=>{const o=S.exp===p.id;return o?`<div class="card on" style="grid-column:1/-1;min-height:0;gap:16px;justify-content:flex-start"><button data-a="exp:${p.id}" style="display:flex;flex-direction:column;gap:6px;width:100%"><span class="ct">${p.name}</span><span class="cd" style="max-width:560px">${p.desc}</span></button>${disc(p)}<div style="display:flex;gap:32px;align-items:flex-end;justify-content:space-between;margin-top:8px"><div style="max-width:420px">${checks(p.benefits.slice(0,2))}</div><div style="display:flex;align-items:center;gap:24px">${priceBlock(p,28)}<button class="btn" data-a="sel:${p.id}">See Full Plan</button></div></div></div>`:`<button class="card" data-a="exp:${p.id}">${disc(p)}<span class="ct">${p.short}</span><span class="cd">${p.line}</span></button>`}).join('')}</div><p class="mu s13">${SOON}</p>`),
 detail:()=>{const p=cur();return shell(`<div>${backBtn}<h1 class="pt">${p.name}</h1></div>
  <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px">
   <div class="hero" style="--c:${p.col};grid-column:span 7;justify-content:space-between;min-height:300px">${disc(p,64)}<p style="font-size:16px;line-height:1.65;max-width:380px;margin-top:8px">${p.desc}</p><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">${priceBlock(p,40)}${startBtn()}</div></div>
   <div class="info" style="grid-column:span 5">${'<h3>What it pays</h3>'}${checks(p.benefits)}</div>
   <div class="info" style="grid-column:span 5"><h3>The facts</h3>${facts(p.facts)}</div>
   <div class="info" style="grid-column:span 7"><h3>Who it is for</h3><p class="s14" style="line-height:1.65">${p.who}</p><h3 style="margin-top:8px">To make a claim</h3>${checks(p.claim)}</div></div>
  <div style="text-align:center">${profileNote}</div>`)}};

/* 6 */
V[6]={name:'6. Save And Protect',note:'The grid is split into two short groups so the customer first decides what kind of thing they want. Cards lead with the price. The plan page splits the screen: the plan’s colour and number on the left, the reading on the right.',
 list:()=>shell(`<h1 class="pt">Insure</h1>${[['Save','save','Set money aside and get a lump sum back.'],['Protect','protect','Cover for the people who depend on you, and for your income.']].map(([t,k,s])=>`<div style="display:flex;flex-direction:column;gap:16px"><div><h2 style="font-size:16px;font-weight:500">${t}</h2><p class="mu s13" style="margin-top:2px">${s}</p></div><div class="grid2">${plans.filter(p=>p.kind===k).map(p=>`<button class="card ${S.sel===p.id?'on':''}" data-a="sel:${p.id}" style="min-height:200px">${disc(p)}<span class="ct" style="font-size:18px">${p.short}</span><span class="tab big" style="font-size:30px;margin-top:6px">${p.fromTxt} <span class="mu s13" style="letter-spacing:0">a month</span></span></button>`).join('')}</div></div>`).join('')}<p class="mu s13">${SOON}</p>`),
 detail:()=>{const p=cur();return shell(`<div style="display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:100%"><div style="background:color-mix(in srgb,${p.col} 18%,var(--main));padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;min-height:640px"><div>${backBtn}</div><div style="display:flex;flex-direction:column;gap:24px">${discIn(p,88)}<div><h1 style="font-size:32px;font-weight:500;letter-spacing:-.025em">${p.name}</h1><p style="font-size:15px;line-height:1.6;margin-top:8px;opacity:.85">${p.line}</p></div><div><span class="mu s12">From</span><div class="tab big" style="font-size:64px">${p.fromTxt}</div><span class="mu s14">a month</span></div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">${startBtn()}${profileNote}</div></div>
  <div style="padding:56px 48px;display:flex;flex-direction:column;gap:36px;max-width:620px"><p style="font-size:17px;line-height:1.7">${p.desc}</p><div style="display:flex;flex-direction:column;gap:16px"><h3 style="font-size:16px;font-weight:500">What it pays</h3>${checks(p.benefits)}</div><div style="display:flex;flex-direction:column;gap:16px"><h3 style="font-size:16px;font-weight:500">The facts</h3>${facts(p.facts)}</div><div style="display:flex;flex-direction:column;gap:16px"><h3 style="font-size:16px;font-weight:500">To make a claim</h3>${checks(p.claim)}</div></div></div>`,'')}};

/* 7 */
V[7]={name:'7. Wide Tall Cards',note:'Uses the full width of a desktop screen: four tall cards in one row, nothing to scroll past. The plan page keeps the card language and puts the detail behind four tabs.',
 list:()=>shell(`<h1 class="pt">Insure</h1><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px">${plans.map(p=>`<button class="card ${S.sel===p.id?'on':''}" data-a="sel:${p.id}" style="min-height:420px;justify-content:space-between;padding:28px 24px"><span style="display:flex;flex-direction:column;gap:20px;align-items:flex-start">${discIn(p,64)}<span style="display:flex;flex-direction:column;gap:6px"><span class="ct">${p.short}</span><span class="cd">${p.line}</span></span></span><span style="display:flex;flex-direction:column;gap:2px"><span class="mu s12">From</span><span class="tab big" style="font-size:32px">${p.fromTxt}</span><span class="mu s12">a month</span></span></button>`).join('')}</div><p class="mu s13">${SOON}</p>`,'col wide'),
 detail:()=>{const p=cur(),t=S.tab;
  const body={overview:`<div class="grid2"><div class="info"><h3>About this plan</h3><p class="s14" style="line-height:1.7">${p.desc}</p></div>${info('What it pays',checks(p.benefits))}</div>`,cover:`<div class="grid2">${info('The facts',facts(p.facts))}${info('Who it is for',`<p class="s14" style="line-height:1.7">${p.who}</p>`)}</div>`,cost:`<div class="grid2">${info('What it costs',`<p class="s14" style="line-height:1.7">${p.cost}</p>`)}<div class="hero" style="--c:${p.col};padding:28px">${priceBlock(p,48)}</div></div>`,claims:`<div class="grid2">${info('Have these ready to claim',checks(p.claim))}${info('How fast you are paid',`<p class="s14" style="line-height:1.7">Within 48 to 72 hours of an approved claim.</p>`)}</div>`}[t];
  return shell(`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px"><div style="display:flex;align-items:center;gap:20px">${discIn(p,64)}<div>${backBtn}<h1 class="pt">${p.name}</h1></div></div><div style="display:flex;align-items:center;gap:24px">${priceBlock(p,28)}${startBtn()}</div></div>
  <div class="tabs">${[['overview','Overview'],['cover','Cover'],['cost','Cost'],['claims','Claims']].map(x=>`<button class="${t===x[0]?'on':''}" data-a="tab:${x[0]}">${x[1]}</button>`).join('')}</div>${body}<p class="note">You’ll create your insurance profile first. You only do it once.</p>`,'col wide')}};

/* 8 */
const cmpTray=()=>{const n=S.cmp.length;return `<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-radius:16px;border:1px dashed var(--bd);font-size:14px"><span class="${n?'':'mu'}">${n<2?'Tick Compare on two plans to see them side by side.':'Comparing '+S.cmp.map(i=>P(i).short).join(' and ')+'.'}</span>${n===2?`<button class="btn ghost" data-a="gocmp">See Comparison</button>`:''}</div>`};
V[8]={name:'8. Grid With Compare',note:'For the customer still choosing. Each card has a Compare switch. Pick two and the plan page becomes a side-by-side. Opening a single plan still works as before.',
 list:()=>shell(`<h1 class="pt">Insure</h1><div class="grid2" style="margin-top:16px">${plans.map(p=>`<div style="position:relative">${planCard(p).replace('class="card','style="min-height:200px" class="card')}<button class="ck ${S.cmp.includes(p.id)?'on':''}" data-a="cmp:${p.id}" aria-pressed="${S.cmp.includes(p.id)}">${S.cmp.includes(p.id)?tick:svg('<path d="M12 5v14M5 12h14"/>',14,1.8)} Compare</button></div>`).join('')}</div>${cmpTray()}<p class="mu s13">${SOON}</p>`),
 detail:()=>{
  if(S.cmp.length===2&&S.showCmp){const [a,b]=S.cmp.map(P);const row=(l,f)=>`<tr><th scope="row">${l}</th><td>${f(a)}</td><td>${f(b)}</td></tr>`;
   return shell(`<div>${backBtn}<h1 class="pt">Compare plans</h1></div><div class="info" style="padding:12px 28px 20px"><table class="cmp"><thead><tr><td></td>${[a,b].map(p=>`<td style="padding-top:20px"><span style="display:flex;align-items:center;gap:12px">${discIn(p,40)}<span style="font-size:16px;font-weight:500">${p.short}</span></span></td>`).join('')}</tr></thead><tbody>
   ${row('Pays',p=>p.pays)}${row('Costs from',p=>`<span class="tab">${p.fromTxt} a month</span>`)}${row('Runs for',p=>p.runs)}${row('Who it is for',p=>p.who)}${row('To claim',p=>p.claim.slice(0,2).join(', '))}${row('Provider',()=>PROVIDER)}
   <tr><th></th>${[a,b].map(p=>`<td><button class="btn" data-a="sel:${p.id}">See ${p.short}</button></td>`).join('')}</tr></tbody></table></div>`)}
  const p=cur();return shell(`<div>${backBtn}<h1 class="pt">${p.name}</h1></div>
  <div class="hero" style="--c:${p.col}">${disc(p,64)}<p style="font-size:16px;line-height:1.65;max-width:440px">${p.desc}</p><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">${priceBlock(p,44)}<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">${startBtn()}${profileNote}</div></div></div>
  <div class="grid2">${info('What it pays',checks(p.benefits))}${info('The facts',facts(p.facts))}</div>`)}};

/* ---------- engine ---------- */
const $=s=>document.querySelector(s);
function render(){
  const v=V[S.v];
  $('#pills').innerHTML=Object.keys(V).map(k=>`<button class="pill ${+k===S.v?'on':''}" data-a="v:${k}">${V[k].name}</button>`).join('');
  $('#vnote').textContent=v.note;
  $('#listWin').innerHTML=v.list();
  $('#detWin').innerHTML=v.detail();
  $('#detCap').textContent=(S.v===8&&S.cmp.length===2&&S.showCmp?'Comparison · ':'Plan page · ')+(S.v===8&&S.cmp.length===2&&S.showCmp?S.cmp.map(i=>P(i).short).join(' vs '):cur().name);
  upd();
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
const toDetail=()=>setTimeout(()=>$('#detWrap').scrollIntoView({behavior:'smooth',block:'start'}),30);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const [a,arg]=el.dataset.a.split(':');let go=false;
  if(a==='v'){S.v=+arg;S.faq=0;S.tab='overview';S.exp=null;S.drawer=true;S.showCmp=false}
  else if(a==='sel'){S.sel=arg;S.faq=0;S.tab='overview';S.drawer=true;S.showCmp=false;go=true}
  else if(a==='exp'){S.exp=S.exp===arg?null:arg;if(S.exp)S.sel=arg}
  else if(a==='close')S.drawer=false;
  else if(a==='tier')S.tier=+arg;
  else if(a==='sum')S.sum=+arg;
  else if(a==='faq')S.faq=S.faq===+arg?-1:+arg;
  else if(a==='tab')S.tab=arg;
  else if(a==='cmp'){S.cmp=S.cmp.includes(arg)?S.cmp.filter(i=>i!==arg):[...S.cmp,arg].slice(-2);S.showCmp=false}
  else if(a==='gocmp'){S.showCmp=true;go=true}
  else if(a==='theme'){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'}
  else if(a==='start'){toast('Next: create your insurance profile, then choose your cover');return}
  render();if(go)toDetail();
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.r;if(!k)return;S[k]=+e.target.value;upd()});
render();
</script>
</body>
</html>
