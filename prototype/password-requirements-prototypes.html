<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Requirements: 8 Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--page:#ececea;--surf:#fff;--tile:#f4f4f5;--tileh:#ebebed;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--amsoft:#fff6dc;--amtx:#8a5a00;--ok:#047857;--okbg:#ecfdf3;--okfill:#16a34a;--shadow:0 24px 60px -24px rgba(0,0,0,.3)}
  [data-theme=dark]{--page:#050505;--surf:#141414;--tile:#1c1c1c;--tileh:#232323;--bd:#2a2a2a;--tx:#f5f5f5;--mu:#a3a3a3;--amsoft:#2a2410;--amtx:#f5c542;--ok:#34d399;--okbg:#0f2a1f;--okfill:#22c55e;--shadow:0 24px 60px -24px rgba(0,0,0,.9)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  h1,h2,p{margin:0;font-weight:inherit}
  .bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500}
  .pills,.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
  .seg{background:var(--tile);border-radius:10px;padding:4px}
  .pill,.seg button{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--mu);min-height:36px}
  .pill:hover{background:var(--tile);color:var(--tx)}
  .pill.on,.seg button.on{background:var(--am);color:#111;font-weight:500}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.5;max-width:1000px}
  .note-bar b{color:var(--tx);font-weight:500}
  .stage{padding:32px 16px 80px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .legend{max-width:480px;font-size:12px;color:var(--mu);text-align:center;line-height:1.6}
  .card{width:480px;max-width:100%;min-height:560px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);padding:32px}
  .back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--mu);margin-bottom:20px}
  .steps{display:flex;gap:4px;margin-bottom:24px}
  .steps i{flex:1;height:4px;border-radius:999px;background:var(--tile)}
  .steps i.on{background:color-mix(in srgb,var(--am) 60%,transparent)} .steps i.cur{background:var(--am)}
  .t{font-size:22px;font-weight:500;letter-spacing:-.02em;text-align:center}
  .d{font-size:14px;color:var(--mu);line-height:1.5;margin-top:8px;text-align:center}
  .body{margin-top:32px;display:flex;flex-direction:column;gap:16px}
  .field{display:flex;flex-direction:column;gap:8px}
  .lbl{font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
  .wrap{position:relative}
  input.inp{outline:none;background:var(--tile);border:1px solid var(--bd);border-radius:8px;height:44px;width:100%;padding:0 72px 0 12px;font-size:14px}
  input.inp:focus{border-color:var(--am)}
  input.inp.good{border-color:var(--okfill)}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mu);padding:4px 8px;border-radius:6px}
  .eye:hover{background:var(--tileh);color:var(--tx)}
  .inok{position:absolute;right:56px;top:50%;transform:translateY(-50%)}
  .s12{font-size:12px} .s13{font-size:13px} .mu{color:var(--mu)} .ok{color:var(--ok)} .am{color:var(--amtx)}
  .tick{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1.5px solid var(--bd);transition:all .14s}
  .tick.on{background:var(--okfill);border-color:var(--okfill);color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
  .li.on{color:var(--tx)}
  .line{font-size:12px;line-height:1.5;min-height:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12px;background:var(--tile);color:var(--mu);transition:all .14s}
  .chip.on{background:var(--okbg);color:var(--ok)}
  .meter{display:flex;gap:4px}
  .meter i{flex:1;height:4px;border-radius:999px;background:var(--tile);transition:background .2s}
  .meter i.on{background:var(--okfill)}
  .info{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:400;text-decoration:underline;text-decoration-color:var(--bd);text-underline-offset:4px;position:relative}
  .pop{position:absolute;top:calc(100% + 8px);right:0;width:240px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:12px;box-shadow:var(--shadow);text-align:left;font-size:13px;line-height:1.7;z-index:5;font-weight:400}
  .err{font-size:12px;color:#b42318} [data-theme=dark] .err{color:#f97066}
  .btn{height:44px;width:100%;border-radius:8px;background:var(--am);color:#111;font-weight:500;font-size:14px;margin-top:8px}
  .btn.dis{opacity:.4;pointer-events:none}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .in{animation:in .2s ease}
</style>
</head>
<body>
<div class="bar">
  <div class="row">
    <h1>Create Your Password: how the rules are shown</h1>
    <div class="row" style="gap:12px">
      <div class="pills" id="pills"></div>
      <div class="seg" id="theme"><button data-t="light" class="on">Light</button><button data-t="dark">Dark</button></div>
    </div>
  </div>
  <p class="note-bar" id="note"></p>
</div>
<div class="stage">
  <div class="card" id="card"></div>
  <p class="legend">Type a password. The rules are the real four from <code>auth-shared.ts</code>: at least 8 characters, upper and lower case, a number, and a symbol. Try <b>gcbbank</b>, then <b>Gcbbank2026</b>, then <b>Gcbbank2026!</b>.</p>
</div>
<script>
const RULES=[
 {id:'len', short:'8+ characters', label:'At least 8 characters', need:'8 characters', t:p=>p.length>=8},
 {id:'case', short:'Aa', label:'Upper and lower case', need:'a capital letter', t:p=>/[A-Z]/.test(p)&&/[a-z]/.test(p)},
 {id:'num', short:'123', label:'A number', need:'a number', t:p=>/\d/.test(p)},
 {id:'sym', short:'#$&', label:'A symbol', need:'a symbol', t:p=>/[^A-Za-z0-9]/.test(p)},
];
const NOTES=[
 ['One quiet line','A single line under the field states the rule in one sentence. As you type it narrows to what’s still missing (“Add a number and a symbol”), then says “Strong enough.”'],
 ['The rules move into the description','The subtitle carries the rules, so the form is just two fields. Under the field, only what’s still missing, in one line.'],
 ['Quiet checklist, no box','Today’s four checks in a 2×2 grid, without the panel or heading. Each tick turns green the moment it’s met. Nothing is red: an unmet rule is just not ticked yet.'],
 ['Only what’s missing','Nothing shows until you type. Then one line lists only what’s left (“Still needs a capital letter, a number and a symbol”), shrinking as you go, and the field border turns green when it’s done.'],
 ['Four chips','8+ characters, Aa, 123, #$& as small pills under the field that turn green. Readable at a glance, and the shorthand is how people already think about passwords.'],
 ['A meter with the next step','Four segments fill as rules are met, with “2 of 4 · add a symbol” beside it. It reads as progress rather than a test. Not a strength meter: it only counts the bank’s four rules.'],
 ['Rules on request','The label row has a “Rules” link that opens a small popover. Under the field, only what’s missing. Cleanest screen.'],
 ['Confirm appears when it’s ready','The rules are in the placeholder. The Confirm field stays hidden until the password meets all four rules, then slides in, and the first field shows a green tick. One thing at a time.']
];
let V=1, pw='', cf='', show=false, pop=false;
const $=s=>document.querySelector(s);
const met=()=>RULES.filter(r=>r.t(pw));
const missing=()=>RULES.filter(r=>!r.t(pw));
const allOk=()=>missing().length===0;
const ok=()=>allOk()&&cf===pw;
function list(a){return a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
const ICON={check:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>',
 info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
 back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'};
const tick=on=>`<span class="tick ${on?'on':''}">${on?ICON.check:''}</span>`;

function pwField(right='', under='', placeholder='Enter a password', tickIn=false){
  return `<div class="field"><div class="lbl"><label for="pw">New Password</label>${right}</div>
   <div class="wrap"><input id="pw" class="inp ${(V===4||V===8)&&allOk()?'good':''}" type="${show?'text':'password'}" placeholder="${placeholder}" value="" autocomplete="new-password" />
   ${tickIn&&allOk()?`<span class="inok">${tick(true)}</span>`:''}<button class="eye" data-act="eye">${show?'Hide':'Show'}</button></div>${under}</div>`;
}
function cfField(){
  const mis = cf.length>=pw.length && cf && cf!==pw;
  return `<div class="field ${V===8?'in':''}"><div class="lbl"><label for="cf">Confirm Password</label></div>
   <div class="wrap"><input id="cf" class="inp" type="${show?'text':'password'}" placeholder="Enter it again" value="" autocomplete="new-password" /></div>
   ${mis?'<p class="err">Passwords don’t match.</p>':''}</div>`;
}
function missingLine(prefix='Add'){
  if(!pw) return '';
  if(allOk()) return `<span class="ok">Strong enough.</span>`;
  return `<span class="mu">${prefix} ${list(missing().map(r=>r.need))}.</span>`;
}
function form(){
  switch(V){
  case 1: return pwField('', `<p class="line">${pw?missingLine():'<span class="mu">At least 8 characters, with upper and lower case, a number and a symbol.</span>'}</p>`)+cfField();
  case 2: return pwField('', `<p class="line">${missingLine()}</p>`)+cfField();
  case 3: return pwField('', `<div class="grid" style="margin-top:4px">${RULES.map(r=>`<div class="li ${r.t(pw)?'on':''}">${tick(r.t(pw))}${r.label}</div>`).join('')}</div>`)+cfField();
  case 4: return pwField('', `<p class="line">${pw&&!allOk()?`<span class="mu">Still needs ${list(missing().map(r=>r.need))}.</span>`:''}</p>`)+cfField();
  case 5: return pwField('', `<div class="chips">${RULES.map(r=>`<span class="chip ${r.t(pw)?'on':''}">${r.t(pw)?ICON.check:''}${r.short}</span>`).join('')}</div>`)+cfField();
  case 6: {
    const n=met().length, next=missing()[0];
    return pwField('', `<div style="display:flex;align-items:center;gap:12px"><div class="meter" style="flex:1">${RULES.map((r,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>
      <span class="s12 ${n===4?'ok':'mu'}" style="white-space:nowrap">${n===4?'All 4 rules met':`${n} of 4 · add ${next.need}`}</span></div>`)+cfField();
  }
  case 7: return pwField(`<button class="info" data-act="pop">${ICON.info}Rules${pop?`<span class="pop">At least 8 characters<br/>Upper and lower case<br/>A number<br/>A symbol, like ! or #</span>`:''}</button>`, `<p class="line">${missingLine()}</p>`)+cfField();
  case 8: return pwField('', '', '8+ characters, Aa, a number and a symbol', true)+(allOk()?cfField():'');
  }
}
function render(focus){
  const desc = V===2 ? 'At least 8 characters, with upper and lower case, a number and a symbol.' : 'Choose a password you will remember.';
  $('#card').innerHTML=`<button class="back">${ICON.back}Back</button>
   <div class="steps">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<5?'on':i===5?'cur':''}"></i>`).join('')}</div>
   <h2 class="t">Create Your Password</h2><p class="d">${desc}</p>
   <div class="body">${form()}<button class="btn ${ok()?'':'dis'}">Proceed</button></div>`;
  const a=$('#pw'), b=$('#cf'); if(a) a.value=pw; if(b) b.value=cf;
  const f=focus&&document.getElementById(focus); if(f){f.focus(); f.setSelectionRange(f.value.length,f.value.length);}
}
function pills(){ $('#pills').innerHTML=NOTES.map((n,i)=>`<button class="pill ${i+1===V?'on':''}" data-v="${i+1}">${i+1}</button>`).join(''); $('#note').innerHTML=`<b>${V}. ${NOTES[V-1][0]}.</b> ${NOTES[V-1][1]}`; }
document.addEventListener('input',e=>{ if(e.target.id==='pw'){pw=e.target.value; render('pw');} if(e.target.id==='cf'){cf=e.target.value; render('cf');} });
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'); if(v){V=+v.dataset.v; pw=''; cf=''; pop=false; pills(); render(); return;}
  const t=e.target.closest('[data-t]'); if(t){document.documentElement.dataset.theme=t.dataset.t; document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b===t)); return;}
  if(e.target.closest('[data-act=eye]')){show=!show; render(); return;}
  if(e.target.closest('[data-act=pop]')){pop=!pop; render(); return;}
});
pills(); render();
</script>
</body>
</html>
