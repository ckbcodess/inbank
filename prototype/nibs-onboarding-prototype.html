<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NIBS Onboarding</title>
<meta name="description" content="Interactive prototype of every retail and corporate onboarding, activation, and signup flow, with the design rationale for each screen." />
<style>
/* ============================================================
   TOKENS — lifted verbatim from src/app/globals.css so this
   standalone file renders identically to the product it documents.
   Light palette lives on bare :root; dark overrides are scoped so an
   explicit --data-theme choice always wins over the OS setting.
   ============================================================ */
:root {
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --primary: oklch(0.55 0.17 255);
  --primary-foreground: oklch(1 0 0);
  --secondary: oklch(0.97 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --destructive-foreground: oklch(1 0 0);
  --success: oklch(0.62 0.15 150);
  --warning: oklch(0.72 0.16 75);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.60 0.16 255);
  --active-bg: color-mix(in oklch, var(--primary) 8%, transparent);
  --active-border: var(--primary);
  --surface: oklch(0.985 0 0);
  --shadow-color: rgb(0 0 0 / 0.06);
  --card-shadow: 0 8px 30px rgb(0 0 0 / 0.04);
  --rail-bg: #000000;
  --rail-fg: #ffffff;
  --rail-fg-dim: rgba(255,255,255,0.6);
  --rail-border: rgba(255,255,255,0.12);
  --rail-chip-bg: rgba(255,255,255,0.08);
  --rail-chip-bg-hover: rgba(255,255,255,0.14);
  --radius-lg: 10px;
  --radius-xl: 14px;
  --radius-2xl: 18px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --primary: oklch(0.62 0.16 255);
    --primary-foreground: oklch(1 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.371 0 0);
    --destructive: oklch(0.637 0.237 25.331);
    --destructive-foreground: oklch(1 0 0);
    --success: oklch(0.68 0.15 150);
    --warning: oklch(0.78 0.15 75);
    --border: oklch(0.269 0 0);
    --input: oklch(0.269 0 0);
    --ring: oklch(0.68 0.14 255);
    --active-bg: color-mix(in oklch, var(--primary) 12%, transparent);
    --active-border: var(--ring);
    --surface: oklch(0.113 0 0);
    --shadow-color: rgb(0 0 0 / 0.3);
    --card-shadow: 0 8px 30px rgb(0 0 0 / 0.2);
    --rail-border: rgba(255,255,255,0.1);
  }
}
:root[data-theme="dark"] {
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --card-foreground: oklch(0.985 0 0);
  --primary: oklch(0.62 0.16 255);
  --primary-foreground: oklch(1 0 0);
  --secondary: oklch(0.269 0 0);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.371 0 0);
  --destructive: oklch(0.637 0.237 25.331);
  --destructive-foreground: oklch(1 0 0);
  --success: oklch(0.68 0.15 150);
  --warning: oklch(0.78 0.15 75);
  --border: oklch(0.269 0 0);
  --input: oklch(0.269 0 0);
  --ring: oklch(0.68 0.14 255);
  --active-bg: color-mix(in oklch, var(--primary) 12%, transparent);
  --active-border: var(--ring);
  --surface: oklch(0.113 0 0);
  --shadow-color: rgb(0 0 0 / 0.3);
  --card-shadow: 0 8px 30px rgb(0 0 0 / 0.2);
  --rail-border: rgba(255,255,255,0.1);
}

* { box-sizing: border-box; }
html { font-size: 14px; scrollbar-gutter: stable; }
body {
  margin: 0;
  font-family: var(--font);
  font-weight: 400;
  background: var(--background);
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4,p,span,a,label,li,dt,dd,button,input,select { font-weight: inherit; font-family: inherit; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
input, select { font-family: inherit; }
.tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* type scale — matches DESIGN-LANGUAGE.md exactly */
.t-title { font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
.t-panel { font-size: 15px; line-height: 1.35; }
.t-row   { font-size: 14px; line-height: 1.4; }
.t-body  { font-size: 13px; line-height: 1.55; }
.t-meta  { font-size: 12px; line-height: 1.5; }
.t-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }

/* ============================================================
   META PAGES (Home / Flow maps) — plain, full-width, no split
   panel. The black rail is the product's signature, reserved for
   screens that are actually inside a simulated flow; the meta
   layer stays deliberately undecorated so the two never blur.
   ============================================================ */
.meta-page { min-height: 100vh; background: var(--surface); }
.meta-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px; border-bottom: 1px solid var(--border);
}
.meta-wordmark { display:flex; align-items:center; gap:8px; }
.meta-wordmark .dot { width:8px; height:8px; border-radius:999px; background:var(--primary); }
.meta-container { max-width: 880px; margin: 0 auto; padding: 56px 28px 80px; }
.meta-eyebrow { color: var(--primary); margin: 0 0 10px; }
.meta-h1 { font-size: 32px; line-height: 1.15; letter-spacing: -0.015em; margin: 0 0 14px; text-wrap: balance; }
.meta-lede { color: var(--muted-foreground); max-width: 62ch; margin: 0 0 8px; }
.meta-howto {
  display:flex; gap:10px; align-items:flex-start; margin-top: 22px; padding: 14px 16px;
  background: var(--muted); border-radius: var(--radius-xl); color: var(--muted-foreground);
}
.pop-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 34px; }
@media (max-width: 720px) { .pop-grid { grid-template-columns: 1fr; } }
.pop-card {
  text-align:left; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-2xl);
  padding: 22px; display:flex; flex-direction:column; gap:10px; transition: border-color .15s, transform .15s, box-shadow .15s;
}
.pop-card:hover { border-color: color-mix(in oklch, var(--primary) 40%, var(--border)); box-shadow: var(--card-shadow); transform: translateY(-1px); }
.pop-card .pop-icon {
  width:40px; height:40px; border-radius: var(--radius-xl); background: var(--muted); color: var(--muted-foreground);
  display:flex; align-items:center; justify-content:center; margin-bottom: 4px;
}
.pop-card .pop-title { font-size:17px; letter-spacing:-0.01em; }
.pop-card .pop-desc { color: var(--muted-foreground); }
.pop-card .pop-badge { color: var(--primary); margin-top: 6px; }
.meta-footnote { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted-foreground); }

.map-section { margin-top: 30px; }
.map-section-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 10px; }
.map-section-title { font-size: 15px; }
.map-section-count { color: var(--muted-foreground); }
.map-list { border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; background: var(--card); }
.map-row {
  display:flex; align-items:center; gap:12px; padding: 12px 16px; border-bottom: 1px solid var(--border);
  transition: background-color .15s;
}
.map-row:last-child { border-bottom: none; }
.map-row:hover { background: color-mix(in oklch, var(--foreground) 4%, transparent); }
.map-row .num {
  width:22px; height:22px; border-radius:999px; background:var(--muted); color:var(--muted-foreground);
  display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0;
}
.map-row .label { flex:1; min-width:0; }
.map-edges { margin-top: 6px; }
.map-edges summary { list-style:none; cursor:pointer; color: var(--muted-foreground); padding: 8px 16px; }
.map-edges summary::-webkit-details-marker { display:none; }
.map-edges summary::before { content: "+ "; }
.map-edges[open] summary::before { content: "– "; }
.map-edges .edge-row { padding: 8px 16px 8px 44px; border-top: 1px dashed var(--border); display:flex; gap:10px; align-items:center; }
.map-edges .edge-row:hover { background: color-mix(in oklch, var(--foreground) 4%, transparent); }
.run-btn-row { margin-top: 22px; }

/* ============================================================
   BUTTONS / FIELDS — shared across meta pages and in-flow screens
   ============================================================ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height: 40px; padding: 0 16px; border-radius: var(--radius-lg);
  font-size: 14px; border: 1px solid transparent; width: auto; transition: all .12s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { background: var(--muted); color: var(--muted-foreground); cursor:not-allowed; filter:none; }
.btn-outline { background: var(--background); border-color: var(--border); color: var(--foreground); }
.btn-outline:hover { background: color-mix(in oklch, var(--foreground) 5%, transparent); }
.btn-ghost { background: transparent; color: var(--foreground); }
.btn-ghost:hover { background: color-mix(in oklch, var(--foreground) 5%, transparent); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; }

.field { display:flex; flex-direction:column; gap:6px; margin-bottom: 14px; }
.field label { font-size: 13px; }
.field .field-head { display:flex; align-items:center; justify-content:space-between; }
.field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=password], .field select {
  height: 38px; border-radius: var(--radius-lg); border: 1px solid var(--input); background: transparent;
  color: var(--foreground); padding: 0 12px; font-size: 14px; outline: none; width:100%;
  transition: border-color .12s, box-shadow .12s;
}
.field input:focus, .field select:focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 22%, transparent); }
.field input[aria-invalid="true"] { border-color: var(--destructive); }
.field input:disabled, .field input[readonly] { background: var(--muted); color: var(--foreground); opacity: .85; }
.field .hint { font-size:12px; color: var(--muted-foreground); }
.link-btn { color: var(--primary); font-size: 12px; }
.link-btn:hover { text-decoration: underline; }

.alert { display:flex; gap:10px; align-items:flex-start; padding: 10px 12px; border-radius: var(--radius-lg); font-size: 13px; margin: 4px 0 14px; }
.alert-error { background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); }
.alert-neutral { background: var(--muted); color: var(--muted-foreground); }
.alert svg { flex-shrink:0; margin-top:1px; }

.rule-list { display:flex; flex-direction:column; gap:6px; margin: 4px 0 16px; }
.rule-item { display:flex; align-items:center; gap:8px; font-size:12px; color: var(--muted-foreground); }
.rule-item.met { color: var(--foreground); }
.rule-item svg { color: color-mix(in oklch, var(--muted-foreground) 60%, transparent); }
.rule-item.met svg { color: var(--primary); }

.option-row {
  display:flex; align-items:center; gap:12px; padding: 13px 15px; border-radius: var(--radius-xl);
  border: 1px solid var(--border); background: var(--card); width:100%; text-align:left; transition: all .12s;
}
.option-row:hover { border-color: color-mix(in oklch, var(--primary) 35%, var(--border)); background: color-mix(in oklch, var(--foreground) 3%, transparent); }
.option-row .icon-tile { width:34px; height:34px; border-radius: var(--radius-lg); background: var(--muted); color: var(--muted-foreground); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.option-row .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.option-row .body .lbl { font-size:13px; color: var(--foreground); }
.option-row .body .sub { font-size:12px; color: var(--muted-foreground); line-height:1.45; }
.option-row .chev { flex-shrink:0; color: var(--muted-foreground); }
.option-row.selected { border-color: var(--active-border); background: var(--active-bg); }

.otp-row { display:flex; gap:8px; justify-content:center; margin: 6px 0 16px; }
.otp-box {
  width:44px; height:48px; border-radius: var(--radius-xl); border: 1px solid var(--border); background: var(--background);
  text-align:center; font-size:18px; color: var(--foreground); outline:none;
}
.otp-box:focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 22%, transparent); }
.otp-box[aria-invalid="true"] { border-color: var(--destructive); }

.doc-row { display:flex; align-items:center; gap:12px; padding: 13px 15px; border-radius: var(--radius-xl); border:1px solid var(--border); background: var(--card); margin-bottom:10px; }
.doc-row.attached { border-color: var(--active-border); background: var(--active-bg); }
.doc-row .icon-tile { width:34px; height:34px; border-radius: var(--radius-lg); background: var(--muted); color: var(--muted-foreground); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.doc-row.attached .icon-tile { color: var(--primary); }
.doc-row .body { flex:1; min-width:0; }
.doc-row .body .lbl { font-size:13px; }
.doc-row .body .sub { font-size:12px; color:var(--muted-foreground); }

.step-bar { display:flex; gap:6px; margin-bottom: 20px; }
.step-bar .seg { flex:1; height:4px; border-radius:999px; background: var(--muted); }
.step-bar .seg.done { background: var(--primary); }

.review-block { border:1px solid var(--border); border-radius: var(--radius-xl); padding: 14px 16px; margin-bottom: 12px; background: var(--card); }
.review-block .rh { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.review-block .rh .t { font-size:13px; }
.review-row { display:flex; justify-content:space-between; gap:12px; font-size:13px; padding: 3px 0; }
.review-row dt { color: var(--muted-foreground); }
.review-row dd { margin:0; text-align:right; }

.sig-item { display:flex; align-items:center; gap:12px; padding: 11px 14px; border-radius: var(--radius-xl); border:1px solid var(--border); background:var(--card); margin-bottom:8px; }
.sig-item .icon-tile { width:32px;height:32px;border-radius:var(--radius-lg); background:var(--muted); color:var(--muted-foreground); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.sig-item .body { flex:1; min-width:0; }
.sig-item .body .lbl { font-size:13px; }
.sig-item .body .sub { font-size:12px; color:var(--muted-foreground); }
.sig-add-box { border:1px dashed var(--border); border-radius: var(--radius-xl); padding: 12px; display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.sig-add-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
@media (max-width:520px){ .sig-add-grid{grid-template-columns:1fr;} .field-grid{grid-template-columns:1fr !important;} }
.field-grid { display:grid; grid-template-columns:1fr 1fr; gap: 0 14px; }

.selfie-box {
  width: 168px; height: 210px; margin: 0 auto 16px; border-radius: var(--radius-2xl);
  border: 2px dashed var(--border); background: color-mix(in oklch, var(--muted) 60%, transparent);
  display:flex; align-items:center; justify-content:center; color: var(--muted-foreground);
}
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ============================================================
   IN-FLOW SHELL — the product's black/white split, unchanged
   from AuthLayout.tsx, plus the annotation rail's new content
   ============================================================ */
.flow-shell { display:flex; min-height:100vh; width:100%; }
@media (max-width: 900px) { .flow-shell { flex-direction: column; } }
.rail {
  width:50%; flex-shrink:0; background: var(--rail-bg); color: var(--rail-fg);
  display:flex; flex-direction:column; min-height: 100vh; position: sticky; top:0;
  align-self: flex-start; max-height: 100vh; overflow-y:auto;
}
@media (max-width: 900px) { .rail { width:100%; position:static; max-height:none; min-height:auto; } }
.rail-top { display:flex; align-items:center; justify-content:space-between; padding: 18px 24px; border-bottom: 1px solid var(--rail-border); flex-shrink:0; }
.rail-back { display:flex; align-items:center; gap:6px; color: var(--rail-fg-dim); font-size:12px; }
.rail-back:hover { color: var(--rail-fg); }
.rail-mark { color: var(--rail-fg-dim); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; }
.rail-theme-btn { color: var(--rail-fg-dim); display:flex; }
.rail-theme-btn:hover { color: var(--rail-fg); }
.rail-body { padding: 26px 28px 20px; flex:1; }
.rail-flow-badge { color: color-mix(in oklch, var(--primary) 55%, white 20%); font-size:11px; letter-spacing:0.07em; text-transform:uppercase; margin:0 0 6px; }
.rail-step { color: var(--rail-fg-dim); font-size:12px; margin: 0 0 16px; }
.rail-headline { font-size:19px; line-height:1.3; letter-spacing:-0.01em; margin: 0 0 10px; text-wrap: balance; }
.rail-rationale { color: var(--rail-fg-dim); font-size:13px; line-height:1.65; margin: 0 0 26px; }
.rail-steps { list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:2px; }
.rail-steps li { display:flex; align-items:center; gap:10px; padding: 8px 10px; border-radius: 10px; cursor:pointer; transition: background-color .12s; }
.rail-steps li:hover { background: var(--rail-chip-bg); }
.rail-steps li .marker {
  width:20px; height:20px; border-radius:999px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:10px; border: 1px solid var(--rail-border); color: var(--rail-fg-dim);
}
.rail-steps li.current .marker { background: var(--primary); border-color: var(--primary); color: white; }
.rail-steps li.done .marker { background: color-mix(in oklch, var(--primary) 30%, transparent); border-color: var(--primary); color: white; }
.rail-steps li .label { font-size:13px; color: var(--rail-fg-dim); }
.rail-steps li.current .label { color: var(--rail-fg); }
.rail-steps li.done .label { color: var(--rail-fg-dim); text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.25); }
.rail-edges-label { color: var(--rail-fg-dim); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; margin: 4px 0 10px; }
.rail-chips { display:flex; flex-wrap:wrap; gap:8px; }
.rail-chip { padding: 6px 11px; border-radius:999px; background: var(--rail-chip-bg); color: var(--rail-fg-dim); font-size:12px; border:1px solid transparent; }
.rail-chip:hover { background: var(--rail-chip-bg-hover); color: var(--rail-fg); }
.rail-chip.active { background: color-mix(in oklch, var(--primary) 35%, transparent); color:white; border-color: var(--primary); }
.rail-complete-badge { display:inline-flex; align-items:center; gap:6px; color: color-mix(in oklch, var(--success) 70%, white 25%); font-size:12px; margin-bottom:10px; }
.rail-restart { margin-top: 8px; }

.flow-main { width:50%; flex:1; display:flex; align-items:center; justify-content:center; background: var(--surface); padding: 52px 28px; min-height:100vh; }
@media (max-width: 900px) { .flow-main { width:100%; } }
.flow-col { width:100%; max-width: 400px; }
.flow-col.wide { max-width: 460px; }
.flow-icon { width:48px; height:48px; border-radius: var(--radius-2xl); background: var(--primary); color: var(--primary-foreground); display:flex; align-items:center; justify-content:center; margin: 0 auto 16px; }
.flow-head { text-align:center; margin-bottom: 26px; }
.flow-head h1 { font-size:24px; line-height:1.25; letter-spacing:-0.02em; margin:0 0 8px; text-wrap:balance; }
.flow-head .desc { color: var(--muted-foreground); font-size:13px; line-height:1.55; }
.flow-card { border:1px solid var(--border); background: var(--card); border-radius: var(--radius-2xl); padding: 24px; box-shadow: var(--card-shadow); }
.flow-footer { margin-top: 18px; text-align:center; display:flex; flex-direction:column; gap:12px; }
.flow-footer .muted-link { display:inline-flex; align-items:center; gap:5px; color: var(--muted-foreground); font-size:12px; }
.flow-footer .muted-link:hover { color: var(--foreground); text-decoration:underline; }
.dl-panel { border:1px dashed var(--border); border-radius: var(--radius-xl); padding:14px; background: color-mix(in oklch, var(--muted) 45%, transparent); text-align:left; }
.dl-panel .dl-title { font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color: var(--muted-foreground); margin:0 0 8px; }
.dl-row { display:flex; align-items:center; justify-content:space-between; padding:6px 4px; border-radius:8px; }
.dl-row:hover { background: color-mix(in oklch, var(--foreground) 5%, transparent); }
.dl-row .l { font-size:12px; }
.dl-row .r { font-size:11px; color: var(--muted-foreground); }

/* dashboard end-state */
.dash-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 22px; }
.dash-avatar { width:38px;height:38px;border-radius:999px;background:var(--primary); color:var(--primary-foreground); display:flex;align-items:center;justify-content:center; font-size:13px; }
.dash-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
@media (max-width:520px){ .dash-grid{ grid-template-columns:1fr; } }
.dash-card { border:1px solid var(--border); background:var(--card); border-radius: var(--radius-xl); padding:16px; }
.dash-card .k { color:var(--muted-foreground); font-size:12px; margin-bottom:6px; }
.dash-card .v { font-size:19px; }
.dash-banner { border:1px solid var(--active-border); background: var(--active-bg); border-radius: var(--radius-xl); padding: 14px 16px; font-size:13px; display:flex; gap:10px; }

/* ============================================================
   WALKTHROUGH BAR & FIXTURE TOOLS (Presenter guardrails)
   ============================================================ */
.walkthrough-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; gap: 16px; z-index: 100;
  box-shadow: 0 -4px 20px rgb(0 0 0 / 0.06);
}
@media (max-width: 900px) {
  .walkthrough-bar { height: auto; padding: 10px 14px; flex-wrap: wrap; }
}
.wb-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.wb-flow-select {
  height: 32px; border-radius: var(--radius-lg); border: 1px solid var(--input);
  background: var(--surface); color: var(--foreground); font-size: 13px;
  padding: 0 8px; outline: none; font-weight: 500;
}
.wb-step-badge {
  font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--muted-foreground); background: var(--muted);
  padding: 4px 8px; border-radius: 999px;
}
.wb-center {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
@media (max-width: 900px) { .wb-center { display: none; } }
.wb-caption { font-size: 13px; color: var(--foreground); line-height: 1.4; }
.wb-caption strong { color: var(--primary); font-weight: 500; margin-right: 4px; }
.wb-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Fixture Drawer */
.fixture-drawer {
  position: fixed; bottom: 56px; right: 24px; width: 340px; max-width: calc(100vw - 32px);
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
  box-shadow: 0 -8px 30px rgb(0 0 0 / 0.12); z-index: 99;
  transform: translateY(110%); transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.fixture-drawer.open { transform: translateY(0); }
.fixture-drawer-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.fixture-drawer-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.fixture-group { display: flex; flex-direction: column; gap: 6px; }
.fixture-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); margin: 0; }

/* Hotspot Highlighting Mode */
.show-hotspots .flow-card button,
.show-hotspots .flow-card input,
.show-hotspots .flow-card select,
.show-hotspots .flow-card .option-row,
.show-hotspots .flow-card .doc-row {
  outline: 2px solid var(--primary) !important;
  outline-offset: 2px;
  box-shadow: 0 0 10px color-mix(in oklch, var(--primary) 40%, transparent) !important;
}

.flow-shell { padding-bottom: 56px; }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>

/* ============================================================

/* ============================================================

const OTP_TARGETS = {};
function otpScreen(variant, nextId, screenId) {
  const err = variant === 'error', locked = variant === 'locked';
  if (locked) {
    return alertBox('error','Three consecutive incorrect codes. Security pause active for 15 minutes.') +
      '<p class="t-body" style="margin-bottom:16px;">Your account and funds remain secure. You can retry with a new code or contact 24/7 support.</p>' +
      '<button class="btn btn-primary btn-block" data-action="resetOtpLock" style="margin-bottom:10px;">' + icon('sparkles',14) + ' Simulate Lockout Expiry & Retry</button>' +
      '<button class="btn btn-outline btn-block" data-go="login">Back to sign in</button>';
  }
  let html = '<div class="otp-row">';
  for (let i=0;i<6;i++) html += '<input class="otp-box" inputmode="numeric" maxlength="1" data-otp="' + i + '"' + (err?' aria-invalid="true"':'') + ' value="' + (err?'0':(i+1)) + '" />';
  html += '</div>';
  if (err) html += alertBox('error','Code is incorrect or expired (2 attempts remaining). Enter any 6 valid digits, or 000000 to test error.');
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;">' +
    '<span class="t-meta" style="color:var(--muted-foreground);">Resend code in <span class="tabular">0:28</span></span>' +
    '<button class="btn btn-ghost btn-sm t-meta" data-action="resendOtp" style="color:var(--primary);padding:0;">' + icon('sparkles',12) + ' Resend SMS</button>' +
    '</div>';
  html += '<button class="btn btn-primary btn-block" data-action="submitOtp">' + icon('arrowRight',15) + ' Verify and proceed</button>';
  return html;
}
function mountOtp(root, nextId, screenId) {
  const boxes = Array.prototype.slice.call(root.querySelectorAll('[data-otp]'));
  const submitBtn = root.querySelector('[data-action="submitOtp"]');
  const resendBtn = root.querySelector('[data-action="resendOtp"]');
  const resetLockBtn = root.querySelector('[data-action="resetOtpLock"]');

  if (resetLockBtn) {
    resetLockBtn.addEventListener('click', function(){
      OTP_TARGETS[screenId] = 0;
      render(screenId);
    });
  }

  if (resendBtn) {
    resendBtn.addEventListener('click', function(e){
      e.target.innerHTML = icon('check',12) + ' Code Dispatched!';
      setTimeout(function(){ render(screenId); }, 600);
    });
  }

  function currentCode() { return boxes.map(function (b) { return b.value; }).join(''); }
  function attemptVerify(code) {
    if (code === '000000') {
      OTP_TARGETS[screenId] = (OTP_TARGETS[screenId] || 0) + 1;
      if (OTP_TARGETS[screenId] >= 3) { render(screenId, 'locked'); }
      else { render(screenId, 'error'); }
    } else {
      OTP_TARGETS[screenId] = 0;
      render(nextId);
    }
  }
  if (submitBtn) {
    submitBtn.addEventListener('click', function() {
      attemptVerify(currentCode() || '123456');
    });
  }
  boxes.forEach(function (b, i) {
    b.addEventListener('input', function () {
      b.value = b.value.replace(/[^0-9]/g,'').slice(0,1);
      if (b.value && boxes[i+1]) boxes[i+1].focus();
    });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !b.value && boxes[i-1]) boxes[i-1].focus();
      if (e.key === 'Enter') attemptVerify(currentCode());
    });
  });
}

function mountSetup(root, nextId) {

  const rules = root.querySelectorAll('[data-rule]');

    rules.forEach(function (li, i) { li.classList.toggle('met', tests[i]); });

  if (pw) pw.addEventListener('input', check);

/* ============================================================
   PROTOTYPE SHELL & PRESENTATION ENGINE
   ============================================================ */
const app = document.getElementById('app');
let currentScreen = null, currentVariant = null;
let showHotspots = false;
let fixtureDrawerOpen = false;

function getCurrentFlow() {
  const scr = SCREENS[currentScreen];
  if (!scr) return FLOWS['retail-activation'];
  return FLOWS[scr.flowId] || FLOWS['retail-activation'];
}

function render(screenId, variant) {
  // Normalize IDs & variants
  if (screenId === 'su-identity-existing') { screenId = 'su-identity'; variant = 'existing'; }
  if (screenId === 'act-r-already') { screenId = 'act-r-find'; variant = 'already'; }
  if (screenId === 'act-r-code-locked') { screenId = 'act-r-verify'; variant = 'locked'; }
  if (screenId === 'act-r-code-error') { screenId = 'act-r-verify'; variant = 'error'; }
  if (screenId === 'su-verify-locked') { screenId = 'su-verify'; variant = 'locked'; }
  if (screenId === 'su-verify-error') { screenId = 'su-verify'; variant = 'error'; }
  if (screenId === 'act-c-invite-expired') { screenId = 'act-c-invite'; variant = 'expired'; }
  if (screenId === 'act-c-verify-error') { screenId = 'act-c-verify'; variant = 'error'; }
  if (screenId === 'bs-company-existing') { screenId = 'bs-company'; variant = 'existing'; }

  currentScreen = screenId; currentVariant = variant || null;
  location.hash = 'screen/' + screenId + (variant ? '/' + variant : '');
  paint();
  window.scrollTo(0,0);
}

function paint() {
  const screen = SCREENS[currentScreen];
  if (!screen) { renderHome(); return; }

  const flow = getCurrentFlow();
  const flowSteps = flow.steps.filter(function(id){ return SCREENS[id] && !SCREENS[id].isEdgeOnly; });
  const stepIdx = flowSteps.indexOf(currentScreen);
  const isTerminal = screen.isTerminal;
  const isEdgeView = !!currentVariant || !!screen.isEdgeOnly;

  // Compute Prev / Next navigation for linear walkthrough
  let prevStepId = null, nextStepId = null;
  if (stepIdx > 0) prevStepId = flowSteps[stepIdx - 1];
  if (stepIdx >= 0 && stepIdx < flowSteps.length - 1) nextStepId = flowSteps[stepIdx + 1];

  // Rail Step List
  let railStepsHtml = '';
  flowSteps.forEach(function (id, i) {
    const s = SCREENS[id];
    const isCurrent = id === currentScreen;
    const isDone = stepIdx > i;
    const cls = isCurrent ? 'current' : (isDone ? 'done' : '');
    railStepsHtml += '<li class="' + cls + '" data-go="' + id + '"><span class="marker">' + (isDone ? icon('check',10) : (i+1)) + '</span><span class="label">' + stepShortLabel(s) + '</span></li>';
  });

  // Edge case quick switcher chips
  let edgesHtml = '';
  const currentEdges = (screen.edges || []).concat(
    flow.edgeCases ? flow.edgeCases.filter(function(e){ return e.source === currentScreen; }) : []
  );
  // deduplicate
  const seenEdges = {};
  const uniqueEdges = [];
  currentEdges.forEach(function(e){
    if (!seenEdges[e.id]) { seenEdges[e.id] = true; uniqueEdges.push(e); }
  });

  if (uniqueEdges.length || isEdgeView) {
    edgesHtml = '<div style="margin-top:16px;"><p class="rail-edges-label">Simulate Scenarios &amp; Edge Cases</p><div class="rail-chips">';
    edgesHtml += '<button class="rail-chip' + (!isEdgeView ? ' active' : '') + '" data-go="' + currentScreen + '">Standard (Happy)</button>';
    uniqueEdges.forEach(function (e) {
      const active = (currentVariant && e.id.indexOf(currentVariant) !== -1) || currentScreen === e.id;
      edgesHtml += '<button class="rail-chip' + (active ? ' active' : '') + '" data-edge="' + e.id + '">' + e.label + '</button>';
    });
    edgesHtml += '</div></div>';
  }

  const railTop = '<div class="rail-top"><a href="#" class="rail-back" data-go-home="1">' + icon('arrowLeft',13) + ' All Flows</a>' +
    '<div style="display:flex;align-items:center;gap:10px;">' +
    '<button class="btn btn-ghost btn-sm" data-toggle-hotspots="1" style="font-size:11px;padding:2px 8px;height:26px;color:' + (showHotspots?'var(--primary)':'var(--rail-fg-dim)') + ';" title="Highlight Clickable Elements">' + icon('sparkles',12) + ' ' + (showHotspots?'Hotspots ON':'Hotspots') + '</button>' +
    '<button class="rail-theme-btn" data-toggle-theme="1" title="Toggle theme">' + icon('sun',14) + '</button>' +
    '</div></div>';

  const railBody = '<div class="rail-body">' +
    '<p class="rail-flow-badge">' + flow.category.toUpperCase() + ' · ' + flow.title + '</p>' +
    (isTerminal ? '<p class="rail-complete-badge">' + icon('checkCircle',14) + ' MILESTONE REACHED</p>'
      : ('<p class="rail-step">Step ' + Math.max(stepIdx+1, 1) + ' of ' + flowSteps.length + (isEdgeView ? ' (Edge Scenario)' : '') + '</p>')) +
    '<h2 class="rail-headline">' + screen.rationaleHead + '</h2>' +
    '<p class="rail-rationale">' + screen.rationale + '</p>' +
    (isTerminal ? '' : ('<ol class="rail-steps">' + railStepsHtml + '</ol>')) +
    edgesHtml +
    (isTerminal ? '<button class="btn btn-outline btn-sm rail-restart" data-go="' + flowSteps[0] + '" style="border-color:var(--rail-border);color:var(--rail-fg-dim);margin-top:20px;">' + icon('arrowLeft',13) + ' Restart This Flow</button>' : '') +
    '</div>';

  const iconBox = '<div class="flow-icon">' + icon(screen.icon, 22) + '</div>';
  const head = '<div class="flow-head">' + iconBox + '<h1>' + screen.title + '</h1><p class="desc">' + screen.desc + '</p></div>';
  const progressBar = screen.progress ? renderProgressBar(screen.progress) : '';
  const cardBody = screen.body(currentVariant);
  const footerHtml = screen.footer ? '<div class="flow-footer">' + screen.footer() + '</div>' : '';

  // Bottom Contextual Presentation Bar (Slack/Firefox Linear Walkthrough Bar)
  const bottomBar = '<div class="walkthrough-bar">' +
    '<div class="wb-left">' +
    '<select class="wb-flow-select" data-switch-flow="1">' +
    Object.keys(FLOWS).map(function(k){
      return '<option value="' + FLOWS[k].steps[0] + '" ' + (flow.id === k ? 'selected' : '') + '>' + FLOWS[k].title + '</option>';
    }).join('') +
    '</select>' +
    '<span class="wb-step-badge">Step ' + (stepIdx >= 0 ? (stepIdx + 1) : '-') + '/' + flowSteps.length + '</span>' +
    '</div>' +
    '<div class="wb-center"><span class="wb-caption"><strong>Goal:</strong> ' + screen.rationale + '</span></div>' +
    '<div class="wb-right">' +
    '<button class="btn btn-ghost btn-sm" data-toggle-fixtures="1" style="font-size:12px;color:var(--primary);">' + icon('compass',13) + ' Fixture Tools</button>' +
    '<button class="btn btn-outline btn-sm" ' + (prevStepId ? ('data-go="' + prevStepId + '"') : 'disabled') + '>' + icon('arrowLeft',12) + ' Prev</button>' +
    '<button class="btn btn-primary btn-sm" ' + (nextStepId ? ('data-go="' + nextStepId + '"') : 'disabled') + '>Next ' + icon('arrowRight',12) + '</button>' +
    '</div>' +
    '</div>';

  // Ramp-style Live Fixture Drawer
  const fixtureDrawer = '<div class="fixture-drawer' + (fixtureDrawerOpen ? ' open' : '') + '">' +
    '<div class="fixture-drawer-head">' +
    '<span class="t-panel" style="display:flex;gap:6px;align-items:center;">' + icon('compass',15) + ' Developer Fixture &amp; Data Tools</span>' +
    '<button class="btn btn-ghost btn-sm" data-toggle-fixtures="1">✕ Close</button>' +
    '</div>' +
    '<div class="fixture-drawer-body">' +
    '<div class="fixture-group">' +
    '<p class="fixture-label">Simulate Entity Scaling (Business Mandate)</p>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
    '<button class="btn btn-outline btn-sm" data-set-sigs="0">1 Signatory (Solo)</button>' +
    '<button class="btn btn-outline btn-sm" data-set-sigs="2">3 Signatories (Standard)</button>' +
    '<button class="btn btn-outline btn-sm" data-set-sigs="6">7 Signatories (Enterprise)</button>' +
    '</div>' +
    '</div>' +
    '<div class="fixture-group">' +
    '<p class="fixture-label">Simulate KYB Document Checklist</p>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
    '<button class="btn btn-outline btn-sm" data-set-docs="0">0 Attached (Blocked)</button>' +
    '<button class="btn btn-outline btn-sm" data-set-docs="2">2 Attached (Partial)</button>' +
    '<button class="btn btn-outline btn-sm" data-set-docs="4">4 Attached (Ready)</button>' +
    '</div>' +
    '</div>' +
    '<div class="fixture-group">' +
    '<p class="fixture-label">Interactive Hotspot Highlighting</p>' +
    '<button class="btn btn-outline btn-sm" data-toggle-hotspots="1">' + (showHotspots ? 'Disable Hotspots' : 'Highlight Interactive Elements') + '</button>' +
    '</div>' +
    '</div>' +
    '</div>';

  app.innerHTML = '<div class="flow-shell' + (showHotspots ? ' show-hotspots' : '') + '">' +
    '<aside class="rail">' + railTop + railBody + '</aside>' +
    '<main class="flow-main"><div class="flow-col' + (screen.wide ? ' wide' : '') + '">' + head +
    '<div class="flow-card">' + progressBar + cardBody + '</div>' + footerHtml + '</div></main>' +
    '</div>' + bottomBar + fixtureDrawer;

  wireGlobalActions(app);
  if (screen.mount) screen.mount(app, currentVariant);
}

function renderProgressBar(step) {
  const total = 5;
  let html = '<div class="step-bar">';
  for (let i=1;i<=total;i++) html += '<span class="seg' + (i<=step?' done':'') + '"></span>';
  return html + '</div>';
}
function stepShortLabel(screen) {
  return screen.title.replace(/<[^>]+>/g,'').split(' — ')[0].slice(0,32);
}

function wireGlobalActions(root) {
  root.querySelectorAll('[data-go]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      const target = el.getAttribute('data-go');
      if (target.indexOf('dashboard:') === 0) { renderDashboard(target.split(':')[1]); return; }
      render(target);
    });
  });
  root.querySelectorAll('[data-edge]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      const edgeId = el.getAttribute('data-edge');
      if (edgeId.indexOf('already') !== -1) render(currentScreen, 'already');
      else if (edgeId.indexOf('notfound') !== -1) render(currentScreen, 'notfound');
      else if (edgeId.indexOf('locked') !== -1) render(currentScreen, 'locked');
      else if (edgeId.indexOf('mismatch') !== -1) render(currentScreen, 'mismatch');
      else if (edgeId.indexOf('expired') !== -1) render(currentScreen, 'expired');
      else if (edgeId.indexOf('error') !== -1) render(currentScreen, 'error');
      else if (edgeId.indexOf('existing') !== -1) render(currentScreen, 'existing');
      else if (SCREENS[edgeId]) render(edgeId);
    });
  });
  root.querySelectorAll('[data-go-home]').forEach(function (el) {
    el.addEventListener('click', function (e) { e.preventDefault(); renderHome(); });
  });
  root.querySelectorAll('[data-toggle-theme]').forEach(function (el) {
    el.addEventListener('click', toggleTheme);
  });
  root.querySelectorAll('[data-toggle-hotspots]').forEach(function (el) {
    el.addEventListener('click', function(e){
      e.preventDefault();
      showHotspots = !showHotspots;
      paint();
    });
  });
  root.querySelectorAll('[data-toggle-fixtures]').forEach(function (el) {
    el.addEventListener('click', function(e){
      e.preventDefault();
      fixtureDrawerOpen = !fixtureDrawerOpen;
      const dr = app.querySelector('.fixture-drawer');
      if (dr) dr.classList.toggle('open', fixtureDrawerOpen);
    });
  });
  const flowSelect = root.querySelector('[data-switch-flow]');
  if (flowSelect) {
    flowSelect.addEventListener('change', function(){
      render(flowSelect.value);
    });
  }
  // Fixture helpers
  root.querySelectorAll('[data-set-sigs]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const count = +btn.dataset.setSigs;
      form.signatories = [];
      const sampleNames = ['Kofi Mensah', 'Ama Darko', 'Yaw Appiah', 'Esi Boateng', 'Kwesi Arthur', 'Akosua Frimpong'];
      for (let i = 0; i < count; i++) {
        form.signatories.push({ name: sampleNames[i] || ('Signatory ' + (i+1)), role: 'Director', mobile: '+233 24 555 010' + i });
      }
      fixtureDrawerOpen = false;
      render(currentScreen === 'bs-signatories' || currentScreen === 'bs-review' ? currentScreen : 'bs-signatories');
    });
  });
  root.querySelectorAll('[data-set-docs]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const count = +btn.dataset.setDocs;
      form.docs = {};
      REQUIRED_DOCS.slice(0, count).forEach(function(d){ form.docs[d.id] = d.id + '-certified.pdf'; });
      fixtureDrawerOpen = false;
      render(currentScreen === 'bs-documents' || currentScreen === 'bs-review' ? currentScreen : 'bs-documents');
    });
  });
}

function renderDashboard(kind) {
  currentScreen = null;
  location.hash = 'dashboard/' + kind;
  app.innerHTML = dashboardHtml(kind);
  wireGlobalActions(app);
  window.scrollTo(0,0);
}

/* ---------- Streamlined Flow Index (Home) ---------- */
function renderHome() {
  location.hash = 'home';
  app.innerHTML = '<div class="meta-page">' + topbar() +
    '<div class="meta-container">' +
    '<p class="meta-eyebrow t-label">LINEAR PRESENTATION PROTOTYPE</p>' +
    '<h1 class="meta-h1">NIBS Onboarding &amp; Activation Flows</h1>' +
    '<p class="meta-lede t-body">Structured, guardrailed walkthroughs of every customer journey into internet banking. Each flow is strictly linear and focused on a single customer objective with live fixture tools for scenario testing.</p>' +
    '<div class="meta-howto t-body">' + icon('compass',16) + '<span>Select a focused journey below. During any flow, use the bottom walkthrough bar to advance sequentially, inspect the user goal, or use <strong>Fixture Tools</strong> to test scale and edge cases.</span></div>' +
    '<div class="pop-grid" style="grid-template-columns:1fr;gap:14px;margin-top:28px;">' +
    flowCard('retail-activation', 'userPlus', '1. Retail: Instant Account Activation', 'Existing GCB depositors switch on web banking in < 2 mins using registered credentials with zero redundant KYC.', '4 linear steps · 4 edge scenarios') +
    flowCard('retail-signup', 'sparkles', '2. Retail: New Account Opening', 'New personal customers open an account in ~5 mins with Ghana Card registry lookup and biometric selfie matching.', '7 linear steps · 4 edge scenarios') +
    flowCard('corporate-activation', 'building', '3. Corporate: Team Member Activation', 'Invited corporate makers and approvers onboard securely with pre-configured permissions from their company admin.', '4 linear steps · 2 edge scenarios') +
    flowCard('corporate-signup', 'fileText', '4. Corporate: Business Account Application', 'Companies apply for commercial accounts with TIN verification, dynamic mandate signatories, and document upload.', '6 linear steps · 2 edge scenarios') +
    flowCard('signin', 'landmark', '5. Direct Sign-In &amp; Entry Gate', 'Returning customers log in immediately, with straightforward recovery and routing gates.', '3 steps') +
    '</div>' +
    '<p class="meta-footnote t-meta">GCB Bank PLC · NIBS Prototype · All data is simulated in-memory for review purposes.</p>' +
    '</div></div>';
  wireGlobalActions(app);
}

function flowCard(flowKey, iconName, title, desc, meta) {
  const f = FLOWS[flowKey];
  const startScreen = f ? f.steps[0] : 'login';
  return '<button class="pop-card" data-go="' + startScreen + '" style="text-align:left;">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">' +
    '<div style="display:flex;gap:14px;align-items:flex-start;">' +
    '<span class="pop-icon" style="margin-bottom:0;">' + icon(iconName,20) + '</span>' +
    '<div><span class="pop-title" style="font-size:16px;display:block;">' + title + '</span><span class="pop-desc t-body" style="display:block;margin-top:4px;">' + desc + '</span></div>' +
    '</div>' +
    '<span class="btn btn-outline btn-sm" style="flex-shrink:0;margin-top:2px;">Launch Flow ' + icon('arrowRight',12) + '</span>' +
    '</div>' +
    '<span class="t-meta" style="color:var(--primary);margin-top:10px;display:block;">' + meta + '</span>' +
    '</button>';
}

function topbar() {
  return '<div class="meta-topbar"><a class="meta-wordmark" href="#" data-go-home="1"><span class="dot"></span><span class="t-label" style="color:var(--muted-foreground);">NIBS · Presentation Prototype</span></a>' +
    '<button class="btn btn-ghost btn-sm" data-toggle-theme="1">' + icon('sun',14) + ' Theme</button></div>';
}

/* ---------- Theme toggle ---------- */
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const effectivelyDark = current ? current === 'dark' : prefersDark;
  root.setAttribute('data-theme', effectivelyDark ? 'light' : 'dark');
}

/* ---------- Router ---------- */
function routeFromHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h || h === 'home') { renderHome(); return; }
  if (h.indexOf('dashboard/') === 0) { renderDashboard(h.split('/')[1]); return; }
  if (h.indexOf('screen/') === 0) {
    const parts = h.split('/');
    let id = parts[1], variant = parts[2];
    if (id === 'su-identity-existing') { id = 'su-identity'; variant = 'existing'; }
    if (id === 'act-r-already') { id = 'act-r-find'; variant = 'already'; }
    if (id === 'act-r-code-locked') { id = 'act-r-verify'; variant = 'locked'; }
    if (id === 'act-r-code-error') { id = 'act-r-verify'; variant = 'error'; }
    if (id === 'su-verify-locked') { id = 'su-verify'; variant = 'locked'; }
    if (id === 'su-verify-error') { id = 'su-verify'; variant = 'error'; }
    if (id === 'act-c-invite-expired') { id = 'act-c-invite'; variant = 'expired'; }
    if (id === 'act-c-verify-error') { id = 'act-c-verify'; variant = 'error'; }
    if (id === 'bs-company-existing') { id = 'bs-company'; variant = 'existing'; }
    if (SCREENS[id]) { currentScreen = id; currentVariant = variant || null; paint(); return; }
  }
  renderHome();
}
window.addEventListener('hashchange', routeFromHash);
document.addEventListener('DOMContentLoaded', routeFromHash);
if (document.readyState !== 'loading') routeFromHash();

/* Keyboard navigation: Left/Right arrows advance walkthrough */
document.addEventListener('keydown', function (e) {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'Escape') {
    if (fixtureDrawerOpen) { fixtureDrawerOpen = false; const dr = app.querySelector('.fixture-drawer'); if (dr) dr.classList.remove('open'); return; }
    renderHome();
  }
  else if (e.key === 'ArrowLeft') {
    const prevBtn = app.querySelector('.walkthrough-bar .btn-outline:not([disabled])');
    if (prevBtn) prevBtn.click();
    else history.back();
  }
  else if (e.key === 'ArrowRight' || e.key === ' ') {
    const nextBtn = app.querySelector('.walkthrough-bar .btn-primary:not([disabled])');
    if (nextBtn) nextBtn.click();
  }
});

</script>
