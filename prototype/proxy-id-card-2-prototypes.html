<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy ID card, round 2: 8 variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block">
<style>
  /* Values copied from src/app/globals.css */
  :root {
    --background: #ffffff; --foreground: #0a0a0a; --card: #fafafa; --modal: #ffffff;
    --tile: #f5f5f5; --tile-hover: #ebebeb; --muted: #ebebeb; --muted-foreground: #737373;
    --border: #ebebeb; --field-border: #d9d9d9;
    --primary: #ffc423; --primary-hover: #fcd34d; --primary-foreground: #451a03;
    --destructive: #ea3446;
    --hero-surface: #38434c; --hero-border: #818d9a; --hero-foreground: #ffffff;
    --r: 10px; --r-control: 8px;
    --ls-heading: -0.04em; --ls-tight: -0.02em;
    --ease-settle: cubic-bezier(0.2, 0.8, 0.2, 1);
    --reveal: 250ms; --move: 500ms; --hover: 150ms;
    --page: #f5f5f5;
  }
  :root[data-theme="dark"] {
    --background: #0a0a0a; --foreground: #fafafa; --card: #181818; --modal: #121212;
    --tile: #141414; --tile-hover: #1c1c1c; --muted: #262626; --muted-foreground: #a1a1a1;
    --border: #262626; --field-border: #404040;
    --hero-surface: #121212; --hero-border: #212121;
    --page: #050505;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--foreground);
    font-family: "Open Sans", system-ui, sans-serif; font-size: 14px; font-weight: 400;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  h1, h2, h3, p { margin: 0; font-weight: inherit; font-size: inherit; }
  .tabular { font-variant-numeric: tabular-nums; }
  .ms {
    font-family: "Material Symbols Rounded"; font-weight: 400; font-style: normal; line-height: 1;
    font-size: 20px; width: 1em; height: 1em; overflow: hidden; display: inline-block; flex: none;
    font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; white-space: nowrap;
  }
  :focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }

  /* Top bar */
  .bar {
    position: sticky; top: 0; z-index: 30; background: var(--background);
    border-bottom: 1px solid var(--border); padding: 12px 24px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  }
  .bar h1 { font-size: 14px; font-weight: 500; }
  .pills { display: flex; gap: 4px; }
  .pill { width: 32px; height: 32px; border-radius: var(--r-control); text-align: center; font-size: 13px; color: var(--muted-foreground); }
  .pill:hover { background: var(--tile); color: var(--foreground); }
  .pill.on { background: var(--primary); color: var(--primary-foreground); font-weight: 500; }
  .ctrls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .seg { display: inline-flex; background: var(--tile); border-radius: var(--r); padding: 2px; }
  .seg button { height: 32px; padding: 0 12px; border-radius: var(--r-control); font-size: 13px; color: var(--muted-foreground); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--background); color: var(--foreground); font-weight: 500; }

  /* Stage */
  .stage { display: grid; gap: 40px 24px; padding: 32px 24px 64px; justify-content: center; grid-template-columns: repeat(auto-fill, 375px); }
  .stage.desktop { grid-template-columns: repeat(auto-fill, 672px); }
  .slot { scroll-margin-top: 80px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .slot-head { display: flex; gap: 8px; align-items: baseline; }
  .slot-head span { font-size: 12px; color: var(--muted-foreground); }
  .slot-head h2 { font-size: 14px; font-weight: 500; }
  .frame { background: var(--background); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; min-height: 580px; display: flex; flex-direction: column; }
  .note { font-size: 13px; line-height: 1.55; color: var(--muted-foreground); }
  .note b { font-weight: 500; color: var(--foreground); }

  /* Screen, matching the Proxy Payments page */
  .screen { flex: 1; display: flex; flex-direction: column; padding: 20px 12px 24px; }
  .desktop .screen { padding: 24px 24px 32px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 40px; }
  .desktop .head { margin-bottom: 48px; }
  .head .bk { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted-foreground); border-radius: var(--r-control); }
  .head h3 { font-size: 20px; font-weight: 500; letter-spacing: var(--ls-heading); }
  .desktop .head h3 { font-size: 22px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .gap24 { display: flex; flex-direction: column; gap: 24px; }

  .tile {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px;
    background: var(--tile); border-radius: var(--r); transition: background var(--hover) var(--ease-settle);
  }
  .tile:hover { background: var(--tile-hover); }
  .tile .t { flex: 1; min-width: 0; }
  .tile .chev { color: var(--muted-foreground); font-size: 18px; }
  .tile .bin { color: var(--destructive); }

  .lbl { font-size: 12px; color: var(--muted-foreground); }
  .val { font-size: 20px; letter-spacing: var(--ls-tight); }
  .row-t { font-size: 14px; }
  .links { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; }
  .lk { min-height: 24px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .lk:hover { opacity: .7; }
  .lk.danger { color: var(--destructive); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px;
    border-radius: var(--r-control); font-weight: 500; font-size: 13px; background: var(--primary); color: var(--primary-foreground);
  }
  .btn:hover { background: var(--primary-hover); }
  .btn.ghost { background: transparent; color: var(--foreground); box-shadow: inset 0 0 0 1px var(--field-border); }
  .btn.ghost:hover { background: var(--tile); }
  .btn.bad { background: var(--destructive); color: #fff; }

  .on-hero { color: var(--hero-foreground); }
  .on-hero .lbl { color: color-mix(in srgb, var(--hero-foreground) 72%, transparent); }
  .logo { display: block; width: 37px; height: 32px; }
  .logo svg { display: block; width: 100%; height: 100%; }
  .wing { position: absolute; pointer-events: none; opacity: .09; }
  .wing svg { display: block; width: 100%; height: 100%; }

  /* 1 Bank card */
  .bc {
    position: relative; overflow: hidden; aspect-ratio: 1.586; width: 100%; max-width: 380px;
    background: var(--hero-surface); box-shadow: inset 0 0 0 1px var(--hero-border); border-radius: var(--r);
    padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .bc .top, .bc .bot { display: flex; justify-content: space-between; gap: 12px; }
  .bc .top { align-items: flex-start; } .bc .bot { align-items: flex-end; }
  .bc .right { text-align: right; }
  .bc .wing { right: -40px; bottom: -40px; width: 240px; height: 196px; }

  /* 2 Amber pass */
  .amber { position: relative; overflow: hidden; background: var(--primary); color: var(--primary-foreground); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .amber .lbl { color: color-mix(in srgb, var(--primary-foreground) 78%, transparent); }
  .amber .wing { right: -32px; top: -24px; width: 200px; height: 164px; opacity: .06; }
  .amber > * { position: relative; }
  .amber > .wing { position: absolute; }

  /* 3 Flip */
  .flip { perspective: 1200px; }
  .flip-in { display: grid; transform-style: preserve-3d; transition: transform var(--move) var(--ease-settle); }
  .flip.on .flip-in { transform: rotateY(180deg); }
  .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 196px; }
  .face.front { background: var(--hero-surface); box-shadow: inset 0 0 0 1px var(--hero-border); }
  .face.back { background: var(--tile); transform: rotateY(180deg); }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

  /* 4 Payer preview */
  .preview { background: var(--tile); border-radius: var(--r); padding: 16px; display: flex; align-items: center; gap: 12px; }
  .ini { width: 40px; height: 40px; border-radius: 9999px; background: var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 500; flex: none; }
  .sec-h { font-size: 16px; font-weight: 500; }

  /* 5 Ticket */
  .ticket { position: relative; background: var(--tile); border-radius: var(--r); }
  .ticket .main { padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .ticket .stub { position: relative; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .ticket .stub::before { content: ""; position: absolute; left: 16px; right: 16px; top: 0; border-top: 1px dashed var(--field-border); }
  .ticket .stub::after, .ticket .punch { content: ""; position: absolute; top: -8px; width: 16px; height: 16px; border-radius: 9999px; background: var(--background); }
  .ticket .stub::after { right: -8px; }
  .ticket .punch { left: -8px; }

  /* 6 Card owns its actions */
  .own { background: var(--tile); border-radius: var(--r); padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 20px; }
  .acts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; border-radius: var(--r-control); font-size: 12px; text-align: center; }
  .act:hover { background: var(--tile-hover); }
  .act .ic { width: 40px; height: 40px; border-radius: 9999px; background: var(--background); display: grid; place-items: center; }
  .act.danger .ms { color: var(--destructive); }

  /* 7 Hero band */
  .screen.bleed { padding: 0; }
  .band { background: var(--hero-surface); padding: 20px 12px 48px; display: flex; flex-direction: column; }
  .desktop .band { padding: 24px 24px 56px; }
  .band .head { margin-bottom: 32px; }
  .band .head .bk { color: inherit; }
  .sheet { flex: 1; background: var(--background); border-radius: var(--r) var(--r) 0 0; margin-top: -16px; padding: 16px 12px 24px; }
  .desktop .sheet { padding: 24px 24px 32px; }

  /* 8 Peek */
  .peek { background: var(--tile); border-radius: var(--r); }
  .peek-h { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border-radius: var(--r); }
  .peek-h:hover { background: var(--tile-hover); }
  .peek-h .ms { color: var(--muted-foreground); transition: transform var(--reveal) var(--ease-settle); }
  .peek.on .peek-h .ms { transform: rotate(180deg); }
  .peek-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--reveal) var(--ease-settle); }
  .peek.on .peek-b { grid-template-rows: 1fr; }
  .peek-b > div { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility var(--reveal); }
  .peek.on .peek-b > div { visibility: visible; }
  .peek-in { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }

  .empty { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .empty p { line-height: 1.5; max-width: 300px; }

  /* Dialog and toast */
  dialog { border: 0; padding: 0; width: min(420px, calc(100vw - 24px)); background: var(--modal); color: var(--foreground); border-radius: var(--r); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .dlg { display: flex; flex-direction: column; gap: 16px; padding: 20px; }
  .dlg h3 { font-size: 16px; font-weight: 500; }
  .dlg p { font-size: 13px; line-height: 1.6; color: var(--muted-foreground); }
  .dlg p b { font-weight: 400; color: var(--foreground); }
  .fld { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; }
  .fld input, .fld select { height: 44px; padding: 0 12px; font-size: 14px; font-weight: 400; background: var(--background); border: 0; border-radius: var(--r-control); box-shadow: 0 0 0 1px var(--field-border); width: 100%; }
  .dlg-f { display: flex; justify-content: flex-end; gap: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 50;
    background: var(--foreground); color: var(--background); padding: 12px 16px; border-radius: var(--r); font-size: 13px;
    transition: opacity var(--reveal) var(--ease-settle), transform var(--reveal) var(--ease-settle);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; } }
  @media (max-width: 760px) {
    .bar { padding: 12px; }
    .ctrls { margin-left: 0; }
    .stage, .stage.desktop { grid-template-columns: minmax(0, 1fr); padding: 24px 12px 48px; }
  }
</style>
</head>
<body>

<header class="bar">
  <h1>Proxy ID card, round 2</h1>
  <nav class="pills" id="pills" aria-label="Variations"></nav>
  <div class="ctrls">
    <div class="seg" id="seg-state" role="group" aria-label="Customer state">
      <button type="button" data-v="phone">Phone number</button>
      <button type="button" data-v="ghana">Ghana Card</button>
      <button type="button" data-v="none">Not registered</button>
    </div>
    <div class="seg" id="seg-view" role="group" aria-label="Screen width">
      <button type="button" data-v="phone">Phone</button>
      <button type="button" data-v="desktop">Desktop</button>
    </div>
    <div class="seg" id="seg-theme" role="group" aria-label="Theme">
      <button type="button" data-v="light">Light</button>
      <button type="button" data-v="dark">Dark</button>
    </div>
  </div>
</header>

<main class="stage" id="stage"></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

const ACCOUNTS = ["Current Account ···4561", "Savings Account ···7730"];
const NAME = "Ransford Gyasi";
const state = {
  type: "phone", view: "phone", acct: 0,
  values: { phone: "0244 123 821", ghana: "GHA-012345678-9" },
  flipped: {}, open: {}
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ms = n => `<span class="ms" aria-hidden="true">${n}</span>`;
const none = () => state.type === "none";
const isPhone = () => state.type === "phone";
const kind = () => (isPhone() ? "Phone number" : "Ghana Card");
const landing = () => ACCOUNTS[state.acct];
// A Ghana Card is a government ID, so it stays masked on screen. Copy still gives the full number.
const shown = () => {
  if (isPhone()) return esc(state.values.phone);
  const v = state.values.ghana;
  return esc(v.slice(0, 8) + "•••••" + v.slice(-2));
};

const head = () => `<div class="head"><button class="bk" type="button" aria-label="Back">${ms("chevron_left")}</button><h3>Proxy Payments</h3></div>`;
const tile = (icon, title, act, bin) => `<button class="tile" type="button" data-act="${act}"><span class="${bin ? "bin" : ""}" style="display:flex">${ms(icon)}</span><span class="t">${title}</span><span class="chev" style="display:flex">${ms("chevron_right")}</span></button>`;
const tTransfer = () => tile("swap_horiz", "Transfer to a Proxy ID", "transfer");
const tUpdate = () => tile("edit", "Update Proxy ID", "update");
const tDereg = () => tile("delete", "Deregister Proxy ID", "dereg", true);
const threeTiles = () => `<div class="stack">${tTransfer()}${none() ? "" : tUpdate() + tDereg()}</div>`;
const shareLinks = () => `<div class="links"><button class="lk" type="button" data-act="copy">Copy</button>${isPhone() ? `<button class="lk" type="button" data-act="share">Share</button>` : ""}</div>`;
const emptyCopy = "No proxy ID yet. Add one and people can pay you with just your phone number.";

const wing = () => `<span class="wing" aria-hidden="true">${WING}</span>`;
const logo = () => `<span class="logo" aria-hidden="true">${LOGO}</span>`;

  pills.appendChild(pill);

  const slot = document.createElement("section");
  slot.className = "slot"; slot.id = "v" + (i + 1);
  slot.innerHTML = `<div class="slot-head"><span>${i + 1}</span><h2>${v.title}</h2></div><div class="frame"><div class="screen ${v.bleed ? "bleed" : ""}"></div></div><p class="note">${v.note}</p>`;
  stage.appendChild(slot);
});

function render() {
  VARIATIONS.forEach((v, i) => { stage.children[i].querySelector(".screen").innerHTML = v.body(i); });
  stage.classList.toggle("desktop", state.view === "desktop");
  mark("seg-state", state.type);
  mark("seg-view", state.view);
}
function mark(id, val) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === val)));
}

const toastEl = document.getElementById("toast");
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), 1800);
}

const dlg = document.getElementById("dlg");
function openForm(mode) {
  const startType = none() ? "phone" : state.type;
  dlg.innerHTML = `<form class="dlg" method="dialog">
    <h3>${mode === "edit" ? "Update Your Proxy ID" : "Create a Proxy ID"}</h3>
    <label class="fld">Proxy Type<select id="f-type"><option value="phone">Phone Number</option><option value="ghana">Ghana Card</option></select></label>
    <label class="fld"><span id="f-label">Phone Number</span><input id="f-value" class="tabular" autocomplete="off"></label>
    <label class="fld">Receives Into<select id="f-acct">${ACCOUNTS.map((a, i) => `<option value="${i}">${a}</option>`).join("")}</select></label>
    <div class="dlg-f"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn" type="submit">${mode === "edit" ? "Save changes" : "Create proxy ID"}</button></div>
  </form>`;
  const t = dlg.querySelector("#f-type"), val = dlg.querySelector("#f-value"), lab = dlg.querySelector("#f-label"), acct = dlg.querySelector("#f-acct");
  const fill = () => { val.value = state.values[t.value]; lab.textContent = t.value === "phone" ? "Phone Number" : "Ghana Card Number"; };
  t.value = startType; acct.value = String(state.acct); fill();
  t.addEventListener("change", fill);
  dlg.querySelector("form").addEventListener("submit", e => {
    e.preventDefault();
    if (val.value.trim().length < 3) { val.focus(); return; }
    state.values[t.value] = val.value.trim(); state.type = t.value; state.acct = Number(acct.value);
    dlg.close(); render(); toast(mode === "edit" ? "Proxy ID updated" : "Proxy ID created");
  });
  dlg.showModal();
}
function openDereg() {
  const v = isPhone() ? esc(state.values.phone) : shown();
  dlg.innerHTML = `<div class="dlg"><h3>Deregister your proxy ID?</h3>
    <p>People will no longer be able to pay you using <b class="tabular">${v}</b>. You can register a new one at any time.</p>
    <div class="dlg-f"><button class="btn ghost" type="button" data-close>Keep it</button><button class="btn bad" type="button" id="do-dereg">Deregister</button></div></div>`;
  dlg.querySelector("#do-dereg").addEventListener("click", () => { state.type = "none"; dlg.close(); render(); toast("Proxy ID deregistered"); });
  dlg.showModal();
}
dlg.addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target === dlg) dlg.close(); });

stage.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, i = el.dataset.i;
  if (act === "copy") {
    try { await navigator.clipboard.writeText(state.values[state.type].replace(/\s/g, "")); } catch (err) { /* blocked on file:// in some browsers */ }
    toast("Proxy ID copied");
  } else if (act === "share") toast("Opens the phone's share sheet");
  else if (act === "transfer") toast("Opens the transfer flow");
  else if (act === "update") openForm("edit");
  else if (act === "create") openForm("create");
  else if (act === "dereg") openDereg();
  else if (act === "flip") {
    state.flipped[i] = !state.flipped[i];
    const f = stage.querySelector(`[data-flip="${i}"]`);
    f.classList.toggle("on", state.flipped[i]);
    f.querySelector(".front").toggleAttribute("inert", state.flipped[i]);
    f.querySelector(".back").toggleAttribute("inert", !state.flipped[i]);
  } else if (act === "peek") {
    state.open[i] = !state.open[i];
    stage.querySelector(`[data-peek="${i}"]`).classList.toggle("on", state.open[i]);
    el.setAttribute("aria-expanded", String(state.open[i]));
  }
});

document.getElementById("seg-state").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.type = b.dataset.v; render(); } });
document.getElementById("seg-view").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.view = b.dataset.v; render(); } });

function setTheme(t) { document.documentElement.setAttribute("data-theme", t); mark("seg-theme", t); }
document.getElementById("seg-theme").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTheme(b.dataset.v); });
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) [...pills.children].forEach((p, k) => p.classList.toggle("on", "v" + (k + 1) === en.target.id));
}), { rootMargin: "-30% 0px -60% 0px" });
document.querySelectorAll(".slot").forEach(s => io.observe(s));

render();
</script>
</body>
</html>
