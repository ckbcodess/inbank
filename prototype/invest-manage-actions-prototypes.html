<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invest: Your Holdings Page, Clear Actions: 8 Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--page:#ececea;--surf:#fff;--tile:#f4f4f5;--tileh:#ebebed;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--amt:#a16207;--ink:#0b0b0c;--shadow:0 24px 60px -24px rgba(0,0,0,.3)}
  [data-theme=dark]{--page:#050505;--surf:#0d0d0d;--tile:#1a1a1a;--tileh:#222;--bd:#2c2c2c;--tx:#f5f5f5;--mu:#a3a3a3;--amt:#fbbf24;--shadow:0 24px 60px -24px rgba(0,0,0,.9)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  h1,h2,h3,p,ul{margin:0;padding:0} ul{list-style:none}
  .mu{color:var(--mu)} .am{color:var(--amt)} .tab{font-variant-numeric:tabular-nums}
  .bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500}
  .pills{display:flex;gap:4px;overflow-x:auto;padding:2px 0}
  .pill{flex:none;font-size:13px;padding:8px 12px;border-radius:8px;color:var(--mu);min-height:36px;white-space:nowrap}
  .pill:hover{background:var(--tile);color:var(--tx)} .pill.on{background:var(--am);color:#111;font-weight:500}
  .seg{display:inline-flex;background:var(--tile);border-radius:12px;padding:4px}
  .seg button{padding:8px 14px;border-radius:8px;font-size:13px;color:var(--mu);min-height:36px}
  .seg button.on{background:var(--am);color:#111;font-weight:500}
  .ctrls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.55;max-width:1100px}
  .stage{padding:32px 24px 80px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;align-items:flex-start}
  .cell{display:flex;flex-direction:column;gap:12px;width:620px;max-width:100%}
  .cap{font-size:13px;color:var(--mu);padding:0 4px;line-height:1.5} .cap b{color:var(--tx);font-weight:500}
  .frame{background:var(--surf);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-height:520px;display:flex;flex-direction:column;position:relative}
  .scroll{flex:1;padding:28px 32px 32px;display:flex;flex-direction:column;gap:24px;width:100%;max-width:560px;margin:0 auto}
  .hd{display:flex;align-items:center;gap:10px}
  .hd h2{font-size:20px;font-weight:500;letter-spacing:-.02em}
  .bk{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);border-radius:50%}
  .btn{height:44px;padding:0 20px;border-radius:14px;background:var(--am);color:#111;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)} .btn.ghost:hover{background:var(--tile);filter:none}
  .btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:12px}
  .btn.full{width:100%}
  .h3{font-size:16px;font-weight:500}
  .big{font-size:44px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
  .sech{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
  .sec{display:flex;flex-direction:column;gap:12px}
  .grp{background:var(--tile);border-radius:20px;padding:8px}
  .li{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;width:100%}
  .li:hover{background:var(--tileh)}
  .li .ic{width:36px;height:36px;border-radius:10px;background:var(--tileh);display:flex;align-items:center;justify-content:center;color:var(--mu);flex:none}
  .li .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .li .t{font-size:14px} .li .m{font-size:12px;color:var(--mu)} .li .m.am{color:var(--amt)}
  .li .e{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:14px} .li .e small{font-size:12px;color:var(--mu)}
  .li .e.am small{color:var(--amt)}
  .lnk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;width:100%;font-size:14px}
  .lnk:hover{background:var(--tileh)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--tile);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:104px}
  .tile:hover{background:var(--tileh)}
  .tile.pri{background:var(--am);color:#111} .tile.pri:hover{filter:brightness(1.06)}
  .tile .d{width:36px;height:36px;border-radius:50%;background:var(--tileh);display:flex;align-items:center;justify-content:center}
  .tile.pri .d{background:rgba(0,0,0,.12)}
  .tile .n{font-size:14px;font-weight:500} .tile .s{font-size:12px;color:var(--mu);margin-top:2px} .tile.pri .s{color:rgba(0,0,0,.6)}
  .add{display:flex;align-items:center;gap:12px;padding:14px 12px;border:1px dashed var(--bd);border-radius:12px;width:100%;color:var(--mu);font-size:14px;margin-top:4px}
  .add:hover{background:var(--tileh);color:var(--tx)}
  .u{text-decoration:underline;text-underline-offset:3px}
  .dock{position:sticky;bottom:0;margin-top:auto;padding:16px 0 0;background:linear-gradient(transparent,var(--surf) 30%);display:flex;gap:8px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd)}
  .tabs button{padding:10px 14px;font-size:14px;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--tx);border-color:var(--am)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--surf);font-size:13px;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.16,1,.3,1);z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="bar">
  <div class="row">
    <h1>Invest · the page you land on when you hold something · 8 variations of Statement and Buy Another</h1>
    <div class="ctrls">
      <div class="seg" id="prodsel"></div>
      <div class="seg" id="themesel"></div>
    </div>
  </div>
  <nav class="pills" id="pills" aria-label="Variations"></nav>
  <p class="note-bar" id="vnote"></p>
</header>
<main class="stage" id="stage"></main>
<div class="toast" id="toast" role="status"></div>

<script>
const svg=(p,s=18,sw=1.7)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={
 doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
 stmt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 bond:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M9.8 10c0-.9.9-1.4 2.2-1.4s2.2.5 2.2 1.4-.9 1.2-2.2 1.6-2.2.7-2.2 1.6.9 1.4 2.2 1.4 2.2-.5 2.2-1.4"/>',
 vault:'<path d="M4 11h13a3 3 0 013 3v2a3 3 0 01-3 3H8a4 4 0 01-4-4z"/><path d="M8 11V8a2 2 0 014 0v3"/>'
};
const back=svg('<path d="M15 6l-6 6 6 6"/>',20,1.8);
const chev=svg('<path d="M9 6l6 6-6 6"/>',16,1.8);

/* ---- holdings, with the figures the app shows ---- */
const PROD={
 td:{name:'Term Deposits',title:'Your Term Deposits',buy:'Open Another',what:'deposit',icon:'vault',
  h:[{t:'182-day Term Deposit',sub:'Deposit · Matures 08 Apr 2027',fig:2000000,left:'164 days left'},{t:'91-day Term Deposit',sub:'Deposit · Matures 19 Nov 2026',fig:1031164,left:'5 days left',soon:1}]},
 bl:{name:'Treasury Bills',title:'Your Treasury Bills',buy:'Buy Another',what:'bill',icon:'doc',
  h:[{t:'91-day Treasury Bill',sub:'Bill · Matures 03 Dec 2026',fig:1000000,left:'56 days left'},{t:'91-day Treasury Bill',sub:'Bill · Matures 15 Jan 2027',fig:51658,left:'99 days left'}]},
 bn:{name:'Bonds',title:'Your Bonds',buy:'Buy Another',what:'bond',icon:'bond',
  h:[{t:'6-Year Fixed Bond',sub:'Bond · Matures 17 Feb 2031',fig:1500000,left:'4 years left'}]}
};
const ghs=c=>'GHS '+(c/100).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});
const S={v:1,prod:'bl',dark:true};
const P=()=>PROD[S.prod];
const total=()=>P().h.reduce((a,x)=>a+x.fig,0);

const hold=(x,i)=>`<button class="li" data-a="toast:Opens the holding"><span class="ic">${svg(IC[P().icon],16)}</span><span class="g"><span class="t">${x.t}</span><span class="m">${x.sub}</span></span><span class="e ${x.soon?'am':''}"><span class="tab">${ghs(x.fig)}</span><small>${x.left}</small></span><span class="mu">${chev}</span></button>`;
const list=(extra='')=>`<div class="grp">${P().h.map(hold).join('')}${extra}</div>`;
const about=()=>`<div class="grp"><button class="lnk" data-a="toast:About ${P().name}"><span>About ${P().name.toLowerCase()}</span><span class="mu">${chev}</span></button></div>`;
const hd=t=>`<div class="hd"><span class="bk">${back}</span><h2>${t}</h2></div>`;
const frame=h=>`<div class="frame"><div class="scroll">${h}</div></div>`;
const cell=(c,h)=>`<div class="cell"><p class="cap">${c}</p>${h}</div>`;
const bStmt=(cls='ghost',full='')=>`<button class="btn ${cls} ${full}" data-a="toast:Opens the ${P().name} statement">${svg(IC.stmt,16)}Statement</button>`;
const bBuy=(cls='',full='')=>`<button class="btn ${cls} ${full}" data-a="toast:Opens the list to ${P().buy.toLowerCase()}">${svg(IC.plus,16,2)}${P().buy}</button>`;

const V={};

V[1]={name:'1. Two buttons under the heading',
 note:'The smallest change: the heading stands alone, and the two actions become real buttons on one row under it, side by side at the same width. Buy Another is the filled amber one; Statement is outlined. Nothing is small any more, and the pair never wraps off the heading.',
 f:()=>[cell('<b>Heading, then the pair.</b>',frame(hd(P().name)+`<div class="sec"><h3 class="h3">${P().title}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${bStmt('ghost','full')}${bBuy('','full')}</div></div>`+list()+about()))]};

V[2]={name:'2. The total, then the actions',
 note:'The holdings are a balance, so they earn the one loud figure: what you hold in this product, under a lead-in. The two actions sit right under it as a pair, so they read as things you do to that number. The rows follow.',
 f:()=>[cell('<b>Figure, actions, rows.</b>',frame(hd(P().name)+`<div class="sec"><span class="mu" style="font-size:13px">You hold</span><span class="big">${ghs(total())}</span></div><div style="display:flex;gap:12px">${bBuy('','')}${bStmt('ghost','')}</div>`+`<div class="sec"><h3 class="h3">${P().title}</h3>${list()}</div>`+about()))]};

V[3]={name:'3. Two tiles with a line of what they do',
 note:'Each action is a tile with a plain explanation, so nobody has to guess what Statement gives them. Buy Another is amber, Statement is quiet. The tiles sit above the holdings, so the first screen is: what I can do, then what I have.',
 f:()=>[cell('<b>Action tiles first.</b>',frame(hd(P().name)+`<div class="tiles"><button class="tile pri" data-a="toast:Opens the list"><span class="d">${svg(IC.plus,18,2)}</span><span><div class="n">${P().buy}</div><div class="s">Add to your ${P().what}s</div></span></button><button class="tile" data-a="toast:Opens the statement"><span class="d">${svg(IC.stmt,18)}</span><span><div class="n">Statement</div><div class="s">View or download</div></span></button></div>`+`<div class="sec"><h3 class="h3">${P().title}</h3>${list()}</div>`+about()))]};

V[4]={name:'4. Actions as rows below the holdings',
 note:'Holdings first, because they are what the customer came for. Under them, one grouped list of what they can do: a row to buy another, a row for the statement, a row for About. All three are the same kind of thing, so they share one pattern and nothing is a tiny button.',
 f:()=>[cell('<b>Holdings, then a list of things to do.</b>',frame(hd(P().name)+`<div class="sec"><h3 class="h3">${P().title}</h3>${list()}</div>`+`<div class="grp"><button class="lnk" data-a="toast:Opens the list"><span><div>${P().buy}</div><div class="mu" style="font-size:12px;margin-top:2px">See what is on offer</div></span><span class="mu">${chev}</span></button><button class="lnk" data-a="toast:Opens the statement"><span><div>Statement</div><div class="mu" style="font-size:12px;margin-top:2px">Every ${P().what} in one place, to view or download</div></span><span class="mu">${chev}</span></button><button class="lnk" data-a="toast:About"><span>About ${P().name.toLowerCase()}</span><span class="mu">${chev}</span></button></div>`))]};

V[5]={name:'5. A bar that stays on screen',
 note:'The actions never leave: a bar fixed to the bottom of the page holds Buy Another (the main button) and Statement beside it. The page above scrolls with holdings and About, so with six holdings the buttons are still one tap away.',
 f:()=>[cell('<b>Bottom bar.</b>',frame(hd(P().name)+`<div class="sec"><h3 class="h3">${P().title}</h3>${list()}</div>`+about()+`<div class="dock"><button class="btn ghost" style="flex:1" data-a="toast:Opens the statement">${svg(IC.stmt,16)}Statement</button><button class="btn" style="flex:1.4" data-a="toast:Opens the list">${svg(IC.plus,16,2)}${P().buy}</button></div>`))]};

V[6]={name:'6. One filled button, one plain link',
 note:'A real hierarchy in the heading row instead of two matching small pills: Buy Another is a proper filled button, and Statement is an underlined text link beside it. The primary is obvious, the secondary is still easy to find, and the row has one loud thing.',
 f:()=>[cell('<b>Heading row with a primary and a link.</b>',frame(hd(P().name)+`<div class="sech"><h3 class="h3">${P().title}</h3><div style="display:flex;align-items:center;gap:20px"><button class="u" style="font-size:14px" data-a="toast:Opens the statement">Statement</button>${bBuy('sm')}</div></div>`+list()+about()))]};

V[7]={name:'7. Statement shows what is in it',
 note:'The statement stops being a mystery: under the holdings, a short "Recent" list shows the last few things that happened (bought, interest paid) with a View Statement link. Buy Another is the one filled button in the heading. The customer sees what the statement holds before opening it.',
 f:()=>{const ev=[['Bought '+P().h[0].t,'12 Oct 2026',ghs(P().h[0].fig)],['Interest credited','28 Sep 2026','+'+ghs(Math.round(P().h[0].fig*0.0085))],['Matured and paid out','03 Jun 2026','+'+ghs(Math.round(P().h[0].fig*0.97))]];
  return [cell('<b>A preview of the statement.</b>',frame(hd(P().name)+`<div class="sech"><h3 class="h3">${P().title}</h3>${bBuy('sm')}</div>`+list()+`<div class="sec"><div class="sech"><h3 class="h3">Recent</h3><button class="u" style="font-size:14px" data-a="toast:Opens the statement">View Statement</button></div><div class="grp">${ev.map(e=>`<div class="li" style="cursor:default"><span class="g"><span class="t">${e[0]}</span><span class="m">${e[1]}</span></span><span class="e tab">${e[2]}</span></div>`).join('')}</div></div>`+about()))]}};

V[8]={name:'8. Buy Another lives in the list',
 note:'The list does the work: its last row is a dashed Add row ("Buy another bill"), so adding feels like adding to this list, and it stays beside the holdings it extends. Statement becomes a proper outlined button in the heading, the only thing up there.',
 f:()=>[cell('<b>Add row inside the list.</b>',frame(hd(P().name)+`<div class="sech"><h3 class="h3">${P().title}</h3>${bStmt('ghost sm')}</div>`+list(`<button class="add" data-a="toast:Opens the list">${svg(IC.plus,16,2)}<span>${P().buy.replace('Another','another '+P().what)}</span></button>`)+about()))]};

/* ---------- chrome ---------- */
const $=id=>document.getElementById(id);
const seg=(id,list,cur,key)=>{$(id).innerHTML=list.map(([k,l])=>`<button class="${String(cur)===String(k)?'on':''}" data-a="${key}:${k}">${l}</button>`).join('')};
function render(){
  seg('prodsel',[['td','Term Deposits'],['bl','Treasury Bills'],['bn','Bonds']],S.prod,'prod');
  seg('themesel',[['dark','Dark'],['light','Light']],S.dark?'dark':'light','theme');
  $('pills').innerHTML=Object.keys(V).map(k=>`<button class="pill ${+k===S.v?'on':''}" data-a="v:${k}">${V[k].name}</button>`).join('');
  $('vnote').textContent=V[S.v].note;
  document.documentElement.dataset.theme=S.dark?'dark':'light';
  $('stage').innerHTML=V[S.v].f().join('');
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const [a,...r]=el.dataset.a.split(':'),arg=r.join(':');
  if(a==='toast'){toast(arg);return}
  if(a==='v')S.v=+arg;
  else if(a==='prod')S.prod=arg;
  else if(a==='theme')S.dark=arg==='dark';
  render();
});
render();
</script>
</body>
</html>
