<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Change Email: 12 Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--page:#ececea;--surf:#fff;--tile:#f4f4f5;--tileh:#ebebed;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--amsoft:#fff6dc;--amtx:#8a5a00;--err:#b42318;--shadow:0 24px 60px -24px rgba(0,0,0,.3)}
  [data-theme=dark]{--page:#050505;--surf:#141414;--tile:#1f1f1f;--tileh:#262626;--bd:#2a2a2a;--tx:#f5f5f5;--mu:#a3a3a3;--amsoft:#2a2410;--amtx:#f5c542;--err:#f97066;--shadow:0 24px 60px -24px rgba(0,0,0,.9)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  h1,p{margin:0;font-weight:inherit}
  .tab{font-variant-numeric:tabular-nums}
  .bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .wrap{flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500}
  .pills,.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
  .seg{background:var(--tile);border-radius:10px;padding:4px}
  .pill,.seg button{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--mu);min-height:36px;min-width:36px}
  .pill:hover{background:var(--tile);color:var(--tx)}
  .pill.on,.seg button.on{background:var(--am);color:#111;font-weight:500}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.5;max-width:1000px}
  .note-bar b{color:var(--tx);font-weight:500}
  .stage{padding:32px 16px 80px;display:flex;justify-content:center}
  .modal{width:860px;max-width:100%;min-height:600px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);display:flex;overflow:hidden}
  .side{width:220px;background:color-mix(in srgb,var(--tile) 50%,var(--surf));border-right:1px solid var(--bd);padding:24px 12px;display:flex;flex-direction:column;gap:2px;flex:none}
  .side .g{font-size:12px;color:var(--mu);padding:12px 8px 4px}
  .side span.i{padding:6px 8px;border-radius:8px;font-size:13px;color:var(--mu);font-weight:500}
  .side span.on{background:var(--am);color:#111}
  .main{flex:1;padding:24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
  @media(max-width:700px){.side{display:none}.main{padding:20px 16px}}
  .mu{color:var(--mu)} .s12{font-size:12px} .s13{font-size:13px} .am{color:var(--amtx)}
  .hd{display:flex;align-items:center;gap:12px;padding-top:28px;font-size:16px;font-weight:500}
  .hd span{color:var(--mu);font-weight:400}
  .col{display:flex;flex-direction:column}
  .fld{height:44px;border:1px solid var(--bd);background:var(--surf);border-radius:8px;padding:0 12px;width:100%;outline:none}
  .fld:focus{border-color:var(--tx)}
  .btn{height:44px;border-radius:8px;background:var(--am);color:#111;font-weight:500;width:100%;text-align:center}
  .btn.dis{opacity:.4;pointer-events:none}
  .btn.o{background:var(--surf);border:1px solid var(--bd);color:var(--tx)}
  .amt{letter-spacing:-.02em;border:0;background:none;outline:none;text-align:center;width:100%;font-size:40px}
  .bare{border:0;outline:none;background:none}
  .stp{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);font-size:20px;flex:none}
  .stp:hover{background:var(--tile)}
  input[type=range]{width:100%;accent-color:var(--am)}
  .opt{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer}
  .opt.on{border-color:var(--am);background:var(--amsoft)}
  .trk{height:6px;border-radius:999px;background:var(--tile);overflow:hidden}
  .trk i{display:block;height:100%;border-radius:999px;background:var(--tx)}
  .trk i.n{background:var(--am)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--surf);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60}
</style>
</head>
<body>
<div class="bar">
  <div class="row wrap">
    <h1>Change email: 12 variations</h1>
    <div class="row wrap" style="gap:12px">
      <div class="pills" id="pills"></div>
      <div class="seg" id="theme"><button data-t="light" class="on">Light</button><button data-t="dark">Dark</button></div>
    </div>
  </div>
  <p class="note-bar" id="note"></p>
</div>
<div class="stage"><div class="modal">
  <nav class="side">
    <span class="g">You</span><span class="i on">Profile</span><span class="i">Preferences</span>
    <span class="g">Safety</span><span class="i">Security</span><span class="i">Linked devices</span><span class="i">Limits</span><span class="i">Notifications</span>
    <span class="g">More</span><span class="i">Refer a Friend</span>
  </nav>
  <main class="main" id="main"></main>
</div></div>
<script>
const S={v:1,theme:"light",val:"",step:"enter"};
const OLD="ishmael.gyan@example.com", MASK="is*****@example.com";
const ok=()=>/^\S+@\S+\.\S+$/.test(S.val)&&S.val.toLowerCase()!==OLD;
const same=()=>S.val.toLowerCase()===OLD;
const hd='<div class="hd"><span>&lsaquo;</span>Change email</div>';
const fld=(ph)=>`<input class="fld" type="email" autocomplete="email" placeholder="${ph||""}" value="${S.val}" data-in="em">`;
const lbl=t=>`<p class="s13" style="font-weight:500">${t}</p>`;
const err=()=>same()?`<p class="s12" style="color:var(--err)">That's already your email.</p>`:"";
const send=(t)=>`<button class="btn ${ok()?"":"dis"}" data-a="send">${t||"Send Code"}</button>`;
const wrap=(inner,extra)=>`<div class="col" style="gap:20px;max-width:440px;width:100%;margin:0 auto;padding-top:16px;${extra||""}">${inner}</div>`;
const NOTES={
1:"<b>1 &middot; Current, then new.</b> Your current email as a quiet row, one field, one full-width button. The code destination is said on the button's step.",
2:"<b>2 &middot; Before &rarr; after panel.</b> A panel shows Current and New (filling as you type). The code line sits under it.",
3:"<b>3 &middot; Field only, code on the button.</b> Just the field; the button reads \"Send code to is*****@…\" so the consequence is on the action.",
4:"<b>4 &middot; Sentence.</b> \"We'll send a code to is*****@example.com to confirm it's you.\" Then the field and button.",
5:"<b>5 &middot; Two steps shown.</b> A small 1&middot;2 step line (New email &rarr; Confirm code) so the person knows what's next.",
6:"<b>6 &middot; Prefilled to edit.</b> The field starts with the current email, ready to change. No separate 'current' line.",
7:"<b>7 &middot; Confirm field.</b> New email typed twice, matching inline. Safer against typos; heavier.",
8:"<b>8 &middot; Where alerts go.</b> Explains what the email is used for (receipts, statements) above the field.",
9:"<b>9 &middot; Code to the phone.</b> The code goes to your mobile instead, since you may have lost the old inbox. States it.",
10:"<b>10 &middot; Centred, icon-led.</b> A mail icon, a one-line title and the field, centred like the referral panel.",
11:"<b>11 &middot; Inline on the profile row.</b> No new page feel: the Email row becomes a field with Save and Cancel.",
12:"<b>12 &middot; Summary + field.</b> Like the limits step: a panel with Current email and Code goes to, then the field and button.",
};
const V={
1:()=>wrap(`<div class="row s13"><span class="mu">Current</span><span>${OLD}</span></div>${lbl("New Email")}${fld()}${err()}${send()}`),
2:()=>wrap(`<div class="col" style="border:1px solid var(--bd);border-radius:10px;padding:16px;gap:12px"><div class="row"><span class="mu">Current</span><span>${OLD}</span></div><div class="row"><span class="mu">New</span><span class="${S.val?"":"mu"}">${S.val||"&mdash;"}</span></div></div>${lbl("New Email")}${fld()}${err()}<p class="s12 mu">We'll send a code to ${MASK}.</p>${send()}`),
3:()=>wrap(`${lbl("New Email")}${fld()}${err()}${send("Send code to "+MASK)}`),
4:()=>wrap(`<p class="mu" style="line-height:1.6">We'll send a code to <span style="color:var(--tx)">${MASK}</span> to confirm it's you.</p>${lbl("New Email")}${fld()}${err()}${send()}`),
5:()=>wrap(`<div class="row s12" style="justify-content:flex-start;gap:8px"><span style="width:20px;height:20px;border-radius:50%;background:var(--am);color:#111;display:inline-flex;align-items:center;justify-content:center">1</span><span>New email</span><span class="mu">&rarr;</span><span style="width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center" class="mu">2</span><span class="mu">Confirm with a code</span></div>${lbl("New Email")}${fld()}${err()}${send("Continue")}`),
6:()=>{if(S.val==="")S.val=OLD;return wrap(`${lbl("Email")}${fld()}${err()}<p class="s12 mu">A code goes to your current address to confirm.</p>${send("Save")}`)},
7:()=>{const m=S.c===undefined||S.c===""||S.c===S.val;return wrap(`${lbl("New Email")}${fld()}${err()}${lbl("Confirm New Email")}<input class="fld" type="email" value="${S.c||""}" data-in="c">${m?"":`<p class="s12" style="color:var(--err)">These don't match.</p>`}${`<button class="btn ${ok()&&S.c===S.val?"":"dis"}" data-a="send">Send Code</button>`}`)},
8:()=>wrap(`<p class="mu" style="line-height:1.6">Receipts, statements and security alerts go to this address.</p><div class="row s13"><span class="mu">Now</span><span>${OLD}</span></div>${lbl("New Email")}${fld()}${err()}${send()}`),
9:()=>wrap(`<div class="row s13"><span class="mu">Current</span><span>${OLD}</span></div>${lbl("New Email")}${fld()}${err()}<p class="s12 mu">We'll text a code to +233 55 *** 0313 to confirm.</p>${send()}`),
10:()=>wrap(`<div style="width:48px;height:48px;border-radius:50%;background:var(--tile);display:flex;align-items:center;justify-content:center;margin:0 auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><p style="text-align:center;font-size:18px;font-weight:500">Use a new email</p><p class="s13 mu" style="text-align:center">Now ${OLD}</p>${fld("New email")}${err()}${send()}`,"text-align:left"),
11:()=>`<div class="col" style="gap:8px;max-width:560px;padding-top:16px"><div class="row" style="padding:12px;border-radius:10px;background:var(--tile)"><span class="mu" style="width:80px">Email</span><input class="fld" style="flex:1;height:36px" type="email" placeholder="${OLD}" value="${S.val}" data-in="em"><button class="btn ${ok()?"":"dis"}" style="width:auto;height:36px;padding:0 14px" data-a="send">Save</button><button class="btn o" style="width:auto;height:36px;padding:0 14px">Cancel</button></div>${err()}<p class="s12 mu">A code goes to ${MASK} when you save.</p></div>`,
12:()=>wrap(`<div class="col" style="border:1px solid var(--bd);border-radius:10px;padding:16px;gap:12px"><div class="row"><span class="mu">Current email</span><span>${OLD}</span></div><div class="row"><span class="mu">Code goes to</span><span>${MASK}</span></div></div>${lbl("New Email")}${fld("name@example.com")}${err()}${send()}`),
};
function render(focus){
  document.documentElement.dataset.theme=S.theme;
  document.getElementById("pills").innerHTML=Array.from({length:12},(_,i)=>i+1).map(k=>`<button class="pill ${S.v===k?"on":""}" data-v="${k}">${k}</button>`).join("");
  document.getElementById("note").innerHTML=NOTES[S.v];
  document.getElementById("main").innerHTML=hd+V[S.v]();
  if(focus){const el=document.querySelector(`[data-in="${focus}"]`);if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}}
}
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!t.dataset.in)return;if(t.dataset.in==="c")S.c=t.value;else S.val=t.value;render(t.dataset.in);});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-v],[data-t],[data-a]"); if(!t) return;
  if(t.dataset.v){S.v=+t.dataset.v;S.val="";S.c=undefined;}
  else if(t.dataset.t){S.theme=t.dataset.t;document.querySelectorAll("#theme button").forEach(x=>x.classList.toggle("on",x===t));}
  else if(t.dataset.a==="send"){const el=document.createElement("div");el.className="toast";el.textContent="Goes to the code step";document.body.appendChild(el);setTimeout(()=>el.remove(),1300);return;}
  render();
});
render();
</script>
</body>
</html>
