<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Theme Picker: 8 Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--page:#ececea;--surf:#fff;--tile:#f4f4f5;--tileh:#ebebed;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--amsoft:#fff6dc;--amtx:#8a5a00;--err:#b42318;--shadow:0 24px 60px -24px rgba(0,0,0,.3)}
  [data-theme=dark]{--page:#050505;--surf:#141414;--tile:#1f1f1f;--tileh:#262626;--bd:#2a2a2a;--tx:#f5f5f5;--mu:#a3a3a3;--amsoft:#2a2410;--amtx:#f5c542;--err:#f97066;--shadow:0 24px 60px -24px rgba(0,0,0,.9)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  h1,p{margin:0;font-weight:inherit}
  .tab{font-variant-numeric:tabular-nums}
  .bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .wrap{flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500}
  .pills,.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
  .seg{background:var(--tile);border-radius:10px;padding:4px}
  .pill,.seg button{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--mu);min-height:36px;min-width:36px}
  .pill:hover{background:var(--tile);color:var(--tx)}
  .pill.on,.seg button.on{background:var(--am);color:#111;font-weight:500}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.5;max-width:1000px}
  .note-bar b{color:var(--tx);font-weight:500}
  .stage{padding:32px 16px 80px;display:flex;justify-content:center}
  .modal{width:860px;max-width:100%;min-height:600px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);display:flex;overflow:hidden}
  .side{width:220px;background:color-mix(in srgb,var(--tile) 50%,var(--surf));border-right:1px solid var(--bd);padding:24px 12px;display:flex;flex-direction:column;gap:2px;flex:none}
  .side .g{font-size:12px;color:var(--mu);padding:12px 8px 4px}
  .side span.i{padding:6px 8px;border-radius:8px;font-size:13px;color:var(--mu);font-weight:500}
  .side span.on{background:var(--am);color:#111}
  .main{flex:1;padding:24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
  @media(max-width:700px){.side{display:none}.main{padding:20px 16px}}
  .mu{color:var(--mu)} .s12{font-size:12px} .s13{font-size:13px} .am{color:var(--amtx)}
  .hd{display:flex;align-items:center;gap:12px;padding-top:28px;font-size:16px;font-weight:500}
  .hd span{color:var(--mu);font-weight:400}
  .col{display:flex;flex-direction:column}
  .fld{height:44px;border:1px solid var(--bd);background:var(--surf);border-radius:8px;padding:0 12px;width:100%;outline:none}
  .fld:focus{border-color:var(--tx)}
  .btn{height:44px;border-radius:8px;background:var(--am);color:#111;font-weight:500;width:100%;text-align:center}
  .btn.dis{opacity:.4;pointer-events:none}
  .btn.o{background:var(--surf);border:1px solid var(--bd);color:var(--tx)}
  .amt{letter-spacing:-.02em;border:0;background:none;outline:none;text-align:center;width:100%;font-size:40px}
  .bare{border:0;outline:none;background:none}
  .stp{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);font-size:20px;flex:none}
  .stp:hover{background:var(--tile)}
  input[type=range]{width:100%;accent-color:var(--am)}
  .opt{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer}
  .opt.on{border-color:var(--am);background:var(--amsoft)}
  .trk{height:6px;border-radius:999px;background:var(--tile);overflow:hidden}
  .trk i{display:block;height:100%;border-radius:999px;background:var(--tx)}
  .trk i.n{background:var(--am)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--surf);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60}
</style>
</head>
<body>
<div class="bar">
  <div class="row wrap">
    <h1>Theme picker: 8 variations</h1>
    <div class="row wrap" style="gap:12px">
      <div class="pills" id="pills"></div>
      <div class="seg" id="theme"><button data-t="light" class="on">Light</button><button data-t="dark">Dark</button></div>
    </div>
  </div>
  <p class="note-bar" id="note"></p>
</div>
<div class="stage"><div class="modal">
  <nav class="side">
    <span class="g">You</span><span class="i">Profile</span><span class="i on">Appearance</span>
    <span class="g">Safety</span><span class="i">Security</span><span class="i">Linked devices</span><span class="i">Limits</span><span class="i">Notifications</span>
    <span class="g">More</span><span class="i">Refer a Friend</span>
  </nav>
  <main class="main" id="main"></main>
</div></div>
<script>
const S={v:1,theme:"light",pick:"dark",sys:false};
const OPTS=[{id:"light",l:"Light",d:"Bright, for daytime"},{id:"dark",l:"Dark",d:"Easier at night"},{id:"system",l:"System",d:"Follows your device"}];
const IC={
 light:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 dark:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 system:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
};
const thumb=(id)=>{
  const L='<div style="position:absolute;inset:0;background:#f4f4f5"><div style="position:absolute;left:10%;right:10%;top:16%;height:34%;border-radius:4px;background:#3f4954"></div><div style="position:absolute;left:10%;right:10%;top:56%;height:28%;border-radius:4px;background:#fff;border:1px solid #e5e7eb"></div></div>';
  const D='<div style="position:absolute;inset:0;background:#0f0f10"><div style="position:absolute;left:10%;right:10%;top:16%;height:34%;border-radius:4px;background:#1c1c1e;border:1px solid #2a2a2a"></div><div style="position:absolute;left:10%;right:10%;top:56%;height:28%;border-radius:4px;background:#1a1a1a;border:1px solid #2a2a2a"></div></div>';
  if(id==="light")return L; if(id==="dark")return D;
  return `${L}<div style="position:absolute;inset:0;clip-path:polygon(55% 0,100% 0,100% 100%,45% 100%)">${D}</div>`;
};
const label='<p style="font-weight:500">Theme</p>';
const on=id=>S.pick===id;
const NOTES={
1:"<b>1 &middot; Thumbnails.</b> A tiny sketch of the app in each theme (System is split diagonally), label underneath. Shows rather than names.",
2:"<b>2 &middot; Segmented control.</b> One full-width control with three equal segments, icon and label. Compact and familiar.",
3:"<b>3 &middot; Radio rows.</b> Three rows with icon, name and a one-line description, radio on the right. The most explicit.",
4:"<b>4 &middot; Thumbnails with a radio.</b> Like 1, but the sketch sits in a framed tile with a radio dot in its corner.",
5:"<b>5 &middot; Round icons.</b> Three large round icon buttons with the label under each. Light and playful, small footprint.",
6:"<b>6 &middot; Sketch + segmented.</b> One preview of the chosen theme, with a segmented control under it to switch.",
7:"<b>7 &middot; Switches.</b> \"Match my device\" switch; when off, a \"Dark mode\" switch. Two yes/no questions instead of three options.",
8:"<b>8 &middot; Tiles with a tick.</b> The current tiles, with a small amber tick badge on the selected one instead of a heavy outline.",
};
const V={
1:()=>`${label}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${OPTS.map(o=>`<button data-p="${o.id}" class="col" style="gap:8px;align-items:center"><span style="position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;outline:2px solid ${on(o.id)?"var(--tx)":"transparent"};outline-offset:2px;border:1px solid var(--bd)">${thumb(o.id)}</span><span class="s13 ${on(o.id)?"":"mu"}">${o.l}</span></button>`).join("")}</div>`,
2:()=>`${label}<div class="seg" style="display:grid;grid-template-columns:repeat(3,1fr);width:100%">${OPTS.map(o=>`<button data-p="${o.id}" class="${on(o.id)?"on":""}" style="display:flex;align-items:center;justify-content:center;gap:8px">${IC[o.id]}${o.l}</button>`).join("")}</div>`,
3:()=>`${label}<div class="col" style="gap:4px">${OPTS.map(o=>`<button data-p="${o.id}" class="row" style="padding:12px;border-radius:10px;background:${on(o.id)?"var(--tile)":"transparent"}"><span class="row" style="gap:12px;justify-content:flex-start"><span class="mu">${IC[o.id]}</span><span class="col" style="text-align:left"><span>${o.l}</span><span class="s12 mu">${o.d}</span></span></span><span style="width:18px;height:18px;border-radius:50%;border:2px solid ${on(o.id)?"var(--am)":"var(--bd)"};display:flex;align-items:center;justify-content:center">${on(o.id)?'<span style="width:8px;height:8px;border-radius:50%;background:var(--am)"></span>':""}</span></button>`).join("")}</div>`,
4:()=>`${label}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${OPTS.map(o=>`<button data-p="${o.id}" class="col" style="gap:8px;padding:8px;border-radius:12px;border:1px solid ${on(o.id)?"var(--am)":"var(--bd)"};background:${on(o.id)?"var(--amsoft)":"transparent"}"><span style="position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:6px;overflow:hidden">${thumb(o.id)}</span><span class="row s13"><span>${o.l}</span><span style="width:14px;height:14px;border-radius:50%;border:2px solid ${on(o.id)?"var(--am)":"var(--bd)"};background:${on(o.id)?"var(--am)":"transparent"}"></span></span></button>`).join("")}</div>`,
5:()=>`${label}<div class="row" style="justify-content:flex-start;gap:24px">${OPTS.map(o=>`<button data-p="${o.id}" class="col" style="gap:8px;align-items:center"><span style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${on(o.id)?"var(--am)":"var(--tile)"};color:${on(o.id)?"#111":"var(--mu)"}">${IC[o.id]}</span><span class="s13 ${on(o.id)?"":"mu"}">${o.l}</span></button>`).join("")}</div>`,
6:()=>`${label}<div style="position:relative;width:100%;aspect-ratio:16/6;border-radius:12px;overflow:hidden;border:1px solid var(--bd)">${thumb(S.pick)}</div><div class="seg" style="display:grid;grid-template-columns:repeat(3,1fr);width:100%">${OPTS.map(o=>`<button data-p="${o.id}" class="${on(o.id)?"on":""}">${o.l}</button>`).join("")}</div>`,
7:()=>{const sw=(k,v,t,d)=>`<button data-sw="${k}" class="row" style="padding:12px 0"><span class="col" style="text-align:left"><span>${t}</span><span class="s12 mu">${d}</span></span><span style="width:40px;height:24px;border-radius:999px;background:${v?"var(--am)":"var(--tile)"};position:relative;border:1px solid var(--bd)"><span style="position:absolute;top:2px;left:${v?"18px":"2px"};width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)"></span></span></button>`;return `${label}${sw("sys",S.sys,"Match my device","Switches with your phone or computer")}${S.sys?"":sw("dark",S.pick==="dark","Dark mode","Easier on the eyes at night")}`},
8:()=>`${label}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${OPTS.map(o=>`<button data-p="${o.id}" class="col" style="position:relative;height:80px;gap:8px;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--bd);background:${on(o.id)?"var(--tile)":"transparent"};color:${on(o.id)?"var(--tx)":"var(--mu)"}">${on(o.id)?'<span style="position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--am);color:#111;font-size:11px;display:flex;align-items:center;justify-content:center">&#10003;</span>':""}${IC[o.id]}<span class="s13">${o.l}</span></button>`).join("")}</div>`,
};
function render(){
  document.documentElement.dataset.theme=S.theme;
  document.getElementById("pills").innerHTML=Array.from({length:8},(_,i)=>i+1).map(k=>`<button class="pill ${S.v===k?"on":""}" data-v="${k}">${k}</button>`).join("");
  document.getElementById("note").innerHTML=NOTES[S.v];
  document.getElementById("main").innerHTML='<div class="hd">Appearance</div><div class="col" style="gap:12px;max-width:560px;padding-top:16px">'+V[S.v]()+'</div>';
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-v],[data-t],[data-p],[data-sw]"); if(!t) return;
  if(t.dataset.v){S.v=+t.dataset.v;}
  else if(t.dataset.t){S.theme=t.dataset.t;document.querySelectorAll("#theme button").forEach(x=>x.classList.toggle("on",x===t));}
  else if(t.dataset.p){S.pick=t.dataset.p;}
  else if(t.dataset.sw==="sys"){S.sys=!S.sys;S.pick=S.sys?"system":"light";}
  else if(t.dataset.sw==="dark"){S.pick=S.pick==="dark"?"light":"dark";}
  render();
});
render();
</script>
</body>
</html>
