<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Insure Plans: 10 Presentation Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#f1f1ef;--surf:#fff;--tile:#f4f4f5;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--amsoft:#fff3cf;--ok:#15803d;--sel:#f1f1f2;--shadow:0 20px 50px -20px rgba(0,0,0,.25)}
  [data-theme=dark]{--bg:#070708;--surf:#111113;--tile:#1a1a1d;--bd:#27272a;--tx:#f5f5f6;--mu:#a1a1aa;--amsoft:#3a2f0e;--ok:#4ade80;--sel:#1f1f23;--shadow:0 20px 50px -20px rgba(0,0,0,.8)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  h1,h2,h3,p,ul,ol{margin:0;padding:0}
  ul,ol{list-style:none}
  .tab{font-variant-numeric:tabular-nums}
  /* controller */
  .bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .bar-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500}
  .pills{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:2px 0}
  .pill{flex:none;font-size:13px;padding:8px 12px;border-radius:8px;color:var(--mu);min-height:36px}
  .pill:hover{background:var(--tile);color:var(--tx)}
  .pill.on{background:var(--am);color:#111;font-weight:500}
  .theme{font-size:13px;color:var(--mu);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;min-height:36px}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.5;max-width:900px}
  /* stage */
  .stage{display:flex;justify-content:center;gap:56px;flex-wrap:wrap;padding:32px 24px 64px}
  .cap{font-size:12px;color:var(--mu);margin:0 0 12px 8px}
  .phone{width:390px;height:800px;border-radius:36px;background:var(--surf);border:1px solid var(--bd);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
  .body{flex:1;overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:24px;scrollbar-width:thin}
  .foot{padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px;background:var(--surf)}
  .note{text-align:center;font-size:13px;color:var(--mu)}
  .btn{height:44px;border-radius:16px;background:var(--am);color:#111;font-weight:500;font-size:15px;text-align:center;width:100%}
  .btn:hover{filter:brightness(1.05)}
  .mu{color:var(--mu)} .s12{font-size:12px} .s13{font-size:13px} .s14{font-size:14px}
  .ico{border-radius:8px;background:var(--amsoft);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
  .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .hd{display:flex;flex-direction:column;gap:8px;padding-top:12px}
  .hd h1{font-size:22px;font-weight:500;letter-spacing:-.02em}
  h2{font-size:16px;font-weight:500}
  .back{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mu);min-height:44px;margin-top:-8px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;width:100%;transition:background .15s}
  .row:hover,.row.on{background:var(--sel)}
  .soon{padding:0 8px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu)}
  .soon h3{font-size:14px;font-weight:500;margin-bottom:4px}
  .title{font-size:22px;font-weight:500;letter-spacing:-.02em}
  .check li{display:flex;gap:12px;font-size:14px;line-height:1.5}
  .check svg{flex:none;margin-top:3px;color:var(--ok)}
  .facts>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--bd);font-size:13px}
  .facts>div:last-child{border-bottom:1px solid var(--bd)}
  .facts span:first-child{color:var(--mu)} .facts span:last-child{text-align:right}
  .panel{background:var(--tile);border-radius:16px;padding:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--bd);font-size:13px;min-height:36px}
  .chip.on{border-color:var(--tx);background:var(--sel)}
  .seg{display:flex;background:var(--tile);border-radius:12px;padding:4px}
  .seg button{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--mu);min-height:36px}
  .seg button.on{background:var(--surf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .acc{border-top:1px solid var(--bd)} .acc:last-child{border-bottom:1px solid var(--bd)}
  .acc>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 0;font-size:14px;font-weight:500;min-height:48px}
  .acc>div{padding:0 0 16px;font-size:14px;line-height:1.6;color:var(--mu)}
  input[type=range]{width:100%;accent-color:#d99b00}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);font-size:13px;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.16,1,.3,1);z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:480px){.phone{width:100%;height:760px;border-radius:24px}.stage{padding:16px 8px;gap:32px}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-top">
    <h1>Insure plans · 10 ways to present the list and the plan page</h1>
    <button class="theme" id="themeBtn">Dark mode</button>
  </div>
  <nav class="pills" id="pills" aria-label="Variations"></nav>
  <p class="note-bar" id="vnote"></p>
</header>
<main class="stage">
  <section><p class="cap">Plans list · tap a plan</p><div class="phone" id="listScreen"></div></section>
  <section><p class="cap" id="detCap">Plan page</p><div class="phone" id="detScreen"></div></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- data (from src/lib/insurance-plans.ts) ---------- */
const PROVIDER='StarLife Assurance';
const plans=[
 {id:'ce',name:'Child Education Plan',short:'Child Education',line:'Save for school fees with life protection.',
  desc:'Save towards your child’s education, with cover that keeps the plan going if something happens to you.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','School fees are paid even if you can’t','Premiums from GHS 50 a month'],
  from:50,fromTxt:'GHS 50',runs:'10 to 25 years',runsShort:'10–25 yrs',kind:'save',need:'My child’s school fees',pays:'Lump sum, fees',
  pitch:'Set school fees aside, and keep them safe',
  facts:[['Policy term','10 to 25 years'],['Premiums from','GHS 50 a month'],['Provider',PROVIDER]],
  cost:'From GHS 50 a month. You choose the premium, or the amount you want at the end, and the other follows.',
  story:[['You save every month','From GHS 50 a month, for 10 to 25 years.'],['If you can’t pay','Cover keeps the plan going, and school fees are still paid.'],['When school starts','Claim school fees from the plan, or take the lump sum when it matures.']],
  claim:['Your child’s details','Proof of school enrolment, for school fees','A valid ID'],
  who:'Parents who want fees set aside early, with the plan protected if the unexpected happens.',
  choose:'Pick a premium or the amount you want at the end.'},
 {id:'hc',name:'HomeCall Plan',short:'HomeCall',line:'Financial support for funeral expenses.',
  desc:'Help your family cover funeral expenses in a difficult time. Cover yourself, and add the people close to you.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','Cover your spouse, children and parents too','Accidental deaths are covered from day one'],
  from:8,fromTxt:'GHS 8',runs:'While you pay',runsShort:'While paying',kind:'protect',need:'My family, when I’m gone',pays:'GHS 2,500–30,000',
  pitch:'Pay for a funeral without borrowing',
  facts:[['Cover','GHS 2,500 to GHS 30,000'],['Premiums from','GHS 8 a month'],['Who it covers','You, and family you add'],['Provider',PROVIDER]],
  cost:'From GHS 8 a month for you. Children cost less, parents more.',
  story:[['Someone covered passes away','Accidental deaths are covered at once. Deaths from natural causes are covered after 90 days.'],['Your family files a claim','They need the death certificate, the medical certificate of cause of death and a valid ID.'],['The lump sum arrives','Within 48 to 72 hours of an approved claim, from GHS 2,500 up to GHS 30,000.']],
  claim:['The death certificate','The medical certificate of cause of death','A police report, if the death was accidental','A valid ID'],
  who:'Anyone who wants their family spared a funeral bill. Add your spouse, children and parents.',
  choose:'Pick a cover level for yourself and each person you add.'},
 {id:'wm',name:'WealthMaster Plan',short:'WealthMaster',line:'Save regularly with insurance cover.',
  desc:'Save regularly and grow a lump sum, with life cover for the people who depend on you.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','Your loved ones are paid if something happens to you','Premiums from GHS 50 a month'],
  from:50,fromTxt:'GHS 50',runs:'4 to 10 years',runsShort:'4–10 yrs',kind:'save',need:'Savings with a safety net',pays:'Lump sum',
  pitch:'Save a lump sum, with cover for the people who depend on you',
  facts:[['Policy term','4 to 10 years'],['Premiums from','GHS 50 a month'],['Provider',PROVIDER]],
  cost:'From GHS 50 a month. You choose the premium, or the amount you want at the end, and the other follows.',
  story:[['You save every month','From GHS 50 a month, for 4 to 10 years.'],['If something happens to you','Your loved ones are paid the sum assured.'],['At the end of the term','You receive the lump sum: what you paid in, plus growth.']],
  claim:['Your policy details','Proof of the event, for disability','A valid ID'],
  who:'Regular savers who also want the people who depend on them looked after.',
  choose:'Pick a premium or the amount you want at the end.'},
 {id:'up',name:'Ultimate Protection Plan',short:'Ultimate Protection',line:'Total protection for you and your loved ones.',
  desc:'Keep an income if illness or disability stops you working, and leave your family a lump sum.',
  benefits:['Lump sum paid within 48 to 72 hours of an approved claim','Covers total and permanent disability','Covers critical illness'],
  from:38,fromTxt:'GHS 38',runs:'8 to 20 years',runsShort:'8–20 yrs',kind:'protect',need:'My income, if I can’t work',pays:'GHS 50k–300k',
  pitch:'Keep an income if you can’t work',
  facts:[['Sum assured','GHS 50,000 to GHS 300,000'],['Policy term','8 to 20 years'],['Disability income','Up to age 70'],['Provider',PROVIDER]],
  cost:'You pick the sum assured and the premium follows. About GHS 38 a month for GHS 50,000 at 30.',
  story:[['You choose a sum assured','GHS 50,000 to GHS 300,000, for 8 to 20 years.'],['If illness or disability stops you working','Critical illness and total and permanent disability are covered, with income up to age 70.'],['Your family','A lump sum is paid to the people you leave it to.']],
  claim:['A medical report for the illness or disability','A valid ID'],
  who:'People whose income their household relies on.',
  choose:'Pick a sum assured from the list.'}
];
const SOON=['Savings Protection Plan','Vehicle Insurance','Travel Insurance','Personal Accident'];
const TIERS=[['Basic',2500,8],['Standard',5000,15],['Prestige',10000,22],['Elite',15000,32],['Ultimate',30000,60]];
const SUMS=[50000,100000,200000,300000];
const money=n=>'GHS '+Math.round(n).toLocaleString('en-US');

/* ---------- helpers ---------- */
const I={ce:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',hc:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',wm:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',up:'<path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/>'};
const svg=(p,s=18,sw=1.7)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ico=(id,s=40)=>`<span class="ico" style="width:${s}px;height:${s}px">${svg(I[id],Math.round(s*.45))}</span>`;
const chev=svg('<path d="M9 6l6 6-6 6"/>',15,1.8);
const down=(open)=>svg(open?'<path d="M6 15l6-6 6 6"/>':'<path d="M6 9l6 6 6-6"/>',16,1.8);
const tick=svg('<path d="M5 12l4 4 10-10"/>',16,1.8);
const back=`<div class="back">${svg('<path d="M15 6l-6 6 6 6"/>',16,1.8)}Insure</div>`;
const P=id=>plans.find(p=>p.id===id);
const cur=()=>P(S.sel);
const checks=p=>`<ul class="check" style="display:flex;flex-direction:column;gap:12px">${p.benefits.map(b=>`<li>${tick}<span>${b}</span></li>`).join('')}</ul>`;
const facts=rows=>`<div class="facts">${rows.map(r=>`<div><span>${r[0]}</span><span class="tab">${r[1]}</span></div>`).join('')}</div>`;
const foot=`<div class="foot"><p class="note">You’ll create your insurance profile first. You only do it once.</p><button class="btn" data-a="start">Get Started</button></div>`;
const soonBlock=`<div class="soon"><h3>Coming soon</h3>${SOON.map(s=>`<span>${s}</span>`).join('')}</div>`;
const det=(inner,f=foot)=>`<div class="body">${back}${inner}</div>${f}`;
const pageHead=(t)=>`<div class="hd"><h1>${t}</h1></div>`;

/* ---------- state ---------- */
const S={v:1,sel:'hc',dark:false,exp:'hc',tab:'overview',filter:'all',tier:1,sum:0,prem:100,years:10,faq:0,acc:0};

/* ---------- variations ---------- */
const V={};

V[1]={name:'1. Quiet Rows',note:'The current list, refined. Rows stay calm; the plan page leads with one number (what it costs), then what it pays, the facts, and one button.',
 list:()=>`<div class="body"><div class="hd"><h1>Insure</h1><p class="mu s13" style="line-height:1.6">Plans from StarLife Assurance, paid straight from your account. Look around freely.</p></div>
  <div style="display:flex;flex-direction:column;gap:8px"><h2 style="margin-bottom:4px">Plans</h2>
  ${plans.map(p=>`<button class="row ${S.sel===p.id?'on':''}" data-a="sel:${p.id}">${ico(p.id)}<span class="grow"><span class="s14">${p.name}</span><span class="mu s12">${p.line}</span></span>${chev}</button>`).join('')}</div>${soonBlock}</div>`,
 detail:()=>{const p=cur();return det(`<h1 class="title">${p.name}</h1><p style="font-size:15px;line-height:1.6">${p.desc}</p>
  <div><span class="mu s12">Premiums from</span><div class="tab" style="font-size:48px;letter-spacing:-.03em;line-height:1.1">${p.fromTxt} <span class="mu" style="font-size:15px;letter-spacing:0">a month</span></div></div>
  ${checks(p)}${facts(p.facts)}`)}};

V[2]={name:'2. Price Tiles',note:'The list becomes tiles that carry the price, so the customer can compare cost without opening anything. The plan page answers four plain questions in order: pay, get, for whom, from whom.',
 list:()=>`<div class="body"><div class="hd"><h1>Insure</h1></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${plans.map(p=>`<button data-a="sel:${p.id}" style="display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:196px;padding:16px;border-radius:16px;background:var(--tile);border:1px solid ${S.sel===p.id?'var(--tx)':'transparent'}"><span style="display:flex;flex-direction:column;gap:12px">${ico(p.id)}<span class="s14" style="font-weight:500">${p.short}</span></span><span style="display:flex;flex-direction:column;gap:2px"><span class="mu s12">From</span><span class="tab" style="font-size:24px;letter-spacing:-.02em">${p.fromTxt}</span><span class="mu s12">a month</span></span></button>`).join('')}</div>
  <p class="mu s13" style="padding:0 4px;line-height:1.6">Coming soon: Savings Protection, Vehicle, Travel and Personal Accident.</p></div>`,
 detail:()=>{const p=cur();const sec=(h,t)=>`<div style="display:flex;flex-direction:column;gap:4px"><h2 class="s14" style="font-weight:500">${h}</h2><p class="s14" style="line-height:1.6">${t}</p></div>`;
  return det(`<div class="panel" style="padding:24px 20px;border-radius:20px;display:flex;flex-direction:column;gap:16px">${ico(p.id,44)}<div style="display:flex;flex-direction:column;gap:4px"><h1 class="title">${p.name}</h1><p class="mu s14" style="line-height:1.6">${p.desc}</p></div></div>
  <div style="display:flex;flex-direction:column;gap:20px;padding:0 4px">${sec('What you pay',p.cost)}${sec('What it pays','A lump sum within 48 to 72 hours of an approved claim. '+p.benefits[1]+'.')}${sec('Who it is for',p.who)}${sec('Provided by',PROVIDER)}</div>`)}};

V[3]={name:'3. By Need',note:'Starts from the customer’s situation, not our product names. The plan page is a short story of what happens, step by step, then what it costs.',
 list:()=>`<div class="body"><div class="hd"><h1>Insure</h1><p class="mu s13" style="line-height:1.6">Start with what matters to you. We’ll show the plan that fits.</p></div>
  <div>${plans.map((p,i)=>`<button data-a="sel:${p.id}" style="display:flex;align-items:center;gap:12px;padding:20px 4px;border-top:1px solid var(--bd);${i===3?'border-bottom:1px solid var(--bd);':''}width:100%;${S.sel===p.id?'background:var(--sel);':''}"><span class="grow" style="gap:4px"><span style="font-size:17px;letter-spacing:-.01em">${p.need}</span><span class="mu s12">${p.short} · from ${p.fromTxt} a month</span></span>${chev}</button>`).join('')}</div>
  <p class="mu s13" style="padding:0 4px;line-height:1.6">Coming soon: cover for your car, your trips and accidents.</p></div>`,
 detail:()=>{const p=cur();return det(`<div style="display:flex;flex-direction:column;gap:8px"><span class="mu s12">${p.need}</span><h1 class="title">${p.name}</h1><p class="mu s14" style="line-height:1.6">${p.desc}</p></div>
  <ol style="display:flex;flex-direction:column">${p.story.map((s,i)=>`<li style="display:flex;gap:16px"><span style="display:flex;flex-direction:column;align-items:center"><span style="width:12px;height:12px;border-radius:50%;background:${i===2?'var(--am)':'var(--tx)'};margin-top:4px"></span>${i<2?'<span style="flex:1;width:1px;background:var(--bd);margin:4px 0"></span>':''}</span><span style="padding-bottom:${i<2?20:0}px;display:flex;flex-direction:column;gap:2px"><span class="s14" style="font-weight:500">${s[0]}</span><span class="mu s13" style="line-height:1.5">${s[1]}</span></span></li>`).join('')}</ol>
  <div class="panel"><span class="mu s12">It costs</span><p style="font-size:15px;line-height:1.5">${p.cost}</p></div>`)}};

V[4]={name:'4. Swipe Cards',note:'One plan at a time, large. The customer swipes through tall cards. The plan page puts the price in a sticky bar with the button, and tucks detail into sections that open on tap.',
 list:()=>`<div class="body" style="padding-left:0;padding-right:0"><div class="hd" style="padding:12px 16px 0"><h1>Insure</h1><p class="mu s13">Swipe to see each plan.</p></div>
  <div style="display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 8px;scrollbar-width:none">${plans.map(p=>`<button data-a="sel:${p.id}" style="scroll-snap-align:start;flex:none;width:276px;min-height:420px;padding:24px 20px;border-radius:24px;background:var(--tile);border:1px solid ${S.sel===p.id?'var(--tx)':'transparent'};display:flex;flex-direction:column;justify-content:space-between;gap:24px"><span style="display:flex;flex-direction:column;gap:16px">${ico(p.id,48)}<span style="display:flex;flex-direction:column;gap:6px"><span style="font-size:19px;font-weight:500;letter-spacing:-.01em">${p.name}</span><span class="mu s13" style="line-height:1.6">${p.line}</span></span></span><span style="display:flex;flex-direction:column;gap:2px"><span class="mu s12">From</span><span class="tab" style="font-size:36px;letter-spacing:-.03em;line-height:1.1">${p.fromTxt}</span><span class="mu s12">a month</span></span></button>`).join('')}</div>
  <p class="mu s13" style="padding:0 20px;line-height:1.6">Coming soon: Savings Protection, Vehicle, Travel and Personal Accident.</p></div>`,
 detail:()=>{const p=cur();const rows=[['What it pays',p.benefits.join('. ')+'.'],['What it costs',p.cost],['Who is covered',p.who],['What to have ready to claim',p.claim.join(', ')+'.']];
  return `<div class="body">${back}<div style="display:flex;flex-direction:column;gap:12px">${ico(p.id,48)}<h1 class="title">${p.name}</h1><p class="s14 mu" style="line-height:1.6">${p.desc}</p></div>
  <div>${rows.map((r,i)=>`<div class="acc"><button data-a="acc:${i}">${r[0]}${down(S.acc===i)}</button>${S.acc===i?`<div>${r[1]}</div>`:''}</div>`).join('')}</div></div>
  <div class="foot" style="border-top:1px solid var(--bd);flex-direction:row;align-items:center;gap:16px"><span style="display:flex;flex-direction:column"><span class="mu s12">From</span><span class="tab" style="font-size:20px">${p.fromTxt}<span class="mu s12"> a month</span></span></span><button class="btn" style="flex:1" data-a="start">Get Started</button></div>`}};

V[5]={name:'5. Compare Strip',note:'For customers weighing plans against each other. Filter by Save or Protect, and every row shows what it pays, what it costs and how long it runs. The plan page splits into four tabs.',
 list:()=>{const f=S.filter;const list=plans.filter(p=>f==='all'||p.kind===f);
  return `<div class="body"><div class="hd"><h1>Insure</h1></div>
  <div class="seg" role="tablist">${[['all','All'],['save','Save'],['protect','Protect']].map(x=>`<button class="${f===x[0]?'on':''}" data-a="filter:${x[0]}">${x[1]}</button>`).join('')}</div>
  <div style="display:flex;flex-direction:column;gap:12px">${list.map(p=>`<button data-a="sel:${p.id}" style="padding:16px;border-radius:16px;border:1px solid ${S.sel===p.id?'var(--tx)':'var(--bd)'};display:flex;flex-direction:column;gap:12px;width:100%"><span style="display:flex;align-items:center;gap:12px">${ico(p.id,36)}<span class="s14" style="font-weight:500;flex:1">${p.name}</span>${chev}</span>
   <span style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><span style="display:flex;flex-direction:column"><span class="mu s12">Pays</span><span class="s13 tab">${p.pays}</span></span><span style="display:flex;flex-direction:column"><span class="mu s12">From</span><span class="s13 tab">${p.fromTxt} a month</span></span><span style="display:flex;flex-direction:column"><span class="mu s12">Runs</span><span class="s13 tab">${p.runsShort}</span></span></span></button>`).join('')}</div></div>`},
 detail:()=>{const p=cur();const t=S.tab;
  const content={overview:`<p class="s14" style="line-height:1.6">${p.desc}</p>${checks(p)}`,cover:facts(p.facts.filter(f=>f[0]!=='Premiums from')),cost:`<div><span class="mu s12">Premiums from</span><div class="tab" style="font-size:36px;letter-spacing:-.03em">${p.fromTxt} <span class="mu s14" style="letter-spacing:0">a month</span></div></div><p class="s14 mu" style="line-height:1.6">${p.cost}</p>`,claims:`<p class="s14" style="line-height:1.6">Have these ready if you ever need to claim:</p><ul class="check" style="display:flex;flex-direction:column;gap:12px">${p.claim.map(c=>`<li>${tick}<span>${c}</span></li>`).join('')}</ul>`}[t];
  return det(`<h1 class="title">${p.name}</h1><div class="seg">${[['overview','Overview'],['cover','Cover'],['cost','Cost'],['claims','Claims']].map(x=>`<button class="${t===x[0]?'on':''}" data-a="tab:${x[0]}">${x[1]}</button>`).join('')}</div><div style="display:flex;flex-direction:column;gap:20px">${content}</div>`)}};

V[6]={name:'6. Try The Numbers',note:'The plan page lets the customer play with the cost and see what they get before committing. Savings plans: a premium and a term. HomeCall: a cover level. Ultimate Protection: a sum assured. Figures use the prototype’s placeholder rates.',
 list:()=>{const g=(t,k)=>`<div style="display:flex;flex-direction:column;gap:4px"><h2 style="margin-bottom:4px">${t}</h2>${plans.filter(p=>p.kind===k).map(p=>`<button class="row ${S.sel===p.id?'on':''}" data-a="sel:${p.id}">${ico(p.id)}<span class="grow"><span class="s14">${p.name}</span><span class="mu s12">${p.line}</span></span>${chev}</button>`).join('')}</div>`;
  return `<div class="body"><div class="hd"><h1>Insure</h1></div>${g('Save','save')}${g('Protect','protect')}${soonBlock}</div>`},
 detail:()=>{const p=cur();let calc='';
  if(p.kind==='save'){const [mn,mx]=p.id==='ce'?[10,25]:[4,10];S.years=Math.min(Math.max(S.years,mn),mx);
   calc=`<div class="panel" style="display:flex;flex-direction:column;gap:20px"><div><div style="display:flex;justify-content:space-between"><label class="s13" for="prem">I can save</label><span class="s13 tab" id="premV"></span></div><input id="prem" data-r="prem" type="range" min="50" max="1000" step="50" value="${S.prem}"></div>
   <div><div style="display:flex;justify-content:space-between"><label class="s13" for="yrs">For</label><span class="s13 tab" id="yrsV"></span></div><input id="yrs" data-r="years" type="range" min="${mn}" max="${mx}" step="1" value="${S.years}"></div>
   <div><span class="mu s12">You get back about</span><div class="tab" id="outV" style="font-size:40px;letter-spacing:-.03em;line-height:1.1"></div><p class="mu s12" id="outN" style="margin-top:4px;line-height:1.5"></p></div></div>`}
  if(p.id==='hc'){const t=TIERS[S.tier];calc=`<div class="panel" style="display:flex;flex-direction:column;gap:16px"><span class="s13">Choose a cover level</span><div class="chips">${TIERS.map((x,i)=>`<button class="chip ${S.tier===i?'on':''}" data-a="tier:${i}">${x[0]}</button>`).join('')}</div>
   <div><span class="mu s12">Your family receives</span><div class="tab" style="font-size:40px;letter-spacing:-.03em;line-height:1.1">${money(t[1])}</div><p class="mu s13" style="margin-top:4px">for <span class="tab">${money(t[2])}</span> a month, for you. Add family and each person gets their own level.</p></div></div>`}
  if(p.id==='up'){const s=SUMS[S.sum];const yr=s/1000*9;calc=`<div class="panel" style="display:flex;flex-direction:column;gap:16px"><span class="s13">Choose a sum assured</span><div class="chips">${SUMS.map((x,i)=>`<button class="chip tab ${S.sum===i?'on':''}" data-a="sum:${i}">${money(x)}</button>`).join('')}</div>
   <div><span class="mu s12">It would cost about</span><div class="tab" style="font-size:40px;letter-spacing:-.03em;line-height:1.1">${money(yr/12)} <span class="mu s14" style="letter-spacing:0">a month</span></div><p class="mu s12" style="margin-top:4px;line-height:1.5">${money(yr)} a year, at age 30. Your price depends on your age and health.</p></div></div>`}
  return det(`<div style="display:flex;flex-direction:column;gap:8px"><h1 class="title">${p.name}</h1><p class="mu s14" style="line-height:1.6">${p.desc}</p></div>${calc}${facts(p.facts)}`)}};

V[7]={name:'7. Number First',note:'Big type, no icons. The list is ordered by price so the cheapest way in is at the top. The plan page opens with a dark panel that holds one figure, with the detail on a lighter sheet beneath.',
 list:()=>`<div class="body" style="gap:8px"><div class="hd" style="padding-bottom:12px"><h1>Insure</h1><p class="mu s13">Cheapest way in first.</p></div>
  ${[...plans].sort((a,b)=>a.from-b.from).map(p=>`<button data-a="sel:${p.id}" style="display:flex;align-items:baseline;gap:16px;padding:20px 8px;border-top:1px solid var(--bd);width:100%;border-radius:0;${S.sel===p.id?'background:var(--sel);':''}"><span class="tab" style="font-size:34px;letter-spacing:-.03em;width:116px;flex:none;line-height:1">${p.fromTxt}</span><span class="grow"><span class="s14">${p.name}</span><span class="mu s12">a month · ${p.runs.toLowerCase()}</span></span></button>`).join('')}
  <div style="border-top:1px solid var(--bd);padding-top:20px">${soonBlock}</div></div>`,
 detail:()=>{const p=cur();return `<div class="body" style="padding:0;gap:0"><div style="background:#111;color:#fff;padding:20px 20px 32px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:20px"><div class="back" style="color:#a1a1aa;margin-top:0">${svg('<path d="M15 6l-6 6 6 6"/>',16,1.8)}Insure</div><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;color:#a1a1aa">${p.name}</span><span class="tab" style="font-size:68px;letter-spacing:-.04em;line-height:1">${p.fromTxt}</span><span style="font-size:14px;color:#a1a1aa">a month, to start</span></div></div>
  <div style="padding:24px 16px;display:flex;flex-direction:column;gap:24px"><p class="s14" style="line-height:1.6">${p.desc}</p>${checks(p)}${facts(p.facts.filter(f=>f[0]!=='Premiums from'))}</div></div>${foot}`}};

V[8]={name:'8. Open In Place',note:'Nothing needs a new page just to be understood. Tapping a plan opens it in the list with the short version and two actions. The full plan page is about the journey: four steps from start to claim.',
 list:()=>`<div class="body"><div class="hd"><h1>Insure</h1></div><div style="display:flex;flex-direction:column;gap:8px">${plans.map(p=>{const open=S.exp===p.id;return `<div style="border-radius:16px;background:var(--tile);overflow:hidden"><button data-a="exp:${p.id}" style="display:flex;align-items:center;gap:12px;padding:16px;width:100%">${ico(p.id)}<span class="grow"><span class="s14" style="font-weight:500">${p.name}</span><span class="mu s12">from ${p.fromTxt} a month</span></span>${down(open)}</button>${open?`<div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:12px"><p class="s13" style="line-height:1.6">${p.desc}</p><ul class="check" style="display:flex;flex-direction:column;gap:8px">${p.benefits.slice(0,2).map(b=>`<li class="s13">${tick}<span>${b}</span></li>`).join('')}</ul><div style="display:flex;gap:8px"><button class="btn" style="flex:1;height:40px;font-size:14px" data-a="sel:${p.id}">See Full Plan</button></div></div>`:''}</div>`}).join('')}</div>${soonBlock}</div>`,
 detail:()=>{const p=cur();const steps=[['Create your insurance profile','Once. We keep it for every plan you add later.'],['Choose your cover',p.choose],['Review and pay','Premiums come straight from your account. You see the total before you confirm.'],['Claim when you need to','File from the policy page. Payout within 48 to 72 hours of an approved claim.']];
  return det(`<div style="display:flex;flex-direction:column;gap:12px">${ico(p.id,44)}<h1 class="title">${p.name}</h1><p class="mu s14" style="line-height:1.6">${p.line} From <span class="tab">${p.fromTxt}</span> a month.</p></div>
  <ol style="display:flex;flex-direction:column;gap:20px">${steps.map((s,i)=>`<li style="display:flex;gap:16px"><span class="tab" style="width:28px;height:28px;border-radius:50%;background:${i===0?'var(--am)':'var(--tile)'};color:${i===0?'#111':'var(--tx)'};display:flex;align-items:center;justify-content:center;font-size:13px;flex:none">${i+1}</span><span style="display:flex;flex-direction:column;gap:2px"><span class="s14" style="font-weight:500">${s[0]}</span><span class="mu s13" style="line-height:1.5">${s[1]}</span></span></li>`).join('')}</ol>${facts(p.facts)}`)}};

V[9]={name:'9. Plain Questions',note:'Each plan is introduced by the sentence a customer would say, and the plan page answers the questions they actually ask, one at a time, in plain language.',
 list:()=>`<div class="body"><div class="hd"><h1>Insure</h1><p class="mu s13" style="line-height:1.6">What would you like to take care of?</p></div>
  <div style="display:flex;flex-direction:column;gap:12px">${plans.map(p=>`<button data-a="sel:${p.id}" style="padding:20px;border-radius:20px;background:var(--tile);border:1px solid ${S.sel===p.id?'var(--tx)':'transparent'};display:flex;flex-direction:column;gap:8px;width:100%"><span style="font-size:18px;line-height:1.35;letter-spacing:-.01em">${p.pitch}</span><span class="mu s12">${p.name} · from <span class="tab">${p.fromTxt}</span> a month</span></button>`).join('')}</div>${soonBlock}</div>`,
 detail:()=>{const p=cur();const q=[['What does it cover?',p.desc+' '+p.benefits[0]+'.'],['What will it cost me?',p.cost],['When do I get paid?','Within 48 to 72 hours of an approved claim.'],['Can I stop whenever I want?','Yes. You can cancel from the policy page at any time. If a plan pays out when you stop, we show you the exact amount before you confirm.'],['What do I need to make a claim?',p.claim.join(', ')+'.']];
  return det(`<div style="display:flex;flex-direction:column;gap:8px"><h1 class="title">${p.name}</h1><p class="mu s14" style="line-height:1.6">${p.pitch}.</p></div><div>${q.map((x,i)=>`<div class="acc"><button data-a="faq:${i}">${x[0]}${down(S.faq===i)}</button>${S.faq===i?`<div>${x[1]}</div>`:''}</div>`).join('')}</div>`)}};

V[10]={name:'10. Key Facts Sheet',note:'For the customer who wants the whole picture before deciding. A compact table to compare, and a plan page laid out like a clean one-page summary of the terms.',
 list:()=>`<div class="body"><div class="hd"><h1>Insure</h1></div>
  <div style="display:grid;grid-template-columns:1fr 84px 92px;gap:8px;padding:0 8px;font-size:12px;color:var(--mu)"><span>Plan</span><span>From</span><span>Runs</span></div>
  <div>${plans.map(p=>`<button data-a="sel:${p.id}" style="display:grid;grid-template-columns:1fr 84px 92px;gap:8px;align-items:center;padding:16px 8px;border-top:1px solid var(--bd);width:100%;${S.sel===p.id?'background:var(--sel);':''}"><span class="s14">${p.short}</span><span class="s13 tab">${p.fromTxt}</span><span class="s13 mu tab">${p.runsShort}</span></button>`).join('')}<div style="border-top:1px solid var(--bd)"></div></div>
  <p class="mu s12" style="padding:0 8px;line-height:1.5">Prices are per month. Tap a plan for the full summary.</p>${soonBlock}</div>`,
 detail:()=>{const p=cur();const sec=(n,t,b)=>`<div style="display:flex;flex-direction:column;gap:8px"><h2 class="s14" style="font-weight:500"><span class="mu tab">${n}</span>&nbsp; ${t}</h2>${b}</div>`;
  const waiting=p.id==='hc'?[['Waiting period','90 days for natural causes'],['Accidents','Covered at once']]:[];
  return det(`<div style="display:flex;flex-direction:column;gap:4px"><span class="mu s12">Plan summary</span><h1 class="title">${p.name}</h1></div>
  ${sec('1','In one line',`<p class="s14" style="line-height:1.6">${p.desc}</p>`)}
  ${sec('2','The terms',facts([...p.facts.filter(f=>f[0]!=='Provider'),...waiting,['Payout','48 to 72 hours after approval']]))}
  ${sec('3','To make a claim, have ready',`<ul class="check" style="display:flex;flex-direction:column;gap:8px">${p.claim.map(c=>`<li class="s13">${tick}<span>${c}</span></li>`).join('')}</ul>`)}
  ${sec('4','Provided by',`<p class="s14">${PROVIDER}</p>`)}`)}};

/* ---------- engine ---------- */
const $=s=>document.querySelector(s);
function render(){
  const v=V[S.v];
  $('#pills').innerHTML=Object.keys(V).map(k=>`<button class="pill ${+k===S.v?'on':''}" data-a="v:${k}">${V[k].name}</button>`).join('');
  $('#vnote').textContent=v.note;
  $('#listScreen').innerHTML=v.list();
  $('#detScreen').innerHTML=v.detail();
  $('#detCap').textContent='Plan page · '+cur().name;
  if(S.v===6&&cur().kind==='save') upd6();
}
function upd6(){
  const p=cur();const paid=S.prem*12*S.years;
  const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  set('premV',money(S.prem)+' a month');set('yrsV',S.years+' years');set('outV',money(paid*1.25));
  set('outN','You pay in '+money(paid)+'. Illustration only: StarLife confirms the final figures.');
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const [a,arg]=el.dataset.a.split(':');
  if(a==='v'){S.v=+arg;S.tab='overview';S.acc=0;S.faq=0}
  else if(a==='sel'){S.sel=arg;S.tab='overview';S.acc=0;S.faq=0;S.exp=arg}
  else if(a==='exp'){S.exp=S.exp===arg?null:arg;if(S.exp)S.sel=arg}
  else if(a==='filter')S.filter=arg;
  else if(a==='tab')S.tab=arg;
  else if(a==='tier')S.tier=+arg;
  else if(a==='sum')S.sum=+arg;
  else if(a==='acc')S.acc=S.acc===+arg?-1:+arg;
  else if(a==='faq')S.faq=S.faq===+arg?-1:+arg;
  else if(a==='start'){toast('Next: create your insurance profile, then choose your cover');return}
  render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.r;if(!k)return;
  S[k]=+e.target.value;upd6();
});
$('#themeBtn').addEventListener('click',()=>{
  S.dark=!S.dark;document.documentElement.dataset.theme=S.dark?'dark':'light';
  $('#themeBtn').textContent=S.dark?'Light mode':'Dark mode';
});
render();
</script>
