<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Check Your Company: 4 Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--page:#ececea;--surf:#fff;--tile:#f4f4f5;--tileh:#ebebed;--bd:#e5e7eb;--tx:#0b0b0c;--mu:#6b7280;--am:#FFC423;--amsoft:#fff6dc;--act:#0b0b0c;--shadow:0 24px 60px -24px rgba(0,0,0,.3)}
  [data-theme=dark]{--page:#050505;--surf:#141414;--tile:#1c1c1c;--tileh:#232323;--bd:#2a2a2a;--tx:#f5f5f5;--mu:#a3a3a3;--amsoft:#2a2410;--act:#f5f5f5;--shadow:0 24px 60px -24px rgba(0,0,0,.9)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;font-size:14px}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  h1,h2,h3,p{margin:0;font-weight:inherit}
  .mu{color:var(--mu)} .s12{font-size:12px} .md{font-weight:500} .tab{font-variant-numeric:tabular-nums}
  .bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .bar h1{font-size:14px;font-weight:500}
  .pills,.seg{display:inline-flex;gap:4px}
  .seg{background:var(--tile);border-radius:12px;padding:4px}
  .pill,.seg button{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--mu);min-height:36px}
  .pill.on,.seg button.on{background:var(--am);color:#111;font-weight:500}
  .note-bar{font-size:13px;color:var(--mu);line-height:1.5;max-width:980px} .note-bar b{color:var(--tx);font-weight:500}
  .stage{padding:32px 16px 80px;display:flex;justify-content:center;gap:32px;flex-wrap:wrap;align-items:flex-start}
  .cap{font-size:12px;color:var(--mu);text-align:center;margin-bottom:8px}
  .frame{width:460px;max-width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
  .frame.phone{width:375px}
  .page{padding:28px;display:flex;flex-direction:column;gap:24px}
  .phone .page{padding:20px 12px}
  .back{display:flex;align-items:center;gap:8px;color:var(--mu)}
  .prog{display:flex;gap:6px}.prog i{flex:1;height:4px;border-radius:4px;background:var(--tile)}.prog i.on{background:var(--am);opacity:.6}.prog i.now{background:var(--am)}
  .hd{text-align:center;display:flex;flex-direction:column;gap:8px}
  .hd h2{font-size:22px;font-weight:500;letter-spacing:-.02em} .hd p{color:var(--mu)}
  .sec{display:flex;flex-direction:column;gap:8px}
  .sh{display:flex;align-items:center;justify-content:space-between;min-height:24px}
  .fact{display:flex;justify-content:space-between;gap:24px;padding:4px 0}
  .fact .v{text-align:right;min-width:0}
  .stk{display:flex;flex-direction:column;gap:2px;padding:4px 0}
  .person{display:flex;align-items:center;gap:12px;padding:6px 0}
  .av{width:36px;height:36px;border-radius:50%;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:none}
  .ico{width:40px;height:40px;border-radius:8px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none;color:#b7860b}
  [data-theme=dark] .ico{color:var(--am)}
  .co{display:flex;align-items:center;gap:12px} .grow{flex:1;min-width:0}
  .btn{height:44px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
  .btn.am{background:var(--am);color:#111} .btn.out{border:1px solid var(--bd)} .btn.dis{opacity:.4;pointer-events:none}
  .radio{display:flex;gap:8px}
  .rad{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:12px}
  .rad.on{border-color:var(--act)}
  .rad .t{display:flex;flex-direction:column}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center}
  .rad.on .dot{background:var(--act);border-color:var(--act)} .rad.on .dot::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--surf)}
  .link{text-decoration:underline;text-underline-offset:3px;color:var(--mu)} .link:hover{color:var(--tx)}
  .chev{transition:transform .2s} .open .chev{transform:rotate(180deg)}
  .hr{height:1px;background:var(--bd)}
  .rule{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
  .lead{font-size:16px;line-height:1.6}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}} .in{animation:in .2s ease}
</style>
</head>
<body>
<div class="bar">
  <div class="row">
    <h1>Check Your Company: what GCB holds, and whether the signatories are current</h1>
    <div class="row" style="gap:12px"><div class="pills" id="pills"></div>
      <div class="seg" id="theme"><button data-t="light" class="on">Light</button><button data-t="dark">Dark</button></div></div>
  </div>
  <p class="note-bar" id="note"></p>
</div>
<div class="stage" id="stage"></div>

<script>
const CO={name:'Adinkra Textiles Ltd',type:'Limited company',addr:'Plot 14 Industrial Area, North Kaneshie, Accra',phone:'+233 30 222 4410',email:'info@adinkratextiles.com',rule:'Both to sign'};
const SIG=[['Yaw Oppong','Managing Director','A'],['Esther Appiah','Finance Director','B'],['Ransford Gyasi','Executive Director','A']];
const I={
  bld:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>',
  chev:'<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
  pen:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
};
const NOTES=[
 ['Signatories lead, details fold','The question is about who signs, so they come first, each with initials and their role under the name. The signing rule sits on the section heading. The company is one row with its details behind a toggle.'],
 ['Stacked, not side by side','Same order as today, but every value sits under its label instead of across from it. Long addresses and roles stop running into the label, and the phone stops wrapping into ragged right columns.'],
 ['The answer is the button','No radio and Continue. Two buttons answer the question directly: Yes, They Still Sign moves on, Someone Has Changed goes to the update-first screen. One tap instead of two.'],
 ['Read as a sentence','The company is summarised in one line and the signatories as people. The question is phrased with the rule in it. Details stay one tap away for anyone who wants the address and phone.']
];
let V=1, st={ans:null, open:false};
const $=s=>document.querySelector(s);
const ini=n=>n.split(' ').map(w=>w[0]).join('');
const shell=(b,title='Check Your Company',desc='')=>`<div class="page"><div class="back">${I.back}<span>Back</span></div>
  <div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i><i></i><i></i><i></i><i></i></div>
  <div class="hd"><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${b}</div>`;
const radio=()=>`<div class="sec"><p class="md">Do they still sign?</p><div class="radio">${['Yes','No'].map(o=>`<button class="rad ${st.ans===o?'on':''}" data-ans="${o}"><span class="dot"></span>${o}</button>`).join('')}</div></div>
  <button class="btn am ${st.ans?'':'dis'}">Continue</button>`;
const coRow=(right=`<button data-tog class="${st.open?'open':''} mu" aria-label="Details">${I.chev}</button>`)=>`<div class="co"><span class="ico">${I.bld}</span><span class="grow"><span class="md" style="display:block">${CO.name}</span><span class="mu s12">${CO.type}</span></span>${right}</div>`;
const details=()=>st.open?`<div class="in" style="padding-left:52px">${[['Address',CO.addr],['Phone',CO.phone],['Email',CO.email]].map(([l,v])=>`<div class="stk"><span class="mu s12">${l}</span><span class="${l==='Phone'?'tab':''}">${v}</span></div>`).join('')}</div>`:'';
const people=()=>SIG.map(([n,r,c])=>`<div class="person"><span class="av">${ini(n)}</span><span class="grow"><span style="display:block">${n}</span><span class="mu s12">${r} · Signatory ${c}</span></span></div>`).join('');

function body(){switch(V){
case 1: return shell(`
  <div class="sec"><div class="sh"><span class="md">Who Signs</span><span class="rule">${I.pen}${CO.rule}</span></div>${people()}</div>
  <div class="sec">${coRow()}${details()}</div>${radio()}`);
case 2: return shell(`
  <div class="sec"><span class="md">${CO.name}</span>${[['Set up as',CO.type],['Address',CO.addr],['Phone',CO.phone],['Email',CO.email]].map(([l,v])=>`<div class="stk"><span class="mu s12">${l}</span><span class="${l==='Phone'?'tab':''}">${v}</span></div>`).join('')}</div>
  <div class="sec"><span class="md">Who Signs</span>${SIG.map(([n,r,c])=>`<div class="stk"><span>${n}</span><span class="mu s12">${r} · Signatory ${c}</span></div>`).join('')}
    <div class="stk"><span class="mu s12">Signing rule</span><span>${CO.rule}</span></div></div>${radio()}`);
case 3: return shell(`
  <div class="sec">${coRow()}${details()}</div>
  <div class="sec"><div class="sh"><span class="md">Who Signs</span><span class="rule">${I.pen}${CO.rule}</span></div>${people()}</div>
  <div class="sec" style="gap:8px"><p class="md">Do they still sign?</p>
    <button class="btn am">Yes, They Still Sign</button><button class="btn out">Someone Has Changed</button></div>`);
case 4: return shell(`
  <p class="lead">${SIG.length} people sign for <span class="md">${CO.name}</span>, a ${CO.type.toLowerCase()}. ${CO.rule==='Both to sign'?'Two of them':'One of them'} must sign each instruction.</p>
  <div class="sec">${people()}</div>
  <button class="link s12" data-tog style="align-self:flex-start">${st.open?'Hide':'Show'} company details</button>
  ${st.open?`<div class="in">${[['Address',CO.addr],['Phone',CO.phone],['Email',CO.email]].map(([l,v])=>`<div class="stk"><span class="mu s12">${l}</span><span>${v}</span></div>`).join('')}</div>`:''}
  ${radio()}`,'Check Your Company');
}}
function render(){
  $('#pills').innerHTML=NOTES.map((n,i)=>`<button class="pill ${i+1===V?'on':''}" data-v="${i+1}">${i+1}</button>`).join('');
  $('#note').innerHTML=`<b>${V}. ${NOTES[V-1][0]}.</b> ${NOTES[V-1][1]}`;
  const h=body(); $('#stage').innerHTML=`<div><p class="cap">Desktop</p><div class="frame">${h}</div></div><div><p class="cap">Phone</p><div class="frame phone">${h}</div></div>`;
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'); if(v){V=+v.dataset.v;st={ans:null,open:false};render();return;}
  const t=e.target.closest('[data-t]'); if(t){document.documentElement.dataset.theme=t.dataset.t;document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b===t));return;}
  const a=e.target.closest('[data-ans]'); if(a){st.ans=a.dataset.ans;render();return;}
  if(e.target.closest('[data-tog]')){st.open=!st.open;render();}
});
render();
</script>
</body>
</html>
