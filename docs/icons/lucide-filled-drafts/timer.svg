  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <defs>
    <mask id="gcb-fill-timer" maskUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28">
      <rect x="-2" y="-2" width="28" height="28" fill="#fff" stroke="none" />
      <g stroke="#000" fill="none">
        <line x1="12" x2="15" y1="14" y2="11" />
      </g>
    </mask>
  </defs>
  <g fill="currentColor" mask="url(#gcb-fill-timer)">
    <circle cx="12" cy="14" r="8" />
  </g>
  <line x1="10" x2="14" y1="2" y2="2" />
</svg>
