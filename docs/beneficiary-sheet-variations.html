<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beneficiary sheet: 10 ways</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#f1f1f0;--page:#fafafa;--modal:#fff;--fg:#0a0a0a;--muted:#737373;--line:#ececec;--tile:#f4f4f3;--btn:#ebebeb;--primary:#ffc423;--pfg:#2b1d00;--ok:#15803d;--okbg:#dcfce7;--danger:#b51c3b;--av:#dbeafe;--avi:#1e4fa0;--warnbg:#fff3c4;--warn:#7a5b00}
.dark{--bg:#050505;--page:#0b0b0b;--modal:#121212;--fg:#f5f5f5;--muted:#9a9a9a;--line:#262626;--tile:#1c1c1c;--btn:#242424;--ok:#4ade80;--okbg:#0b2a17;--danger:#ae324b;--av:#1b2b4b;--avi:#a7c4f2;--warnbg:#3a3410;--warn:#f2d86a}
*{box-sizing:border-box}body{margin:0;font-family:"Open Sans",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--page);border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;font-weight:500;margin:0;letter-spacing:-.02em}header.top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
button.theme{border:1px solid var(--line);background:var(--modal);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:34px 28px;padding:28px;max-width:1700px;margin:0 auto}
.v h2{font-size:15px;font-weight:500;margin:0 0 3px}.goal{font-size:12px;color:var(--ok);margin:0 0 4px;font-weight:500}.why{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0 0 12px;min-height:56px}
.sheet{width:100%;max-width:380px;height:620px;background:var(--modal);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:99px;background:var(--btn);display:flex;align-items:center;justify-content:center;color:var(--muted)}.x svg{width:15px;height:15px}
.hd{padding:22px 22px 0}.t{font-size:16px;font-weight:500;letter-spacing:-.01em}.sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.body{flex:1;padding:16px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.ft{padding:12px 22px 20px;display:flex;flex-direction:column;gap:8px}
.btn{height:46px;border-radius:99px;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:14px;gap:8px}.btn svg{width:16px;height:16px}
.btn.p{background:var(--primary);color:var(--pfg)}.btn.d{color:var(--danger)}.btn.g{background:transparent;height:38px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.av{border-radius:99px;background:var(--av);color:var(--avi);display:flex;align-items:center;justify-content:center;font-weight:400;flex-shrink:0}
.card{background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:13px;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
.cp{display:inline-flex;align-items:center;gap:6px}.cp svg{width:13px;height:13px;color:var(--muted)}
.tab{font-variant-numeric:tabular-nums}.mut{color:var(--muted)}.sm{font-size:12px}
.li{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:13px}.li .m{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--okbg);color:var(--ok)}.chip.w{background:var(--warnbg);color:var(--warn)}.chip svg{width:11px;height:11px}
.circ{display:flex;justify-content:center;gap:22px;padding:6px 0}.circ div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px}.circ i{width:50px;height:50px;border-radius:99px;background:var(--primary);color:var(--pfg);display:flex;align-items:center;justify-content:center}.circ i svg{width:19px;height:19px}.circ .s i{background:var(--btn);color:var(--fg)}
.amtbox{border:1px solid var(--line);background:var(--tile);border-radius:16px;height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:20px}.amtbox small{font-size:13px;color:var(--muted)}
.lnk{font-size:13px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.sec{font-size:12px;color:var(--muted);margin-bottom:2px}
</style></head><body>
<header class="top"><div><h1>Beneficiary sheet: 10 ways</h1><p>Each one aims for something different, named under the title. Same person throughout: Abena Osei, Stanbic Bank Ghana.</p></div><button class="theme" onclick="document.body.classList.toggle('dark')">Light / dark</button></header>
<main id="root"></main>
<script>
const I=n=>`<i data-lucide="${n}"></i>`;
const AV=(s,t)=>`<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.34)}px">${t||"AO"}</div>`;
const X=`<span class="x">${I("x")}</span>`;
const CP=`<span class="cp tab">1089 3322 1100 ${I("copy")}</span>`;
const kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`;
const V=[
{n:"1 · Pay first",goal:"Goal: get to the payment in one tap",why:"The reason someone opens this is almost always to pay. Send is huge and says how it will go; the details sit quietly under it.",
h:`<div class="hd" style="display:flex;gap:12px;align-items:center">${AV(44)}<div><div class="t">Abena Osei</div><div class="sub">Stanbic Bank Ghana · ··· 1100</div></div></div>`,
b:`<div style="display:flex;flex-direction:column;gap:12px;margin-top:6px"><div class="btn p" style="height:58px;font-size:15px">${I("send")}Send money</div><div class="sm mut" style="text-align:center">Arrives in minutes · no fee to Stanbic</div></div><div class="card" style="margin-top:10px">${kv("Account",CP)}${kv("Currency","GHS")}</div>`,
f:`<div class="row2"><div class="btn">Edit</div><div class="btn d">Remove</div></div>`},
{n:"2 · Identity card",goal:"Goal: feel like a real contact, recognise them instantly",why:"A large avatar and the account number as the main figure, like a contact card. Good for confirming you picked the right person before paying.",
h:"",b:`<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:30px">${AV(84)}<div class="t" style="font-size:18px;margin-top:4px">Abena Osei</div><div class="sub" style="margin:0">Bank account · Stanbic Bank Ghana</div><div class="tab" style="font-size:22px;margin-top:14px;letter-spacing:.02em">1089 3322 1100</div><div class="lnk mut" style="display:flex;gap:6px;align-items:center">${I("copy")}Copy number</div></div>`,
f:`<div class="btn p">Send money</div><div class="row2"><div class="btn">Edit</div><div class="btn d">Remove</div></div>`},
{n:"3 · History with them",goal:"Goal: show the relationship, not just the record",why:"Pulled from the ledger: when you last paid, how much, and how often. Helps you decide the amount without leaving the sheet. Only real transactions are shown.",
h:`<div class="hd"><div class="t">Abena Osei</div><div class="sub">Stanbic Bank Ghana · ··· 1100</div></div>`,
b:`<div class="card" style="padding:14px 16px"><div class="sm mut">Paid in the last 90 days</div><div style="font-size:26px;margin-top:2px" class="tab">GHS 750.00</div><div class="sm mut" style="margin-top:2px">3 payments · last on 3 Oct</div></div><div><div class="sec">Recent</div>${["3 Oct|GHS 250.00","5 Sep|GHS 250.00","7 Aug|GHS 250.00"].map(x=>`<div class="li"><span>${x.split("|")[0]}</span><span class="tab">${x.split("|")[1]}</span></div>`).join("")}</div>`,
f:`<div class="btn p">Send money</div><div class="row2"><div class="btn">Edit</div><div class="btn d">Remove</div></div>`},
{n:"4 · Just the facts",goal:"Goal: quietest possible, nothing boxed",why:"No card, no avatar, no hairlines. Name, two lines of text, and text links. The most 'calm and minimal' reading of the house style.",
h:`<div class="hd" style="padding-top:34px"><div class="t" style="font-size:20px">Abena Osei</div></div>`,
b:`<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px"><div class="tab" style="font-size:15px">1089 3322 1100</div><div class="mut">Stanbic Bank Ghana · GHS</div></div>`,
f:`<div class="btn p">Send money</div><div style="display:flex;justify-content:center;gap:26px;padding:8px"><span class="lnk">Copy number</span><span class="lnk">Edit</span><span class="lnk" style="color:var(--danger)">Remove</span></div>`},
{n:"5 · Amount right here",goal:"Goal: fewest steps, skip the next screen",why:"Type the amount in the sheet and go straight to review. Saves a screen for the common case. The one-time code and review still come after, so safety is unchanged.",
h:`<div class="hd" style="display:flex;gap:12px;align-items:center">${AV(40)}<div><div class="t">Abena Osei</div><div class="sub">Stanbic · ··· 1100</div></div></div>`,
b:`<div style="margin-top:10px"><div class="sec">Amount</div><div class="amtbox"><small>GHS</small><span class="tab mut">0.00</span></div><div class="sm mut" style="margin-top:8px">Last time: GHS 250.00 on 3 Oct</div></div>`,
f:`<div class="btn p">Review payment</div><div class="row2"><div class="btn">Edit</div><div class="btn d">Remove</div></div>`},
{n:"6 · Share the details",goal:"Goal: give someone these account details",why:"Beneficiaries are also how people tell others where to pay them. One tap copies a ready-to-paste block (name, bank, number), instead of three copy taps.",
h:`<div class="hd"><div class="t">Abena Osei</div><div class="sub">Bank account</div></div>`,
b:`<div class="card" style="padding:16px;font-size:13.5px;line-height:1.7"><div>Abena Osei</div><div class="tab">1089 3322 1100</div><div class="mut">Stanbic Bank Ghana</div></div><div class="row2"><div class="btn">${I("copy")}Copy all</div><div class="btn">${I("share-2")}Share</div></div>`,
f:`<div class="btn p">Send money</div><div class="row2"><div class="btn">Edit</div><div class="btn d">Remove</div></div>`},
{n:"7 · Round actions",goal:"Goal: match the receipt sheet",why:"Same three round buttons the transaction receipt uses (Send, Edit, Share), so both sheets share one action language. No full-width buttons at all.",
h:`<div class="hd"><div class="t">Abena Osei</div><div class="sub">Bank account</div></div>`,
b:`<div class="card" style="margin-top:6px">${kv("Account Number",CP)}${kv("Bank / Provider","Stanbic Bank Ghana")}${kv("Currency","GHS")}</div>`,
f:`<div class="circ"><div><i>${I("send")}</i>Send</div><div class="s"><i>${I("pencil")}</i>Edit</div><div class="s"><i>${I("share-2")}</i>Share</div><div class="s"><i style="color:var(--danger)">${I("trash-2")}</i>Remove</div></div>`},
{n:"8 · Trust and status",goal:"Goal: reassure before sending money to a stranger",why:"Honest status up front: whether the name was checked by the bank, when she was added, and whether a first payment will be held. Useful for new payees and business accounts.",
h:`<div class="hd"><div class="t">Abena Osei</div><div class="sub">Stanbic Bank Ghana · ··· 1100</div><div style="margin-top:10px;display:flex;gap:6px"><span class="chip">${I("check")}Name matched by Stanbic</span></div></div>`,
b:`<div class="card">${kv("Added","12 Aug 2026")}${kv("Payments","3, last on 3 Oct")}${kv("Next payment","Normal, no hold")}</div>`,
f:`<div class="btn p">Send money</div><div class="row2"><div class="btn">Edit</div><div class="btn d">Remove</div></div>`},
{n:"9 · Repeat last payment",goal:"Goal: one tap for the thing you always do",why:"For rent, school fees, a monthly helper. The main button repeats the last payment (amount and note prefilled, still reviewed and authorised). 'Different amount' is the escape.",
h:`<div class="hd" style="display:flex;gap:12px;align-items:center">${AV(44)}<div><div class="t">Abena Osei</div><div class="sub">Stanbic Bank Ghana · ··· 1100</div></div></div>`,
b:`<div class="card" style="padding:16px;margin-top:8px"><div class="sm mut">Last payment · 3 Oct</div><div style="font-size:26px;margin-top:2px" class="tab">GHS 250.00</div><div class="sm mut" style="margin-top:2px">Note: Monthly support</div></div><div class="sm mut">You have paid this 3 months running.</div>`,
f:`<div class="btn p">Repeat GHS 250.00</div><div class="row2"><div class="btn">Different amount</div><div class="btn">Edit</div></div><div class="btn g d">Remove</div>`},
{n:"10 · A biller, not a person",goal:"Goal: bills get their own shape",why:"For ECG, DStv or GWCL the point is the reference and the last bill, not a bank account. Logo circle, the meter number, and 'Pay GHS 210' from the last bill. Shown for ECG.",
h:`<div class="hd" style="display:flex;gap:12px;align-items:center"><div class="av" style="width:44px;height:44px;background:#d9381e;color:#fff;font-size:13px">ECG</div><div><div class="t">ECG PowerApp</div><div class="sub">Bill · Prepaid meter</div></div></div>`,
b:`<div class="card" style="margin-top:8px">${kv("Meter number","<span class='tab'>0245 118 902</span>")}${kv("Account name","Abena Osei")}${kv("Last bill","<span class='tab'>GHS 210.00</span> · 28 Sep")}</div><div class="sm mut">Prepaid top-ups credit within a minute.</div>`,
f:`<div class="btn p">Top up meter</div><div class="row2"><div class="btn">Edit</div><div class="btn d">Remove</div></div>`},
];
const root=document.getElementById("root");
V.forEach(v=>root.insertAdjacentHTML("beforeend",`<section class="v"><h2>${v.n}</h2><div class="goal">${v.goal}</div><p class="why">${v.why}</p><div class="sheet">${X}${v.h}<div class="body">${v.b}</div><div class="ft">${v.f}</div></div></section>`));
lucide.createIcons();
</script></body></html>
