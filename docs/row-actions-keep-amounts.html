<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Row actions that keep the amounts</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root { --bg:#f1f1f0; --page:#fafafa; --card:#fff; --fg:#0a0a0a; --muted:#737373; --line:#ececec; --tile:#f4f4f3; --fieldline:#e4e4e4; --danger:#b51c3b;
    --c1:#e0eedd; --c2:#dbeafe; --c3:#f5ebf7; --c4:#ebe8de; --c5:#fce7f3; --c6:#e4f1f4; --i1:#2f6b3c; --i2:#1e4fa0; --i3:#7a3f8a; --i4:#6b5f3a; --i5:#a23464; --i6:#1b6b78; }
  .dark { --bg:#050505; --page:#0b0b0b; --card:#181818; --fg:#f5f5f5; --muted:#9a9a9a; --line:#262626; --tile:#232323; --fieldline:#2e2e2e; --danger:#ae324b;
    --c1:#1f3524; --c2:#1b2b4b; --c3:#35283d; --c4:#37321f; --c5:#40233a; --c6:#173238; --i1:#a3dcb0; --i2:#a7c4f2; --i3:#dcb4e8; --i4:#e0d29a; --i5:#f0b3d0; --i6:#8fd3df; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Open Sans",system-ui,sans-serif; background:var(--bg); color:var(--fg); font-size:14px; }
  header.top { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px; background:var(--page); border-bottom:1px solid var(--line); }
  header.top h1 { font-size:18px; font-weight:500; margin:0; letter-spacing:-0.02em; } header.top p { margin:2px 0 0; color:var(--muted); font-size:12.5px; }
  button.theme { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:10px; padding:8px 14px; cursor:pointer; font:inherit; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(520px,1fr)); gap:30px; padding:28px; max-width:1600px; margin:0 auto; }
  section.v h2 { font-size:15px; font-weight:500; margin:0 0 4px; } section.v .why { color:var(--muted); font-size:12.5px; line-height:1.5; margin:0 0 12px; min-height:54px; }
  .frame { background:var(--page); border:1px solid var(--line); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .lab { font-size:11px; color:var(--muted); padding:0 6px; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:6px; }
  .row { position:relative; display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:12px; cursor:pointer; }
  .row:hover, .row.on { background:var(--tile); }
  .av { width:40px; height:40px; border-radius:99px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; flex-shrink:0; }
  .mid { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; position:relative; }
  .nm { font-size:14px; } .dt { font-size:12px; color:var(--muted); white-space:nowrap; }
  .amt { text-align:right; display:flex; flex-direction:column; gap:2px; font-variant-numeric:tabular-nums; }
  .ib { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:9px; color:var(--muted); flex-shrink:0; }
  .ib svg { width:16px; height:16px; } .ib:hover { background:var(--card); color:var(--fg); } .ib.del:hover { color:var(--danger); }
  .acts { display:flex; gap:2px; }
  /* 1: slide */
  .s1 { display:flex; align-items:center; }
  .s1 .amt { transition:transform .2s cubic-bezier(.23,1,.32,1); }
  .s1 .acts { width:0; overflow:hidden; opacity:0; transition:width .2s cubic-bezier(.23,1,.32,1), opacity .15s; }
  .row:hover .s1 .acts, .row.on .s1 .acts { width:100px; opacity:1; margin-left:8px; }
  /* 2: split line swaps */
  .s2 { position:relative; height:36px; min-width:130px; }
  .s2 .amt { position:absolute; right:0; top:0; width:100%; }
  .s2 .amt .tot { display:block; }
  .s2 .sub, .s2 .acts { position:absolute; right:-6px; bottom:-4px; transition:opacity .12s; }
  .s2 .acts { opacity:0; } .s2 .acts .ib { width:26px; height:22px; border-radius:7px; } .s2 .acts .ib svg { width:14px; height:14px; }
  .row:hover .s2 .sub, .row.on .s2 .sub { opacity:0; } .row:hover .s2 .acts, .row.on .s2 .acts { opacity:1; }
  /* 3: left line swaps */
  .s3 .links { position:absolute; left:0; bottom:0; display:flex; gap:12px; font-size:12px; opacity:0; transition:opacity .12s; }
  .s3 .links span { color:var(--fg); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--fieldline); } .s3 .links span:last-child { color:var(--muted); }
  .row:hover .s3 .dt, .row.on .s3 .dt { opacity:0; } .row:hover .s3 .links, .row.on .s3 .links { opacity:1; }
  .s3 .dt { transition:opacity .12s; }
  /* 4: always more */
  .s4 .ib { color:var(--muted); opacity:.55; } .row:hover .s4 .ib, .row.on .s4 .ib { opacity:1; background:var(--card); }
  /* 5: floating toolbar */
  .tb { position:absolute; right:10px; top:-14px; display:flex; gap:2px; padding:3px; background:var(--card); border:1px solid var(--fieldline); border-radius:11px; box-shadow:0 4px 14px rgba(0,0,0,.08); opacity:0; transform:translateY(3px); transition:opacity .12s, transform .15s; z-index:3; }
  .tb .ib { width:30px; height:28px; border-radius:8px; } .tb .ib:hover { background:var(--tile); }
  .row:hover .tb, .row.on .tb { opacity:1; transform:none; }
</style>
</head>
<body>
<header class="top">
  <div><h1>Row actions that keep the amounts</h1><p>The amounts stay readable on hover in every option. First row of each list is shown hovered.</p></div>
  <button class="theme" onclick="document.body.classList.toggle('dark')">Light / dark</button>
</header>
<main id="root"></main>
<script>
const G=[
 {n:"Family monthly", sub:"4 members", tot:"GHS 800.00", per:"GHS 200 each", c:2},
 {n:"Susu circle", sub:"8 members", tot:"GHS 4,000.00", per:"GHS 500 each", c:4},
 {n:"Office lunch", sub:"6 members", tot:"GHS 310.00", per:"Custom split", c:6},
 {n:"Church dues", sub:"12 members", tot:"GHS 1,200.00", per:"GHS 100 each", c:3},
];
const I=n=>`<i data-lucide="${n}"></i>`;
const av=g=>`<div class="av" style="background:var(--c${g.c});color:var(--i${g.c})">${g.n.split(" ").map(w=>w[0]).join("").slice(0,2)}</div>`;
const acts=`<span class="acts"><span class="ib">${I("send")}</span><span class="ib">${I("pencil")}</span><span class="ib del">${I("trash-2")}</span></span>`;
const left=g=>`<div class="mid"><span class="nm">${g.n}</span><span class="dt">${g.sub}</span></div>`;
const V=[
 {n:"1 · Amounts slide left, actions slide in", why:"At rest the amounts sit flush right. On hover they glide left and the three icons open up beside them. Nothing is hidden and nothing is reserved.",
  r:g=>`<div class="row">${av(g)}${left(g)}<div class="s1"><div class="amt"><span>${g.tot}</span><span class="dt">${g.per}</span></div>${acts}</div></div>`},
 {n:"2 · The split line becomes the actions", why:"The total stays put. Only the small second line (the split) swaps for compact icons, because it is the least important text in the row.",
  r:g=>`<div class="row">${av(g)}${left(g)}<div class="s2"><div class="amt"><span class="tot">${g.tot}</span></div><span class="dt sub">${g.per}</span>${acts}</div></div>`},
 {n:"3 · Text links under the name", why:"Amounts never move. The member count on the left swaps for plain links: Send, Edit, Delete. Quietest option, and text is clearer than icons.",
  r:g=>`<div class="row s3">${av(g)}<div class="mid"><span class="nm">${g.n}</span><span class="dt">${g.sub}</span><span class="links"><span>Send</span><span>Edit</span><span>Delete</span></span></div><div class="amt"><span>${g.tot}</span><span class="dt">${g.per}</span></div></div>`},
 {n:"4 · A faint ⋯ that is always there", why:"A small more button is always visible at the end of the row, a little stronger on hover. One tap opens Send, Edit, Delete. Works the same on touch and has no hover trick.",
  r:g=>`<div class="row s4">${av(g)}${left(g)}<div class="amt"><span>${g.tot}</span><span class="dt">${g.per}</span></div><span class="ib">${I("more-horizontal")}</span></div>`},
 {n:"5 · Floating toolbar on the row's corner", why:"Amounts and name stay untouched. A small toolbar pops over the top-right corner of the hovered row, like in Linear or Notion.",
  r:g=>`<div class="row">${av(g)}${left(g)}<div class="amt"><span>${g.tot}</span><span class="dt">${g.per}</span></div><span class="tb"><span class="ib">${I("send")}</span><span class="ib">${I("pencil")}</span><span class="ib del">${I("trash-2")}</span></span></div>`},
];
const root=document.getElementById("root");
V.forEach(v=>{
  const rows=G.map((g,i)=>v.r(g).replace('class="row','class="row'+(i===0?' on':'')+'')).join("");
  root.insertAdjacentHTML("beforeend",`<section class="v"><h2>${v.n}</h2><p class="why">${v.why}</p><div class="frame"><span class="lab">Hovering the first row, move your mouse over the others</span><div class="list">${rows}</div></div></section>`);
});
lucide.createIcons();
</script>
</body>
</html>
