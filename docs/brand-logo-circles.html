*{box-sizing:border-box}body{margin:0;font-family:"Open Sans",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--page);border-bottom:1px solid var(--line)}

.mark{position:relative;width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

.logo{width:100%;height:100%;object-fit:contain;display:block}

.circle{border-radius:99px;overflow:hidden;padding:0;width:40px;height:40px;border:1px solid rgba(0,0,0,.07);background:#fff}
.mono{font-weight:500;font-size:13px;letter-spacing:.02em;color:#fff}

.amt{font-variant-numeric:tabular-nums}.amt.c{color:var(--ok)}
.note{font-size:11.5px;color:var(--muted);margin:8px 6px 0}

 {n:"ECG PowerApp",k:"Bill",a:"- GHS 210.00",ico:"receipt",tint:"sand",st:"ECG",col:"#d9381e",soft:"#fde4df"},
 {n:"DStv Ghana",k:"Bill",a:"- GHS 165.00",ico:"receipt",tint:"sand",st:"DStv",col:"#0a3d91",soft:"#dde7fb"},

];
const I=n=>`<i data-lucide="${n}"></i>`;
const inb=t=>t.credit?`<span class="in">${I("arrow-down-left")}</span>`:"";
const plain=t=>`<div class="tile" style="border-radius:99px;background:var(--${t.tint});color:var(--${t.tint}i)">${I(t.ico)}</div>`;
const logo=t=>t.real?`<img class="logo" src="${L[t.real]}">`:`<span class="st" style="color:${t.col}">${t.st}</span>`;
const kindBadge=t=>`<span class="kb" style="background:var(--${t.tint});color:var(--${t.tint}i)">${I(t.ico)}</span>`;
const V=[
 {n:"A · White disc, logo inside",why:"The safest: any logo (wordmark or symbol, light or dark) sits on white with a hairline ring, so it always reads. Kind-of-payment circles stay tinted beside it.",
  m:t=>t.plain?plain(t):`<div class="disc w">${logo(t)}</div>`},
 {n:"B · Brand-colour disc",why:"The disc takes the brand's own colour and the logo is knocked out in white. Loudest, and only works for logos that come in a single colour. Needs a mark per brand.",
  m:t=>t.plain?plain(t):`<div class="disc" style="background:${t.col}">${t.real?`<img class="logo" src="${L[t.real]}" style="${t.real==="mtn"?"":"filter:brightness(0) invert(1)"}">`:`<span class="st" style="color:#fff">${t.st}</span>`}</div>`},
 {n:"C · Soft brand tint",why:"Closest to the tinted look you like: a pale wash of the brand colour with the full-colour logo on it. Each brand gets one tint token, like the kinds do.",
  m:t=>t.plain?plain(t):`<div class="disc" style="background:${t.soft||"var(--tile)"}">${logo(t)}</div>`},
 {n:"D · Logo fills the circle",why:"The logo is cropped to the circle with no padding. Looks best for round symbols (MTN, AT) and badly for wordmarks like DStv or ECG, so it needs per-brand artwork.",
  m:t=>t.plain?plain(t):`<div class="disc w full">${t.real?`<img class="logo" src="${L[t.real]}" style="padding:4px">`:`<span class="st" style="color:${t.col}">${t.st}</span>`}</div>`},
 {n:"E · White disc plus a kind badge",why:"As A, with a small tinted badge on the corner showing the kind (airtime, bill, scan). The brand tells you who, the badge keeps what. The money-in arrow moves to the amount.",
  m:t=>t.plain?plain(t):`<div class="disc w">${logo(t)}</div>${kindBadge(t)}`,noin:1},
];
const root=document.getElementById("root");
V.forEach(v=>{
 const rows=T.map(t=>`<div class="row"><div class="mark">${v.m(t)}${v.noin?"":inb(t)}</div><div class="mid"><span class="nm">${t.n}</span><span class="dt">${t.k}</span></div><span class="amt ${t.credit?"c":""}">${t.a}</span></div>`).join("");
 root.insertAdjacentHTML("beforeend",`<section class="v"><h2>${v.n}</h2><p class="why">${v.why}</p><div class="list">${rows}</div></section>`);
});
lucide.createIcons();
